:root{

function haversineKm(lat1,lon1,lat2,lon2){
 const R=6371,toRad=v=>v*Math.PI/180;
 const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
 const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
 return 2*R*Math.asin(Math.sqrt(a))
}
function taskDistanceKm(t){
 if(!state.workerLocation||t?.latitude==null||t?.longitude==null)return null;
 return haversineKm(state.workerLocation.latitude,state.workerLocation.longitude,Number(t.latitude),Number(t.longitude))
}
function distanceLabel(km){
 if(km==null||!Number.isFinite(km))return "";
 if(km<1)return `${Math.max(1,Math.round(km*1000))} m`;
 return `${km.toFixed(km<10?1:0)} km`
}
function sortTasksByDistance(list){
 const arr=[...(list||[])];
 if(!state.workerLocation)return arr;
 return arr.sort((a,b)=>{
   const da=taskDistanceKm(a),db=taskDistanceKm(b);
   if(da==null&&db==null)return 0;
   if(da==null)return 1;
   if(db==null)return -1;
   return da-db
 })
}
async function reverseGeocode(lat,lon){
 try{
   const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=18&addressdetails=1`;
   const res=await fetch(url,{headers:{"Accept-Language":"es-MX,es;q=0.9"}});
   if(!res.ok)throw new Error("geocode");
   const j=await res.json(),a=j.address||{};
   const street=a.road||a.pedestrian||a.residential||a.footway||a.cycleway||"";
   const number=a.house_number||"";
   const locality=a.neighbourhood||a.suburb||a.city_district||a.city||a.town||a.village||"";
   const parts=[];
   if(street)parts.push(`${street}${number?` ${number}`:""}`);
   if(locality&&(!street||!street.toLowerCase().includes(locality.toLowerCase())))parts.push(locality);
   const short=parts.slice(0,2).join(", ");
   return short||String(j.display_name||"").split(",").slice(0,2).join(",").trim()||"Ubicación actual";
 }catch(e){return "Ubicación actual"}
}

}

}
function toggleWorkerLocation(){
 if(workerGeoWatchId!=null){stopWorkerLocation();return}
 if(!navigator.geolocation){state.workerLocationError="Tu navegador no permite acceder a la ubicación.";return updateWorkerLocationUI()}
 state.workerLocationError="";
 workerGeoWatchId=navigator.geolocation.watchPosition(pos=>{
   state.workerLocation={latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy,updatedAt:Date.now()};
   const now=Date.now();
   if(!state.workerAddress||now-workerAddressUpdatedAt>30000){
     workerAddressUpdatedAt=now;
     if(!state.workerAddress)state.workerAddress="Buscando dirección…";
     reverseGeocode(pos.coords.latitude,pos.coords.longitude).then(address=>{
       if(workerGeoWatchId!=null&&state.workerLocation){state.workerAddress=address;updateWorkerLocationUI()}
     });
   }
   updateWorkerLocationUI()
 },err=>{
   workerGeoWatchId=null;
   state.workerLocationError=err.code===1?"Permiso de ubicación rechazado. Puedes activarlo desde Safari.":"No pudimos obtener tu ubicación. Intenta de nuevo.";
   updateWorkerLocationUI()
 },{enableHighAccuracy:true,maximumAge:5000,timeout:12000})
}
function useTaskCurrentLocation(btn){
 if(!navigator.geolocation){alert("Tu navegador no permite acceder a la ubicación.");return}
 const old=btn?.innerHTML;if(btn){btn.disabled=true;btn.textContent="Buscando ubicación…"}
 navigator.geolocation.getCurrentPosition(async pos=>{
   const lat=document.getElementById("taskLatitude"),lon=document.getElementById("taskLongitude"),input=document.querySelector('input[name="location"]');
   if(lat)lat.value=pos.coords.latitude;if(lon)lon.value=pos.coords.longitude;
   const address=await reverseGeocode(pos.coords.latitude,pos.coords.longitude);
   if(input)input.value=address;
   if(btn){btn.disabled=false;btn.classList.add("ok");btn.innerHTML=`${iconSvg("location")} ${escapeHtml(address)}`}
 },err=>{
   if(btn){btn.disabled=false;btn.innerHTML=old||"Usar mi ubicación actual"}
   alert(err.code===1?"Necesitamos permiso de ubicación para usar esta función.":"No pudimos obtener tu ubicación. Intenta otra vez.")
 },{enableHighAccuracy:true,maximumAge:0,timeout:12000})
}

 state.tasks=error?[]:(data||[]);
}
function workerJobCard(t){

 return `<button class="worker-job-card ${cls}" onclick="openTask('${t.id}')">
   <div class="worker-job-icon">${taskIcon(t)}</div>

function renderWorkerJobsTab(){
 const pending=state.tasks.filter(t=>["assigned","in_progress"].includes(t.status));
 const done=state.tasks.filter(t=>t.status==="completed");
 const tab=state.workerTaskTab||"pending";
 const list=tab==="completed"?done:pending;
 const host=document.getElementById("workerJobsList");
 if(host)host.innerHTML=list.length?list.map(workerJobCard).join(""):`<div class="jobs-empty">${iconSvg("tasks")}<h3>${tab==="completed"?"Aún no tienes tareas realizadas":"No tienes tareas pendientes"}</h3><p>${tab==="completed"?"Cuando completes un trabajo aparecerá aquí.":"Cuando acepten una de tus propuestas, la tarea aparecerá aquí."}</p></div>`;
 const p=document.getElementById("pendingCount"),d=document.getElementById("doneCount");
 if(p)p.textContent=pending.length;if(d)d.textContent=done.length;
 document.querySelectorAll(".jobs-tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));
}
function setWorkerTaskTab(tab){state.workerTaskTab=tab;renderWorkerJobsTab()}
async function workerJobs(){
 await loadWorkerJobs();
 const pending=state.tasks.filter(t=>["assigned","in_progress"].includes(t.status));
 const done=state.tasks.filter(t=>t.status==="completed");
 root.innerHTML=shell(`<section class="jobs-screen">
   <div class="jobs-head"><div><div class="kicker">Modo trabajador</div><h1>Mis tareas</h1><p>Organiza los trabajos que tienes pendientes y los que ya terminaste.</p></div>${logo(true)}</div>
   <div class="jobs-summary"><div><b id="pendingCount">${pending.length}</b><span>Pendientes</span></div><div><b id="doneCount">${done.length}</b><span>Realizadas</span></div></div>
   <div class="jobs-tabs">
     <button class="jobs-tab ${state.workerTaskTab!=="completed"?"active":""}" data-tab="pending" onclick="setWorkerTaskTab('pending')">Tareas pendientes</button>
     <button class="jobs-tab ${state.workerTaskTab==="completed"?"active":""}" data-tab="completed" onclick="setWorkerTaskTab('completed')">Tareas realizadas</button>
   </div>
   <div id="workerJobsList" class="worker-jobs-list"></div>
 </section>`,true);
 renderWorkerJobsTab()
}

function renderTaskPhotoPreview(){
 const host=document.getElementById("taskPhotoPreview");if(!host)return;
 const limit=state.pendingTaskPhotoLimit??5;
 host.innerHTML=state.pendingTaskFiles.map((f,i)=>`<span class="media-preview-chip">${escapeHtml(f.name)} <button type="button" aria-label="Quitar foto ${i+1}" onclick="removePendingTaskPhoto(${i})">×</button></span>`).join("")+`<span class="sub" role="status">${state.pendingTaskFiles.length}/${limit} fotos nuevas${state.taskPhotoSelectionNote?` · ${escapeHtml(state.taskPhotoSelectionNote)}`:""}</span>`;
}
function removePendingTaskPhoto(index){state.pendingTaskFiles.splice(index,1);state.taskPhotoSelectionNote="";renderTaskPhotoPreview()}
function selectTaskPhotos(event){
 const input=event?.target,files=Array.from(input?.files||[]),limit=state.pendingTaskPhotoLimit??5;
 let skipped=0,overflow=0;
 for(const file of files){
  if(file.type&&!file.type.startsWith("image/")){skipped++;continue}
  if(state.pendingTaskFiles.some(f=>f.name===file.name&&f.size===file.size&&f.lastModified===file.lastModified))continue;
  if(state.pendingTaskFiles.length>=limit){overflow++;continue}
  state.pendingTaskFiles.push(file);
 }
 state.taskPhotoSelectionNote=overflow?"Máximo 5 fotos por tarea. Quita una para agregar otra.":skipped?"Solo se permiten imágenes.":"";
 renderTaskPhotoPreview();if(input)input.value="";
}
function selectCompletionEvidence(event){
 const input=event?.target,files=Array.from(input?.files||[]),limit=Math.max(0,3-(state.taskMedia||[]).filter(m=>m.kind==="completion").length);
 state.pendingCompletionFiles=state.pendingCompletionFiles||[];let skipped=0;
 for(const file of files){if(!file.type?.startsWith("image/")||file.size>20*1024*1024){skipped++;continue}if(state.pendingCompletionFiles.some(f=>f.name===file.name&&f.size===file.size&&f.lastModified===file.lastModified))continue;if(state.pendingCompletionFiles.length>=limit){skipped++;continue}state.pendingCompletionFiles.push(file)}
 state.completionSelectionNote=skipped?"Máximo 3 fotos por tarea; elige imágenes de menos de 20 MB.":"";renderCompletionEvidencePreview();if(input)input.value="";
}
function renderCompletionEvidencePreview(){const host=document.getElementById("completionEvidencePreview");if(host)host.innerHTML=(state.pendingCompletionFiles||[]).map((f,i)=>`<span class="media-preview-chip">${escapeHtml(f.name)} <button type="button" onclick="removeCompletionEvidence(${i})" aria-label="Quitar foto">×</button></span>`).join("")+(state.completionSelectionNote?`<p class="small">${escapeHtml(state.completionSelectionNote)}</p>`:"")}
function removeCompletionEvidence(index){if(state.completionBusy)return;state.pendingCompletionFiles.splice(index,1);renderCompletionEvidencePreview()}
async function imageFileToJpeg(file,max=1400){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{let w=img.naturalWidth,h=img.naturalHeight,scale=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);c.toBlob(blob=>{URL.revokeObjectURL(url);blob?resolve(blob):reject(new Error("No pudimos preparar la foto."))},"image/jpeg",.84)}catch(err){URL.revokeObjectURL(url);reject(err)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("No pudimos abrir la foto."))};img.src=url})}
async function uploadTaskMedia(taskId,files,kind="request"){for(const file of files||[]){const blob=await imageFileToJpeg(file),path=`${taskId}/${state.user.id}/${kind}/${crypto.randomUUID()}.jpg`;const {error:up}=await sb.storage.from("task-media").upload(path,blob,{contentType:"image/jpeg",cacheControl:"3600"});if(up)throw up;const {error:row}=await sb.from("task_media").insert({task_id:taskId,uploader_id:state.user.id,kind,storage_path:path});if(row){await sb.storage.from("task-media").remove([path]);throw row}}}
async function loadTaskMedia(taskId){state.taskMedia=[];const {data,error}=await sb.from("task_media").select("id,storage_path,kind,created_at,uploader_id").eq("task_id",taskId).order("created_at",{ascending:true});if(error)return;state.taskMedia=await Promise.all((data||[]).map(async m=>{const {data:u}=await sb.storage.from("task-media").createSignedUrl(m.storage_path,3600);return {...m,url:u?.signedUrl||""}}))}
function openMediaPhoto(url,title="Foto"){document.getElementById("mediaPhotoModal")?.remove();const modal=document.createElement("div");modal.id="mediaPhotoModal";modal.className="media-modal";modal.onclick=e=>{if(e.target===modal)modal.remove()};modal.innerHTML=`<div class="media-modal-card"><div class="media-modal-head"><b>${escapeHtml(title)}</b><button onclick="document.getElementById('mediaPhotoModal')?.remove()">×</button></div><img src="${escapeAttr(url)}" alt="${escapeAttr(title)}"><div class="media-modal-note">Toca fuera de la imagen para cerrar.</div></div>`;document.body.appendChild(modal)}
function taskMediaGallery(kind="request",title="Fotos de la tarea"){const list=(state.taskMedia||[]).filter(m=>m.kind===kind&&m.url);if(!list.length)return "";return `<div class="media-picker"><h3>${escapeHtml(title)}</h3><div class="task-gallery">${list.map(m=>`<button type="button" onclick="openMediaPhoto('${escapeAttr(m.url)}','${escapeAttr(title)}')"><img src="${escapeAttr(m.url)}" alt="${escapeAttr(title)}"></button>`).join("")}</div></div>`}
function timelineHtml(t){if(t.status==="cancelled")return "";let idx=0;if(t.status==="open")idx=0;else if(t.status==="assigned")idx=t.arrived_at?3:(t.en_route_at?2:1);else if(t.status==="in_progress")idx=t.completion_requested_at?5:4;else if(t.status==="completed")idx=6;const labels=["Publicada","Asignada","En camino","Llegó","En curso","Confirmación","Finalizada"];return `<div class="timeline"><div class="timeline-row">${labels.map((x,i)=>`<div class="timeline-step ${i<idx?"done":i===idx?"current":""}">${x}</div>`).join("")}</div></div>`}
function localDateValue(v){if(!v)return "";const d=new Date(v),off=d.getTimezoneOffset()*60000;return new Date(d.getTime()-off).toISOString().slice(0,10)}
function localTimeValue(v){if(!v)return "";const d=new Date(v);return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}


function taskChatClosed(task){return ["completed","cancelled"].includes(task?.status)}
function taskStatusLabel(task){if(task?.status==='assigned'&&task?.arrived_at)return 'El trabajador llegó';if(task?.status==='assigned'&&task?.en_route_at)return 'En camino';if(task?.status==='in_progress'&&task?.completion_requested_at)return 'Esperando confirmación';return statusText(task?.status)}
async function deleteConversation(taskId,fromTask=false){
 if(!confirm("¿Quieres borrar esta conversación definitivamente? Se eliminarán todos los mensajes para ambas personas. La tarea seguirá guardada, pero el chat no se puede recuperar."))return;
 const {error}=await sb.rpc('delete_task_conversation',{p_task_id:taskId});
 if(error){state.error='No pudimos borrar la conversación: '+error.message;render();return}
 if(state.swipeConversationId===taskId)state.swipeConversationId=null;
 if(state.selectedTask?.id===taskId)state.messages=[];
 state.notice="Conversación eliminada definitivamente.";state.error="";
 if(state.selectedTask?.id===taskId&&fromTask){go(state.mode==="worker"?"workerJobs":"clientHome");return}
 if(state.route==="messagesHome"){await openMessagesHome();return}
 render()
}
function starDisplay(value,size=''){const rounded=Math.round(Number(value||0));return `<span class="star-display ${size}">${Array.from({length:5},(_,i)=>`<span class="${i<rounded?'filled':''}">★</span>`).join('')}</span>`}

function effectiveWorkerRating(profile){const rating=Number(profile?.rating||0);return Number.isFinite(rating)?Math.max(0,Math.min(5,rating)):0}
async function loadTaskRating(taskId){
 state.currentTaskRating=0;if(!taskId||!state.user)return 0;
 const [{data,error},{data:review}]=await Promise.all([sb.from('task_ratings').select('score').eq('task_id',taskId).maybeSingle(),sb.from('task_reviews').select('comment').eq('task_id',taskId).maybeSingle()]);
 if(!error&&data)state.currentTaskRating=Number(data.score||0);state.currentTaskReview=review?.comment||'';
 return state.currentTaskRating
}

async function selectTaskRating(taskId,value){
 const score=Math.max(0,Math.min(5,Number(value)||0));
 const {error}=await sb.rpc('rate_task',{p_task_id:taskId,p_score:score});
 if(error){state.error='No pudimos guardar la calificación: '+error.message;render();return}
 state.currentTaskRating=score;
 const wid=state.selectedTask?.worker_id;if(wid)await refreshWorkerProfile(wid);
 if(state.offers?.length&&wid){const o=state.offers.find(x=>x.worker_id===wid||x.status==='accepted');if(o?.profiles&&state.workerProfile)o.profiles=state.workerProfile}
 state.notice=`Calificación guardada: ${score} estrella${score===1?'':'s'}.`;state.error='';render()
}

ars-value" style="margin-left:6px">${prettyRating(displayRating)}</span></div></div><div class="important-row"><div class="important-ico">${iconSvg('calendar')}</div><div class="important-label">Miembro desde</div><div class="important-value">${escapeHtml(member)}</div></div></div></div>${canRate?ratingEditorHtml(task.id,rating):''}${chatAllowed?`<button class="chat-cta-btn" onclick="openChat('${task.id}')"><span class="left">${iconSvg('chat')}<span>Abrir chat</span></span><span>›</span></button>`:task?.id?`<div class="chat-closed-banner"><span class="left">${iconSvg('chat')}<span>${taskChatClosed(task)?'El chat se cerró al finalizar la tarea.':'Chat no disponible en este momento.'}</span></span></div>`:''}${workerReviewsHtml()}${task?.id&&otherParticipantId(task)?`<div class="safety-card"><h3>Seguridad</h3><p>Si algo no te parece correcto, puedes reportar o bloquear a esta persona.</p><div class="safety-actions"><button class="safety-btn" onclick="openUserReportSheet('${task.id}')">${iconSvg('flag')} Reportar</button><button class="safety-btn danger" onclick="blockOtherUser('${task.id}')">${iconSvg('shield')} Bloquear</button></div></div>`:''}</section>`,true)

async function loadClientProfileData(userId){
 state.clientProfile=null;state.clientReviews=[];
 if(!userId)return;
 const {data,error}=await sb.from("profiles").select("id,full_name,last_name,avatar_url,client_rating,client_completed_tasks,client_published_tasks,created_at").eq("id",userId).maybeSingle();
 if(error||!data)return;
 state.clientProfile=await resolveAvatar(data);
 const {data:reviews}=await sb.from("client_ratings").select("task_id,worker_id,score,comment,created_at").eq("client_id",userId).order("created_at",{ascending:false}).limit(5);
 state.clientReviews=await Promise.all((reviews||[]).map(async r=>{const {data:w}=await sb.from("profiles").select("full_name,avatar_url").eq("id",r.worker_id).maybeSingle();return {...r,worker:await resolveAvatar(w||{})}}))
}
async function openClientProfile(userId,backRoute="taskDetail"){await loadClientProfileData(userId);state.workerProfileBack=backRoute;go("clientProfile")}
function clientProfileScreen(){

">Todavía no tiene opiniones como cliente.</div>`}</section>`,true)
}
async function loadClientRating(taskId){state.clientRatingTaskId=taskId;state.currentClientRating=0;state.currentClientReview="";const {data}=await sb.from("client_ratings").select("score,comment").eq("task_id",taskId).maybeSingle();if(data){state.currentClientRating=Number(data.score||0);state.currentClientReview=data.comment||""}}
function clientRatingButtons(value){return `<div class="interactive-stars">${Array.from({length:5},(_,i)=>{const n=i+1;return `<button type="button" class="star-btn ${n<=value?"active":""}" onclick="state.currentClientRating=${n};render()" aria-label="Calificar cliente con ${n} estrellas">★</button>`}).join("")}</div>`}
function clientRatingEditorHtml(taskId){return `<div class="client-rating-box"><h3>Califica al cliente</h3><p class="small">Tu experiencia también importa. Esto ayuda a otros trabajadores.</p>${clientRatingButtons(state.currentClientRating||0)}<textarea id="clientReviewText" maxlength="500" oninput="state.currentClientReview=this.value" placeholder="Comentario opcional">${escapeHtml(state.currentClientReview||"")}</textarea><button class="btn orange" onclick="saveClientRating('${taskId}')">Guardar calificación</button></div>`}
async function saveClientRating(taskId){const score=Math.max(0,Math.min(5,Number(state.currentClientRating)||0)),comment=(document.getElementById("clientReviewText")?.value||state.currentClientReview||"").trim();const {error}=await sb.rpc("rate_client",{p_task_id:taskId,p_score:score,p_comment:comment||null});if(error)return setMsg("error",error.message);state.currentClientReview=comment;state.notice="Calificación del cliente guardada.";render()}

async function openSafetyCenter(){state.route="safetyCenter";render()}
async function openBlockedUsers(){const {data,error}=await sb.from("user_blocks").select("blocked_id").eq("blocker_id",state.user.id).order("created_at",{ascending:false});if(error)return setMsg("error","No pudimos cargar los bloqueados: "+error.message);const ids=(data||[]).map(x=>x.blocked_id);state.blockedUsers=[];if(ids.length){const {data:ps}=await sb.from("profiles").select("id,full_name,last_name,avatar_url").in("id",ids);state.blockedUsers=await Promise.all((ps||[]).map(resolveAvatar))}state.route="blockedUsers";render()}
async function unblockUser(id){const {error}=await sb.from("user_blocks").delete().eq("blocker_id",state.user.id).eq("blocked_id",id);if(error)return setMsg("error","No pudimos desbloquear al usuario: "+error.message);state.workerBlocked=false;await openBlockedUsers()}
async function openMyReports(){const {data,error}=await sb.from("user_reports").select("id,reason,details,status,created_at,task_id").eq("reporter_id",state.user.id).order("created_at",{ascending:false}).limit(30);if(error)return setMsg("error","No pudimos cargar tus reportes: "+error.message);state.myReports=data||[];state.route="myReports";render()}
async function shareCurrentTask(){const t=state.selectedTask;if(!t||!otherParticipantId(t)){alert("Abre una tarea donde participes para compartir sus datos.");return}const other=t.client_id===state.user.id?profileDisplayName(state.offers.find(o=>o.worker_id===t.worker_id)?.profiles):profileDisplayName(state.clientProfile);const txt=`DOHOY · ${t.title}\nEstado: ${taskStatusLabel(t)}\nParticipante: ${other||"Por confirmar"}\nUbicación: ${t.location_label||"Sin ubicación"}\nID: ${t.id}`;try{if(navigator.share)await navigator.share({title:"Datos de tarea DOHOY",text:txt});else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(txt);alert("Datos copiados.")}else openProfileSheet("Datos de tu tarea","Copia esta información para compartirla.",`<textarea readonly>${escapeHtml(txt)}</textarea>`)}catch(err){if(err.name!=="AbortError")setMsg("error","No pudimos compartir los datos. Intenta de nuevo.")}}
function safetyCenterScreen(){const hasParticipant=state.selectedTask&&otherParticipantId(state.selectedTask);return shell(`<section class="settings-page">${settingsHeader("Centro de seguridad")}<div class="safety-hero"><div class="kicker" style="color:#ffb46a">Seguridad</div><h1>Tu seguridad primero.</h1><p>Reporta problemas, bloquea usuarios y comparte la información de una tarea si lo necesitas.</p><a class="emergency-btn" href="tel:911">Llamar a emergencias (911)</a></div><div class="safety-grid">${hasParticipant?`<button class="safety-center-btn" onclick="openUserReportSheet('${state.selectedTask.id}')"><span class="ico">${iconSvg("flag")}</span><span><b>Reportar participante de la tarea actual</b><small>Informa una conducta o situación problemática</small></span><span>›</span></button><button class="safety-center-btn" onclick="blockOtherUser('${state.selectedTask.id}')"><span class="ico">${iconSvg("shield")}</span><span><b>Bloquear participante</b><small>Impide nuevos mensajes y ofertas entre ustedes</small></span><span>›</span></button>`:""}<button class="safety-center-btn" onclick="openBlockedUsers()"><span class="ico">${iconSvg("shield")}</span><span><b>Usuarios bloqueados</b><small>Administra a quién bloqueaste</small></span><span>›</span></button><button class="safety-center-btn" onclick="openMyReports()"><span class="ico">${iconSvg("flag")}</span><span><b>Mis reportes</b><small>Consulta los reportes que enviaste</small></span><span>›</span></button><button class="safety-center-btn" onclick="shareCurrentTask()"><span class="ico">${iconSvg("tasks")}</span><span><b>Compartir datos de una tarea</b><small>Útil cuando quieras informar a alguien de confianza</small></span><span>›</span></button></div><h2>Consejos de seguridad</h2><div class="safety-tip"><b>Mantén la conversación en DOHOY</b><p>No compartas contraseñas, códigos de acceso ni información bancaria por chat.</p></div><div class="safety-tip"><b>Revisa el perfil</b><p>Comprueba calificaciones y verificaciones antes de elegir o aceptar una tarea.</p></div><div class="safety-tip"><b>Si algo no se siente bien, no continúes</b><p>Cancela la tarea, reporta a la persona o contacta a emergencias si existe un riesgo inmediato.</p></div></section>`,true)}
function blockedUsersScreen(){return shell(`<section class="settings-page">${settingsHeader("Usuarios bloqueados")}<h2 class="settings-title">Bloqueados</h2>${state.blockedUsers.length?state.blockedUsers.map(p=>`<div class="blocked-card">${avatarMarkup(p)}<div><h3>${escapeHtml(profileDisplayName(p))}</h3><p>No puede enviarte mensajes ni nuevas ofertas.</p></div><button onclick="unblockUser('${p.id}')">Desbloquear</button></div>`).join(""):`<div class="empty">No tienes usuarios bloqueados.</div>`}</section>`,true)}

async function taskDetail(){
const t=state.selectedTask;if(!t)return go(state.mode==="client"?"clientHome":"workerHome");
const isOwner=t.client_id===state.user.id;
await loadTaskMedia(t.id);
if(isOwner)await loadOffers(t.id);else{await loadMyOffer(t.id);await loadClientProfileData(t.client_id)}
if(isOwner&&t.status==="completed")await loadTaskRating(t.id);else state.currentTaskRating=0;
if(!isOwner&&t.worker_id===state.user.id&&t.status==="completed"&&state.clientRatingTaskId!==t.id)await loadClientRating(t.id);else if(t.status!=="completed"){state.clientRatingTaskId=null;state.currentClientRating=0;state.currentClientReview=""}
const assignedOffer=currentWorkerFromOffers(t),selectedProfile=assignedOffer?.profiles||null,closed=taskChatClosed(t);
let body="";
if(!isOwner&&state.clientProfile){
 const cp=state.clientProfile;
 body+=`<div class="task-section-title"><div><h2>Cliente</h2><div class="sub">Información básica y reputación real.</div></div></div><div class="client-profile-card">${workerPhotoTrigger(cp)}<div><h3>${escapeHtml(profileDisplayName(cp))}</h3><p>${prettyRating(cp.client_rating)} ★ · ${Number(cp.client_completed_tasks||0)} tareas completadas</p></div><button onclick="openClientProfile('${cp.id}','taskDetail')">Ver perfil</button></div>`;
}
if(isOwner&&t.worker_id&&selectedProfile){
 const savedRating=state.currentTaskRating||0;
 body+=`<div class="task-section-title"><div><h2>Trabajador seleccionado</h2><div class="sub">Foto, experiencia y calificación real.</div></div></div><div class="selected-worker-card"><div class="selected-worker-head">${avatarMarkup(selectedProfile)}${workerSummaryHtml(selectedProfile)}<div class="worker-price">${money(assignedOffer?.amount||t.offered_price)}</div></div><div class="worker-card-actions"><button class="secondary-soft" onclick="openWorkerProfile('${selectedProfile.id||t.worker_id}','taskDetail')">Ver perfil</button>${t.status==="completed"?`<button class="accent-soft" onclick="openWorkerProfile('${selectedProfile.id||t.worker_id}','taskDetail')">Calificar</button>`:`<button class="accent-soft" onclick="openChat('${t.id}')">Chat</button>`}</div></div>`;
 if(t.status==="assigned")body+=`<div class="completion-card"><h3>${t.arrived_at?"El trabajador llegó":t.en_route_at?"El trabajador va en camino":"Trabajador asignado"}</h3><p>${t.arrived_at?"Ya puedes coordinar el inicio de la tarea.":t.en_route_at?"Te avisaremos cuando marque que llegó.":"El trabajador todavía no sale hacia la ubicación."}</p></div>`;
 if(t.status==="in_progress"&&!t.completion_requested_at)body+=`<div class="completion-card"><h3>Tarea en curso</h3><p>Cuando el trabajador indique que terminó, podrás revisar su evidencia antes de confirmar.</p></div>`;
 if(t.status==="in_progress"&&t.completion_requested_at)body+=`<div class="completion-card"><h3>El trabajador indicó que terminó</h3><p>Revisa la evidencia antes de confirmar.</p>${taskMediaGallery("completion","Evidencia de finalización")}<div class="completion-actions"><button class="btn orange" onclick="confirmTaskCompletion('${t.id}')">Confirmar</button><button class="danger-outline" onclick="openCompletionProblemSheet('${t.id}')">Reportar problema</button></div></div>`;
 if(t.status==="completed")body+=`${taskMediaGallery("completion","Evidencia de finalización")}${ratingEditorHtml(t.id,savedRating)}`;
}
if(isOwner&&t.status==="open"){
 body+=`<div class="task-section-title"><div><h2>Ofertas recibidas</h2><div class="sub">Acepta una propuesta o negocia un monto distinto.</div></div></div>`;
 body+=state.offers.length?`<div class="cards">${state.offers.map(o=>{const p=o.profiles||{};return `<div class="offer-person-card"><div class="offer-person-head">${avatarMarkup(p)}${workerSummaryHtml(p,{offer:true})}<div class="worker-price">${money(o.amount)}</div></div>${o.message?`<div class="offer-message">${escapeHtml(o.message)}</div>`:""}${o.counter_status==="pending"?`<div class="counter-card"><b>Contraoferta enviada: ${money(o.counter_amount)}</b><p>${escapeHtml(o.counter_message||"Esperando respuesta del trabajador.")}</p></div>`:""}<div class="offer-action-row"><button class="secondary-soft" onclick="openWorkerProfile('${o.worker_id}','taskDetail')">Ver perfil</button><button class="secondary-soft" onclick="openCounterOfferSheet('${o.id}',${Number(o.amount)})">Contraoferta</button><button class="accent-soft" onclick="acceptOffer('${o.id}','${o.worker_id}')">Elegir</button></div></div>`}).join("")}</div>`:`<div class="simple-empty">Aún no hay ofertas.</div>`;
}else if(!isOwner){
 const my=state.offers[0];
 if(t.status==="open"){
   if(my)body+=`<div class="ok">Ya ofreciste ${money(my.amount)}. Estado: ${escapeHtml(my.status)}.</div>${my.counter_status==="pending"?`<div class="counter-card"><b>El cliente propone ${money(my.counter_amount)}</b><p>${escapeHtml(my.counter_message||"Puedes aceptar o rechazar esta contraoferta.")}</p><div class="counter-actions"><button class="btn orange" onclick="respondCounterOffer('${my.id}',true)">Aceptar</button><button class="danger-outline" onclick="respondCounterOffer('${my.id}',false)">Rechazar</button></div></div>`:""}`;
   else body+=`<div class="rating-card"><h3>Haz una oferta</h3><p>Preséntate y envía tu propuesta.</p><form id="offerForm"><div class="field"><label>Tu precio</label><input class="input" name="amount" type="number" min="1" value="${Number(t.offered_price)}" required></div><div class="field"><label>Mensaje</label><textarea name="message" placeholder="Ej. Puedo hacerlo hoy por la tarde"></textarea></div><button class="btn primary">Enviar oferta</button></form></div>`;
 }else if(t.worker_id===state.user.id){
   body+=taskProgressButtons(t);
   if(t.status==="completed")body+=taskMediaGallery("completion","Evidencia de finalización")+clientRatingEditorHtml(t.id);
 }else body+=`<div class="simple-empty">Esta tarea ya no está disponible.</div>`;
}
if((t.client_id===state.user.id||t.worker_id===state.user.id)&&t.worker_id&&closed)body+=`<div class="task-mini-actions"><button class="task-inline-delete" onclick="deleteConversation('${t.id}',true)">${iconSvg("trash")} Borrar conversación</button></div>`;

root.innerHTML=shell(`<section class="screen"><div class="detail-shell"><div class="detail-topline"><button class="icon" onclick="go('${state.taskBackRoute||(isOwner?"clientHome":"workerHome")}')">←</button><span class="detail-category-pill">${taskIcon(t)} ${escapeHtml(baseCategory(t.category))}</span><span></span></div>${authMsg()}<div class="detail-card"><div class="detail-icon-box">${taskIcon(t)}</div><div class="detail-money">${money(t.offered_price)}</div><h1 class="detail-title">${escapeHtml(t.title)}</h1><p class="detail-copy">${escapeHtml(t.description)}</p><span class="detail-location">${iconSvg("location")}<span>${(!isOwner&&t.status==="open")?"Ubicación aproximada":escapeHtml(t.location_label||"Sin ubicación")}${!isOwner&&taskDistanceKm(t)!=null?` · ${distanceLabel(taskDistanceKm(t))} de ti`:""}</span></span>${taskMediaGallery("request","Fotos de la tarea")}</div><div class="status-banner ${statusCls}"><span class="dot"></span><span>${taskStatusLabel(t)}</span></div>${timelineHtml(t)}${isOwner&&t.status==="open"&&!t.worker_id?`<button class="edit-task-btn" onclick="go('editTask')">Editar tarea</button>`:""}${t.status==="cancelled"&&t.cancellation_reason?`<div class="policy-note"><b>Motivo de cancelación:</b> ${escapeHtml(t.cancellation_reason)}</div>`:""}${(t.client_id===state.user.id||t.worker_id===state.user.id)&&t.worker_id&&!closed?`<button class="chat-cta-btn" onclick="openChat('${t.id}')"><span class="left">${iconSvg("chat")}<span>Abrir chat</span></span><span>›</span></button>`:(t.client_id===state.user.id||t.worker_id===state.user.id)&&t.worker_id&&closed?`<div class="chat-closed-banner"><span class="left">${iconSvg("chat")}<span>El chat se cerró al finalizar la tarea.</span></span></div>`:""}${body}${participantCanCancel(t)?`<button class="cancel-task-btn" onclick="openCancelTaskSheet('${t.id}')">Cancelar tarea</button>`:""}${t.worker_id&&otherParticipantId(t)?`<div class="safety-card"><h3>Seguridad</h3><p>Reporta conductas inapropiadas o bloquea a la otra persona si es necesario.</p><div class="safety-actions"><button class="safety-btn" onclick="openUserReportSheet('${t.id}')">${iconSvg("flag")} Reportar</button><button class="safety-btn danger" onclick="blockOtherUser('${t.id}')">${iconSvg("shield")} Bloquear</button></div></div>`:""}</div></section>`,true);renderCompletionEvidencePreview()
}
function taskProgressButtons(t){
 if(t.status==="assigned"){
   if(!t.en_route_at)return `<div class="completion-card"><h3>Listo para salir</h3><p>Avisa al cliente cuando vayas en camino.</p><button class="btn primary" onclick="markTaskEnRoute('${t.id}')">Voy en camino</button></div>`;
   if(!t.arrived_at)return `<div class="completion-card"><h3>Vas en camino</h3><p>Cuando llegues, avisa al cliente desde aquí.</p><button class="btn orange" onclick="markTaskArrived('${t.id}')">Llegué</button></div>`;
   return `<div class="completion-card"><h3>Ya llegaste</h3><p>Ahora puedes comenzar la tarea.</p><button class="btn orange" onclick="startTask('${t.id}')">Comenzar tarea</button></div>`;

 if(t.status==="in_progress"&&!t.completion_requested_at)return `<div class="completion-proof"><h3>Evidencia de finalización</h3><p>Puedes subir hasta 3 fotos antes de avisar que terminaste.</p><input id="completionEvidenceInput" class="media-input" type="file" accept="image/*" multiple onchange="selectCompletionEvidence(event)"><button class="media-add-btn" type="button" onclick="document.getElementById('completionEvidenceInput').click()">${iconSvg("camera")} Agregar fotos</button><div id="completionEvidencePreview" class="media-preview-list"></div>${taskMediaGallery("completion","Evidencia cargada")}<button id="completionSubmit" class="btn orange" onclick="requestTaskCompletion('${t.id}')">Terminé la tarea</button></div>`;
 if(t.status==="in_progress"&&t.completion_requested_at)return `<div class="completion-card"><h3>Esperando confirmación</h3><p>Ya avisaste que terminaste. El cliente puede revisar la evidencia y confirmar.</p>${taskMediaGallery("completion","Evidencia enviada")}</div>`;

async function saveProfileField(event,type){
 event.preventDefault();const form=event.target;const btn=form.querySelector('button[type=submit],button');const original=btn?.textContent;const v=(new FormData(form).get('value')||'').trim();
 if(btn){btn.disabled=true;btn.textContent='Guardando…'}
 try{
  if(type==='name'||type==='last_name'||type==='phone'){
    const field=type==='name'?'full_name':type;
    const {error}=await sb.from('profiles').update({[field]:v||null}).eq('id',state.user.id);
    if(error)throw error;
    if(type==='name'){
      const {data:authData,error:authError}=await sb.auth.updateUser({data:{full_name:v}});
      if(authError)throw authError;if(authData?.user)state.user=authData.user
    }
    await loadProfile();
    const saved=String(state.profile?.[field]||'').trim();
    if(saved!==v)throw new Error('El servidor no confirmó el dato guardado. Intenta nuevamente.')
  } else if(type==='document_type'||type==='identification_number'||type==='birth_date'){
    await ensurePrivateProfile({[type]:v||null})
  } else if(type==='password'){
    const {error}=await sb.auth.updateUser({password:v});if(error)throw error
  } else if(type==='email'){
    const {data,error}=await sb.auth.updateUser({email:v});if(error)throw error;if(data?.user)state.user=data.user;state.notice='Revisa tu correo para confirmar el cambio si DOHOY te lo solicita.'
  }
  closeProfileSheet();state.error='';state.notice='Información guardada correctamente.';render()
 }catch(err){if(btn){btn.disabled=false;btn.textContent=original||'Guardar'}closeProfileSheet();state.error='No pudimos guardar el cambio: '+(err.message||err);render()}
}

async function captureProfilePhoto(){
 const video=document.getElementById("profileCameraVideo");if(!video||!video.videoWidth)return;
 const size=Math.min(video.videoWidth,video.videoHeight),sx=(video.videoWidth-size)/2,sy=(video.videoHeight-size)/2;
 const canvas=document.createElement("canvas");canvas.width=640;canvas.height=640;const ctx=canvas.getContext("2d");
 ctx.translate(640,0);ctx.scale(-1,1);ctx.drawImage(video,sx,sy,size,size,0,0,640,640);
 pendingAvatarBlob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",.86));
 if(!pendingAvatarBlob)return;
 const preview=document.getElementById("profileCameraPreview");preview.src=URL.createObjectURL(pendingAvatarBlob);preview.style.display="block";video.style.display="none";document.getElementById("cameraGuide").style.display="none";document.getElementById("cameraCaptureActions").style.display="none";document.getElementById("cameraReviewActions").style.display="grid";

 pendingAvatarBlob=null;const preview=document.getElementById("profileCameraPreview"),video=document.getElementById("profileCameraVideo");if(preview){if(preview.src)URL.revokeObjectURL(preview.src);preview.removeAttribute("src");preview.style.display="none"}if(video)video.style.display="block";const guide=document.getElementById("cameraGuide");if(guide)guide.style.display="block";const a=document.getElementById("cameraCaptureActions"),b=document.getElementById("cameraReviewActions");if(a)a.style.display="grid";if(b)b.style.display="none"
}

async function handleGalleryPhoto(event){
 const file=event?.target?.files?.[0];if(!file)return;closeProfileSheet();
 if(file.type&&!file.type.startsWith('image/')){state.error='El archivo seleccionado no parece ser una imagen.';render();return}

 try{
   const url=URL.createObjectURL(file);const img=new Image();
   await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});
   const size=Math.min(img.naturalWidth,img.naturalHeight),sx=(img.naturalWidth-size)/2,sy=(img.naturalHeight-size)/2;
   const canvas=document.createElement('canvas');canvas.width=640;canvas.height=640;const ctx=canvas.getContext('2d');ctx.drawImage(img,sx,sy,size,size,0,0,640,640);
   URL.revokeObjectURL(url);
   pendingAvatarBlob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.86));
   if(!pendingAvatarBlob)throw new Error('No pudimos preparar la imagen.');
   state.error='';openGalleryPreview();

async function loadConversations(){
const {data:tasks,error}=await sb.from("tasks").select("id,title,category,status,client_id,worker_id,completion_requested_at,updated_at").or(`client_id.eq.${state.user.id},worker_id.eq.${state.user.id}`).not("worker_id","is",null).order("updated_at",{ascending:false});
if(error){state.error=error.message;state.conversations=[];return}
await markDeliveredForTasks(tasks.map(t=>t.id));
state.conversations=(await Promise.all(tasks.map(async t=>{
  const {data:msgs}=await sb.from("messages").select("id,sender_id,body,created_at,delivered_at,read_at").eq("task_id",t.id).order("created_at",{ascending:false}).limit(50);
  const arr=msgs||[];const last=arr[0]||null;
  return {...t,last_message:last,unread:arr.filter(m=>m.sender_id!==state.user.id&&!m.read_at).length,_hasMessages:arr.length>0}
}))).filter(t=>t._hasMessages);
state.conversations.sort((a,b)=>new Date(b.last_message?.created_at||b.updated_at)-new Date(a.last_message?.created_at||a.updated_at))
}

function closeAllConversationSwipes(exceptId=null){
 document.querySelectorAll('.chat-swipe-row').forEach(row=>{const id=row.dataset.taskId;if(exceptId&&id===exceptId)return;row.classList.remove('is-open');const content=row.querySelector('.chat-swipe-content');if(content){content.style.transform='';content.style.transition=''} });

function openConversationFromList(event,taskId,closed){
 if(Date.now()<swipeSuppressUntil){event?.preventDefault?.();return}
 if(state.swipeConversationId===taskId){event?.preventDefault?.();setConversationSwipe(taskId,false);return}

function bindConversationSwipes(){
 document.querySelectorAll('.chat-swipe-row').forEach(row=>{
  if(row.dataset.swipeBound==='1')return;row.dataset.swipeBound='1';
  const content=row.querySelector('.chat-swipe-content');if(!content)return;
  let startX=0,startY=0,lastX=0,dragging=false,base=0;
  row.addEventListener('touchstart',e=>{if(!e.touches?.length)return;const t=e.touches[0];startX=lastX=t.clientX;startY=t.clientY;dragging=false;base=row.classList.contains('is-open')?-92:0;closeAllConversationSwipes(row.dataset.taskId)}, {passive:true});
  row.addEventListener('touchmove',e=>{if(!e.touches?.length)return;const t=e.touches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(!dragging&&Math.abs(dx)<8&&Math.abs(dy)<8)return;if(!dragging&&Math.abs(dy)>Math.abs(dx))return;dragging=true;row.classList.add('is-dragging');e.preventDefault();lastX=t.clientX;const x=Math.max(-92,Math.min(0,base+dx));content.style.transform=`translateX(${x}px)`}, {passive:false});
  row.addEventListener('touchend',()=>{if(!dragging)return;row.classList.remove('is-dragging');const dx=lastX-startX;const finalX=Math.max(-92,Math.min(0,base+dx));const open=finalX<-42;swipeSuppressUntil=Date.now()+350;setConversationSwipe(row.dataset.taskId,open)});
  row.addEventListener('touchcancel',()=>{row.classList.remove('is-dragging');content.style.transform='';content.style.transition=''});
 });
}

function upsertRealtimeMessage(msg){

function subscribeToChat(taskId){
if(chatChannel){sb.removeChannel(chatChannel);chatChannel=null}
chatChannel=sb.channel(`dohoy-chat-${taskId}`)
.on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`task_id=eq.${taskId}`},async payload=>{
  const incoming=payload.new;const isNew=!state.messages.some(m=>m.id===incoming.id);upsertRealtimeMessage(incoming);
  if(incoming.sender_id!==state.user.id){await markChatRead(taskId);await loadMessages(taskId)}
  refreshChatDom(isNew)
})
.on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:`task_id=eq.${taskId}`},payload=>{
  upsertRealtimeMessage(payload.new);refreshChatDom(false)
})
.subscribe()
}

if(state.route!=="chat"||!state.selectedTask)return;
const draft=document.getElementById("chatInput")?.value??state.chatDraft;
await loadMessages(state.selectedTask.id);await markChatRead(state.selectedTask.id);await loadMessages(state.selectedTask.id);
state.chatDraft=draft;refreshChatDom(false)
}

if(!state.session&&!["welcome","signup","login"].includes(state.route)){state.route="welcome"}

if(state.route==="workerJobs"){workerJobs();return}
if(state.route==="workerCategory"){workerCategory();return}
if(state.route==="createTask"){createTask();bindForms();return}
if(state.route==="editTask"){editTaskScreen();return}

if(state.route==="profile"){profile().then(bindForms);return}
if(state.route==="editProfile"){editProfile().then(bindForms);return}

if(state.route==="safetyCenter"){root.innerHTML=safetyCenterScreen();return}
if(state.route==="blockedUsers"){root.innerHTML=blockedUsersScreen();return}
if(state.route==="myReports"){root.innerHTML=myReportsScreen();return}
if(state.route==="addresses"){root.innerHTML=addressesScreen();return}
if(state.route==="payments"){root.innerHTML=paymentsScreen();return}
if(state.route==="billing"){root.innerHTML=billingScreen();return}
if(state.route==="verification"){root.innerHTML=verificationScreen();return}
if(state.route==="language"){root.innerHTML=languageScreen();return}
if(state.route==="notifications"){root.innerHTML=notificationsScreen();return}
if(state.route==="activity"){root.innerHTML=notificationsCenterScreen();return}
if(state.route==="favorites"){root.innerHTML=favoritesScreen();return}
if(state.route==="help"){root.innerHTML=helpScreen();return}
if(state.route==="terms"){root.innerHTML=termsScreen();return}

const sync={welcome,signup,login,mode:chooseMode,chat:chatScreen};
const fn=sync[state.route]||welcome;root.innerHTML=fn();bindForms()
}
function bindForms(){
const s=document.getElementById("signupForm");if(s)s.onsubmit=signUp;
const l=document.getElementById("loginForm");if(l)l.onsubmit=signIn;
const t=document.getElementById("taskForm");if(t)t.onsubmit=publishTask;
const et=document.getElementById("editTaskForm");if(et)et.onsubmit=saveEditTask;
const o=document.getElementById("offerForm");if(o)o.onsubmit=sendOffer;
const p=document.getElementById("profileForm");if(p)p.onsubmit=saveProfile;
}
async function signUp(e){
e.preventDefault();const f=new FormData(e.target);
const {data,error}=await sb.auth.signUp({email:f.get("email"),password:f.get("password"),options:{data:{full_name:f.get("name")},emailRedirectTo:REDIRECT_URL}});
if(error)return setMsg("error",error.message);
if(data.session){state.session=data.session;state.user=data.user;await loadProfile();go("mode")}
else{state.notice="Cuenta creada. Revisa tu correo y confirma tu cuenta; después vuelve a DOHOY e inicia sesión.";state.error="";render()}
}
async function signIn(e){
e.preventDefault();const f=new FormData(e.target);const {data,error}=await sb.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});
if(error)return setMsg("error",error.message);state.session=data.session;state.user=data.user;await loadProfile();await markAllIncomingDelivered();await loadNotificationSummary();startDeliveryPoll();subscribeNotifications();go("mode")
}
async function signOut(){return signOutCurrent()}
async function loadProfile(){
if(!state.user)return;const {data,error}=await sb.from("profiles").select("id,full_name,last_name,avatar_url,bio,phone,rating,completed_tasks,identity_verified,phone_verified,driver_license_verified,created_at").eq("id",state.user.id).single();
if(error){state.error=state.error||("No pudimos cargar tu perfil: "+error.message);return}state.profile=await resolveAvatar(data)
}
async function saveProfile(e){
e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from("profiles").update({full_name:f.get("name"),phone:(f.get("phone")||"").trim()||null,bio:f.get("bio")}).eq("id",state.user.id);
if(error)return setMsg("error",error.message);await loadProfile();state.notice="Perfil guardado.";render()
}
async function publishTask(e){
e.preventDefault();const f=new FormData(e.target);const base=f.get("category");const category=encodeCategory(base,f.get("vehicle_variant"),f.get("vehicle_color"));const d=f.get("task_date"),tm=f.get("task_time");const scheduled_for=d?new Date(`${d}T${tm||"12:00"}:00`).toISOString():null;const lat=f.get("latitude"),lon=f.get("longitude");const payload={client_id:state.user.id,title:f.get("title"),description:f.get("description"),category,location_label:f.get("location"),latitude:lat?Number(lat):null,longitude:lon?Number(lon):null,offered_price:Number(f.get("price")),scheduled_for,requires_driver_license:f.get("license")==="on"};
const {data,error}=await sb.from("tasks").insert(payload).select().single();if(error)return setMsg("error",error.message);state.selectedTask=data;
try{if(state.pendingTaskFiles.length)await uploadTaskMedia(data.id,state.pendingTaskFiles)}catch(err){state.notice="La tarea se publicó, pero alguna foto no pudo subirse."}
state.pendingTaskFiles=[];go("taskDetail")
}
async function loadMyTasks(){const {data,error}=await sb.from("tasks").select("*").eq("client_id",state.user.id).order("created_at",{ascending:false});state.tasks=error?[]:data}
async function loadOpenTasks(){const [{data,error},{data:blocked}]=await Promise.all([sb.from("tasks").select("*").eq("status","open").neq("client_id",state.user.id).order("created_at",{ascending:false}),sb.rpc("get_my_blocked_user_ids")]);const ids=new Set((blocked||[]).map(x=>x.user_id));state.tasks=error?[]:(data||[]).filter(t=>!ids.has(t.client_id))}
async function openTask(id){
if(state.selectedTask?.id!==id){state.pendingCompletionFiles=[];state.completionSelectionNote="";state.clientRatingTaskId=null}
const back=state.route;
const {data,error}=await sb.from("tasks").select("*").eq("id",id).single();if(error)return setMsg("error",error.message);state.selectedTask=data;state.taskBackRoute=back;await sb.from("notifications").update({read_at:new Date().toISOString()}).eq("user_id",state.user.id).eq("task_id",id).is("read_at",null);await loadNotificationSummary();go("taskDetail")
}
async function loadOffers(taskId){
const {data,error}=await sb.from("task_offers").select("id,task_id,worker_id,amount,message,status,created_at,counter_amount,counter_message,counter_status,countered_at,profiles!task_offers_worker_id_fkey(id,full_name,last_name,avatar_url,rating,completed_tasks,identity_verified,phone_verified,driver_license_verified)").eq("task_id",taskId).order("created_at",{ascending:true});
if(error){state.offers=[];return}
state.offers=await Promise.all((data||[]).map(async o=>({...o,profiles:await resolveAvatar(o.profiles)})))
}
async function loadMyOffer(taskId){
const {data,error}=await sb.from("task_offers").select("*").eq("task_id",taskId).eq("worker_id",state.user.id).limit(1);state.offers=error?[]:data
}
async function sendOffer(e){
e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from("task_offers").insert({task_id:state.selectedTask.id,worker_id:state.user.id,amount:Number(f.get("amount")),message:f.get("message")});
if(error)return setMsg("error",error.message);await loadMyOffer(state.selectedTask.id);state.notice="Oferta enviada.";render()
}
async function acceptOffer(offerId,workerId){
const tid=state.selectedTask.id;const {data,error}=await sb.rpc('accept_task_offer',{p_offer_id:offerId});
if(error)return setMsg("error",error.message);state.selectedTask=Array.isArray(data)?data[0]:data;state.notice="Trabajador seleccionado.";await loadOffers(tid);render()
}
async function startTask(id){
const {data,error}=await sb.rpc('start_task',{p_task_id:id});if(error)return setMsg('error',error.message);state.selectedTask=Array.isArray(data)?data[0]:data;state.notice='Tarea iniciada.';render()
}
async function requestTaskCompletion(id){
 const task=state.selectedTask;if(state.completionBusy||!task||task.id!==id||task.worker_id!==state.user?.id||task.status!=="in_progress"||task.completion_requested_at)return;
 if(!confirm('¿Ya terminaste la tarea? El cliente deberá confirmarlo.'))return;
 state.completionBusy=true;const btn=document.getElementById('completionSubmit');if(btn){btn.disabled=true;btn.textContent='Enviando…'}
 try{while(state.pendingCompletionFiles?.length){await uploadTaskMedia(id,[state.pendingCompletionFiles[0]],"completion");state.pendingCompletionFiles.shift()}
 const {data,error}=await sb.rpc('request_task_completion',{p_task_id:id});if(error)throw error;state.selectedTask=Array.isArray(data)?data[0]:data;state.notice='Avisamos al cliente que terminaste.';state.error='';
 }catch(err){state.error='No pudimos enviar la finalización: '+(err?.message||err)}
 finally{state.completionBusy=false;await loadTaskMedia(id);await render();renderCompletionEvidencePreview()}
}
async function confirmTaskCompletion(id){
if(!confirm('¿Confirmas que la tarea fue terminada correctamente? Al confirmar se cerrará el chat.'))return;
const {data,error}=await sb.rpc('confirm_task_completion',{p_task_id:id});if(error)return setMsg('error',error.message);state.selectedTask=Array.isArray(data)?data[0]:data;state.notice='Tarea finalizada. El chat quedó cerrado y ya puedes calificar al trabajador.';await loadOffers(id);await loadTaskRating(id);render()
}
async function setTaskStatus(id,status){
if(status==='in_progress')return startTask(id);
if(status==='completed')return requestTaskCompletion(id)
}
async function loadMessages(taskId){
const {data,error}=await sb.from("messages").select("*").eq("task_id",taskId).order("created_at",{ascending:true});if(!error)state.messages=data
}
async function sendMessage(){
if(taskChatClosed(state.selectedTask)){state.notice="Este chat ya está cerrado porque la tarea terminó.";go("taskDetail");return}
const inp=document.getElementById("chatInput");const body=(inp?.value??state.chatDraft).trim();if(!body)return;
const taskId=state.selectedTask.id;const {data,error}=await sb.from("messages").insert({task_id:taskId,sender_id:state.user.id,body}).select().single();
if(error)return setMsg("error",error.message);
state.chatDraft="";if(inp)inp.value="";if(data)upsertRealtimeMessage(data);refreshChatDom(true);if(inp)inp.focus()
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]))}
function escapeAttr(v){return escapeHtml(v).replace(/`/g,"&#96;")}
async function init(){
const {data}=await sb.auth.getSession();state.session=data.session;state.user=data.session?.user||null;if(state.user){await loadProfile();await markAllIncomingDelivered();await loadNotificationSummary();startDeliveryPoll();subscribeNotifications()}
state.route=state.session?"mode":"welcome";render();

}
