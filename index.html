 if(kind==='blocks')return `<article class="admin-record"><h3>${escapeHtml(r.blocker_name||'Usuario')} bloqueó a ${escapeHtml(r.blocked_name||'Usuario')}</h3><p>${adminDate(r.created_at)}</p><small>${shortUser(r.blocker_id)} → ${shortUser(r.blocked_id)}</small></article>`;
 if(kind==='ratings')return `<article class="admin-record"><h3>${Number(r.score)} de 5 ★ · ${r.rated_role==='worker'?'Trabajador':'Cliente'}</h3><p>${escapeHtml(r.comment||'Sin comentario')}</p><small>De ${shortUser(r.author_id)} a ${shortUser(r.rated_id)} · ${adminDate(r.created_at)}<br>Tarea ${escapeHtml(r.task_id)}</small></article>`;
 const support=kind==='disputes'&&r.source==='support',closed=r.status==='closed'||r.status==='resolved';return `<article class="admin-record"><div class="admin-row-head"><h3>${escapeHtml(r.reason)}</h3><span class="profile-chip">${escapeHtml(support?supportStatusLabel(r.status):closed?'Cerrado':'Pendiente')}</span></div><p>${escapeHtml(r.details||'Sin detalles adicionales')}</p><small>Usuario ${shortUser(r.reporter_id)}${r.reported_user_id?' · Reportado '+shortUser(r.reported_user_id):''} · ${adminDate(r.created_at)}${r.task_id?'<br>Tarea '+escapeHtml(r.task_id):''}</small>${support?`<button class="btn ghost" onclick="adminOpenSupport('${r.id}')">Ver evidencia y responder</button>`:`<button class="btn ghost" ${state.adminBusy?'disabled':''} onclick="adminReviewReport('${kind==='reports'?'report':'issue'}','${r.id}',${!closed})">${closed?'Reabrir reporte':'Marcar como revisado'}</button>`}</article>`
}

function adminProductFunnelHtml(){const f=state.adminProductFunnel;if(!f)return "";const steps=[["Inicio",f.home_views],["Publicar",f.publish_started],["Publicadas",f.tasks_published],["Propuestas",f.offers_sent],["Aceptadas",f.offers_accepted],["Pago",f.checkout_started],["Terminadas",f.tasks_completed]];return `<div class="product-funnel-v2"><div><b>Embudo de producto</b><small>Últimos ${Number(f.days||30)} días · eventos registrados desde esta versión</small></div><div class="funnel-steps">${steps.map((x,i)=>`<span><small>${escapeHtml(x[0])}</small><b>${Number(x[1]||0)}</b>${i<steps.length-1?`<i>→</i>`:""}</span>`).join("")}</div></div>`}
function adminAttentionHtml(){const a=state.adminAttention;if(!a)return "";const total=Number(a.open_support||0)+Number(a.open_issues||0)+Number(a.failed_payments||0)+Number(a.pending_payments||0)+Number(a.recent_errors||0);return `<section class="admin-attention ${total?"needs":"clear"}"><div><small>NECESITA MI ATENCIÓN</small><h3>${total?`${total} señal${total===1?"":"es"} por revisar`:"Todo tranquilo"}</h3><p>${total?"Prioriza soporte, pagos y errores antes de revisar métricas.":"No hay incidencias operativas destacadas en este momento."}</p></div><div class="attention-grid"><span><b>${Number(a.open_support||0)}</b><small>Soporte</small></span><span><b>${Number(a.open_issues||0)}</b><small>Disputas</small></span><span><b>${Number(a.failed_payments||0)}</b><small>Pagos fallidos</small></span><span><b>${Number(a.pending_payments||0)}</b><small>Pagos atorados</small></span><span><b>${Number(a.recent_errors||0)}</b><small>Errores 24 h</small></span></div></section>`}
function launchReadinessHtml(){return `<section class="launch-readiness"><div><small>CHECKLIST BETA</small><h3>Preparación para usuarios reales</h3></div>${[["Flujo principal","Listo en interfaz"],["RLS y permisos","Protegidos en backend"],["Soporte y disputas","Activo"],["Analítica y errores","Activo"],["Stripe Connect","Pendiente"],["Textos legales definitivos","Revisión externa recomendada"]].map(([a,b],i)=>`<span class="${i<4?"ok":"pending"}"><i>${i<4?"✓":"!"}</i><b>${a}</b><small>${b}</small></span>`).join("")}</section>`}
function adminBusinessHtml(){const m=state.adminBusinessMetrics;if(!m)return "";return `<section class="business-dashboard"><div class="business-title"><div><small>NEGOCIO</small><h2>Cómo está funcionando DOHOY</h2></div><button onclick="openAdminBanners()">Banners</button></div><div class="business-kpis"><div><small>Dinero procesado</small><b>${money(m.gmv)}</b></div><div><small>Comisión DOHOY</small><b>${money(m.commission)}</b></div><div><small>Ticket promedio</small><b>${money(m.avg_ticket)}</b></div><div><small>Finalización</small><b>${Number(m.completion_rate||0)}%</b></div></div><div class="business-funnel"><span><b>${Number(m.users||0)}</b> usuarios</span><i>→</i><span><b>${Number(m.tasks||0)}</b> tareas</span><i>→</i><span><b>${Number(m.paid_jobs||0)}</b> pagos</span><i>→</i><span><b>${Number(m.completed||0)}</b> terminadas</span></div>${Number(m.open_issues||0)>0?`<div class="risk-signal">${iconSvg("flag")} ${Number(m.open_issues)} caso(s) abierto(s) requieren revisión.</div>`:""}${Number(m.risk_accounts||0)>0?`<div class="risk-signal">${iconSvg("shield")} ${Number(m.risk_accounts)} cuenta(s) con patrón alto de cancelaciones para revisión manual.</div>`:""}${Array.isArray(m.top_categories)&&m.top_categories.length?`<div class="top-categories"><b>Categorías con más actividad</b>${m.top_categories.map(x=>`<span>${escapeHtml(x.category)} <strong>${Number(x.total)}</strong></span>`).join("")}</div>`:""}${adminProductFunnelHtml()}</section>`}
async function openAdminBanners(){if(!adminAllowed())return;const {data,error}=await sb.from("app_banners").select("*").order("sort_order",{ascending:false});if(error)return setMsg("error",error.message);state.adminBanners=data||[];state.route="adminBanners";render()}
function adminBannersScreen(){return shell(`<section class="settings-page admin-page">${settingsHeader("Banners de inicio")}<div class="admin-intro"><div><div class="kicker">Contenido dinámico</div><h2>Promociones y avisos</h2></div></div><form class="banner-admin-form" onsubmit="createAdminBanner(event)"><input name="title" required maxlength="80" placeholder="Título del banner"><input name="subtitle" maxlength="160" placeholder="Texto secundario"><div><select name="audience"><option value="all">Todos</option><option value="client">Clientes</option><option value="worker">Trabajadores</option></select><select name="tone"><option value="blue">Azul</option><option value="orange">Naranja</option><option value="mint">Menta</option><option value="purple">Morado</option></select></div><input name="cta_label" maxlength="30" placeholder="Botón (opcional)"><select name="cta_route"><option value="">Sin destino</option><option value="createTask">Publicar tarea</option><option value="workerHome">Ver trabajos</option><option value="growth">Invitar amigos</option></select><button class="btn primary">Crear banner</button></form><div class="admin-banner-list">${state.adminBanners.map(b=>`<article class="tone-${escapeAttr(b.tone)}"><div><small>${escapeHtml(b.audience)}</small><b>${escapeHtml(b.title)}</b><p>${escapeHtml(b.subtitle||"")}</p></div><button onclick="toggleAdminBanner('${b.id}',${!b.active})">${b.active?"Desactivar":"Activar"}</button></article>`).join("")||`<div class="empty">No hay banners.</div>`}</div></section>`,true)}
async function createAdminBanner(e){e.preventDefault();const f=new FormData(e.target),row={title:String(f.get("title")||"").trim(),subtitle:String(f.get("subtitle")||"").trim()||null,audience:f.get("audience"),tone:f.get("tone"),cta_label:String(f.get("cta_label")||"").trim()||null,cta_route:String(f.get("cta_route")||"").trim()||null,active:true,sort_order:0};const {error}=await sb.from("app_banners").insert(row);if(error)return setMsg("error",error.message);await openAdminBanners()}
async function toggleAdminBanner(id,active){const {error}=await sb.from("app_banners").update({active,updated_at:new Date().toISOString()}).eq("id",id);if(error)return setMsg("error",error.message);await openAdminBanners()}

function adminScreen(){if(!adminAllowed())return shell(`<section class="settings-page">${settingsHeader('Administración')}<p>Acceso reservado a administradores.</p></section>`,true);
 const metrics=state.adminOverview,p=state.adminPage;return shell(`<section class="settings-page admin-page">${settingsHeader('Administración')}${authMsg()}<div class="admin-intro"><div><div class="kicker">Gestión de DOHOY</div><h2>Tu panel</h2></div><button class="icon" aria-label="Actualizar panel" onclick="openAdmin(state.adminSection,state.adminOffset)">↻</button></div>${adminAttentionHtml()}${adminBusinessHtml()}${launchReadinessHtml()}${metrics?`<div class="admin-owner-summary"><div><small>OPERACIÓN DOHOY</small><h3>Centro de control</h3><p>Supervisa usuarios, trabajos, seguridad y reputación desde un solo lugar.</p></div><span>${iconSvg("trend")}</span></div><div class="admin-metrics">${Object.entries(ADMIN_SECTIONS).map(([key,label])=>`<button onclick="openAdmin('${key}')"><b>${Number(metrics[key]||0)}</b><span>${label}${key==='reports'||key==='disputes'?' pendientes':''}</span></button>`).join('')}</div><p class="small">${Number(metrics.suspended||0)} cuentas suspendidas. Los bloqueos son decisiones entre usuarios.</p>`:''}<div class="admin-tabs" role="group" aria-label="Secciones de administración">${Object.entries(ADMIN_SECTIONS).map(([key,label])=>`<button class="${state.adminSection===key?'selected':''}" aria-pressed="${state.adminSection===key}" onclick="openAdmin('${key}')">${label}</button>`).join('')}</div>${state.adminSection==='users'?`<form class="admin-search" onsubmit="searchAdminUsers(event)"><label for="adminUserSearch">Buscar por nombre o ID</label><div><input id="adminUserSearch" name="query" maxlength="120" value="${escapeAttr(state.adminQuery||'')}" placeholder="Nombre o ID de usuario"><button class="btn primary">Buscar</button></div></form>`:''}${state.adminLoading?'<div class="empty" role="status">Cargando datos…</div>':p?`<h2>${ADMIN_SECTIONS[state.adminSection]} <small>(${Number(p.total)})</small></h2><div class="admin-list">${p.items?.length?p.items.map(adminRecord).join(''):'<div class="empty">No hay registros en esta sección.</div>'}</div><div class="admin-pagination"><button class="btn ghost" ${p.offset<=0?'disabled':''} onclick="openAdmin(state.adminSection,${Math.max(0,p.offset-p.limit)})">Anterior</button><span>${p.total?`${p.offset+1}–${Math.min(p.total,p.offset+p.items.length)}`:'0'} de ${Number(p.total)}</span><button class="btn ghost" ${p.offset+p.limit>=p.total?'disabled':''} onclick="openAdmin(state.adminSection,${p.offset+p.limit})">Siguiente</button></div>`:''}</section>`,true)
}
async function searchAdminUsers(e){e.preventDefault();state.adminQuery=String(new FormData(e.target).get('query')||'').trim();await openAdmin('users',0)}
async function adminSuspendUser(id,suspended){if(!adminAllowed()||state.adminBusy||id===state.user.id)return;const p=state.adminPage?.items.find(x=>x.id===id);if(!p)return;if(!confirm(`${suspended?'Suspender':'Reactivar'} la cuenta de ${profileDisplayName(p)}?${suspended?' No podrá publicar tareas, enviar ofertas ni mensajes.':''}`))return;state.adminBusy=true;render();try{const {error}=await sb.rpc('admin_set_user_suspended',{p_user_id:id,p_suspended:suspended});if(error)throw error;await openAdmin('users',state.adminOffset);state.notice=suspended?'Cuenta suspendida.':'Cuenta reactivada.'}catch(err){state.error='No pudimos cambiar la cuenta: '+err.message}finally{state.adminBusy=false;render()}}
async function adminReviewReport(source,id,closed){if(!adminAllowed()||state.adminBusy)return;state.adminBusy=true;render();try{const {error}=await sb.rpc('admin_review_report',{p_source:source,p_id:String(id),p_closed:closed});if(error)throw error;await openAdmin(state.adminSection,state.adminOffset);state.notice=closed?'Reporte marcado como revisado.':'Reporte reabierto.'}catch(err){state.error='No pudimos actualizar el reporte: '+err.message}finally{state.adminBusy=false;render()}}
async function adminOpenSupport(id){state.supportBackRoute='admin';await openSupportCase(id)}
function onboardingDone(){try{return localStorage.getItem('dohoy_onboarding_v1')==='1'}catch{return false}}
function openOnboarding(){state.onboardingStep=0;go('onboarding')}
function onboardingScreen(){const steps=[{title:'Publica',subtitle:'Tu pendiente tiene solución.',copy:'Describe lo que necesitas, agrega fotos y define cuánto ofreces. Tú eliges entre las propuestas recibidas.',icon:'plus',hint:'Para quienes necesitan ayuda'},{title:'Encuentra',subtitle:'Hay tareas cerca de ti.',copy:'Explora trabajos por categoría, precio y distancia. Envía una propuesta cuando encuentres uno que puedas realizar.',icon:'search',hint:'Para quienes quieren trabajar'},{title:'Realiza',subtitle:'Coordinen y terminen con confianza.',copy:'Hablen por el chat de la tarea, compartan evidencia del resultado y confirmen que quedó terminado. Después pueden calificarse.',icon:'verify',hint:'Una tarea, de principio a fin'}],i=Math.min(2,Math.max(0,state.onboardingStep||0)),s=steps[i];return shell(`<section class="onboarding"><div class="onboarding-top">${logo(true)}<button class="onboarding-skip" onclick="finishOnboarding()">Omitir</button></div><div class="onboarding-content"><div class="onboarding-art step-${i}"><span class="onboarding-orbit"></span><div>${iconSvg(s.icon)}</div><span class="onboarding-badge">${escapeHtml(s.hint)}</span></div><p class="kicker">${i+1} de 3</p><h1>${s.title}</h1><h2>${s.subtitle}</h2><p>${s.copy}</p></div><div class="onboarding-bottom"><div class="onboarding-dots" role="group" aria-label="Pasos de bienvenida">${steps.map((x,j)=>`<button class="${i===j?'current':''}" aria-label="Paso ${j+1}: ${x.title}" aria-pressed="${i===j}" onclick="onboardingStep(${j})"><span></span></button>`).join('')}</div><button class="btn primary" onclick="${i===2?'finishOnboarding()':`onboardingStep(${i+1})`}">${i===2?'Elegir cómo usar DOHOY':'Continuar'}</button>${i>0?`<button class="text-action onboarding-back" onclick="onboardingStep(${i-1})">Volver</button>`:''}</div></section>`)}
function onboardingStep(i){state.onboardingStep=Math.min(2,Math.max(0,i));go('onboarding')}
function finishOnboarding(){try{localStorage.setItem('dohoy_onboarding_v1','1')}catch{}go('mode')}
function suspendedScreen(){return shell(`<section class="screen"><div class="top">${logo(true)}</div><div class="setting-empty">${iconSvg('shield')}<h1>Cuenta suspendida</h1><p>Contacta a soporte para revisar tu situación. Puedes consultar tus casos y enviar información.</p></div>${authMsg()}<button class="btn primary" onclick="openSupportCenter()">Soporte y disputas</button><button class="btn ghost" onclick="signOutCurrent()">Cerrar sesión</button></section>`)}

window.setNotificationFilter=setNotificationFilter;window.setTheme=setTheme;window.publishWizardNext=publishWizardNext;window.sendQuickReply=sendQuickReply;window.sendChatImage=sendChatImage;window.retryCurrentView=retryCurrentView;window.saveTrustedContact=saveTrustedContact;window.contactTrustedPerson=contactTrustedPerson;window.removePendingTaskPhoto=removePendingTaskPhoto;window.removeCompletionEvidence=removeCompletionEvidence;window.selectCompletionEvidence=selectCompletionEvidence;window.openMediaPhoto=openMediaPhoto;window.openClientProfile=openClientProfile;window.saveClientRating=saveClientRating;window.openSafetyCenter=openSafetyCenter;window.openBlockedUsers=openBlockedUsers;window.unblockUser=unblockUser;window.openMyReports=openMyReports;window.shareCurrentTask=shareCurrentTask;window.selectTaskPhotos=selectTaskPhotos;window.openCounterOfferSheet=openCounterOfferSheet;window.submitCounterOffer=submitCounterOffer;window.respondCounterOffer=respondCounterOffer;window.markTaskEnRoute=markTaskEnRoute;window.markTaskArrived=markTaskArrived;window.saveEditTask=saveEditTask;window.state=state;window.openProfileField=openProfileField;window.openPhotoChoiceSheet=openPhotoChoiceSheet;window.openGalleryPicker=openGalleryPicker;window.handleGalleryPhoto=handleGalleryPhoto;window.closeProfileSheet=closeProfileSheet;window.saveProfileField=saveProfileField;window.saveSocialNetworks=saveSocialNetworks;window.requestAccountDeletion=requestAccountDeletion;window.go=go;window.mode=mode;window.signOut=signOut;window.openTask=openTask;window.acceptOffer=acceptOffer;window.startTask=startTask;window.requestTaskCompletion=requestTaskCompletion;window.confirmTaskCompletion=confirmTaskCompletion;window.setTaskStatus=setTaskStatus;window.openChat=openChat;window.openMessagesHome=openMessagesHome;window.sendMessage=sendMessage;window.backFromChat=backFromChat;window.toggleVehicleOptions=toggleVehicleOptions;window.updateVehiclePreview=updateVehiclePreview;window.updateCategoryPreview=updateCategoryPreview;window.openWorkerProfile=openWorkerProfile;window.openWorkerPhoto=openWorkerPhoto;window.closeWorkerPhoto=closeWorkerPhoto;window.openConversationFromList=openConversationFromList;window.bindConversationSwipes=bindConversationSwipes;window.selectTaskRating=selectTaskRating;window.clearTaskRating=clearTaskRating;window.deleteConversation=deleteConversation;window.openNotificationsCenter=openNotificationsCenter;window.openNotification=openNotification;window.markAllNotificationsRead=markAllNotificationsRead;window.openCancelTaskSheet=openCancelTaskSheet;window.submitCancelTask=submitCancelTask;window.openCompletionProblemSheet=openCompletionProblemSheet;window.submitCompletionProblem=submitCompletionProblem;window.openUserReportSheet=openUserReportSheet;window.submitUserReport=submitUserReport;window.blockOtherUser=blockOtherUser;window.toggleFavoriteWorker=toggleFavoriteWorker;window.openFavorites=openFavorites;window.saveRatingReview=saveRatingReview;
window.openWorkerMap=openWorkerMap;window.showMapTask=showMapTask;window.setWorkerAvailability=setWorkerAvailability;window.acceptDirectInvite=acceptDirectInvite;window.declineDirectInvite=declineDirectInvite;window.openInviteWorker=openInviteWorker;window.sendWorkerInvite=sendWorkerInvite;window.askTaskQuestion=askTaskQuestion;window.answerTaskQuestion=answerTaskQuestion;window.openPortfolioManager=openPortfolioManager;window.savePortfolioPhoto=savePortfolioPhoto;window.deletePortfolioPhoto=deletePortfolioPhoto;window.loadPriceSuggestion=loadPriceSuggestion;window.openAdminBanners=openAdminBanners;window.createAdminBanner=createAdminBanner;window.toggleAdminBanner=toggleAdminBanner;
window.filterWorkerTasks=filterWorkerTasks;window.setWorkerFilter=setWorkerFilter;window.resetWorkerFilters=resetWorkerFilters;window.saveSearchPreferences=saveSearchPreferences;window.openWorkerCategory=openWorkerCategory;window.requestDiscoveryLocation=requestDiscoveryLocation;window.enablePushNotifications=enablePushNotifications;window.disablePushNotifications=disablePushNotifications;window.openSupportCenter=openSupportCenter;window.newSupportCase=newSupportCase;window.selectSupportFiles=selectSupportFiles;window.removeSupportFile=removeSupportFile;window.submitSupportCase=submitSupportCase;window.openSupportCase=openSupportCase;window.editSupportDraft=editSupportDraft;window.replySupportCase=replySupportCase;
window.addEventListener('online',()=>{state.online=true;state.notice='Conexión restablecida.';render();setTimeout(()=>{state.notice='';render()},1200)});
window.addEventListener('offline',()=>{state.online=false;render()});
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='DOHOY_OPEN_TASK')openTaskFromPush(e.data.taskId);if(e.data?.type==='DOHOY_OPEN_ACTIVITY'){if(state.user)openNotificationsCenter();else sessionStorage.setItem('dohoy_pending_activity','1')}});
window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(state.theme==='auto')applyTheme()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();state.installPrompt=e});
window.addEventListener('appinstalled',()=>{state.installPrompt=null;localStorage.setItem('dohoy_installed','1')});
init();
</script></body></html>
