:root{

.hero-badge:before{background:var(--o);box-shadow:0 0 0 4px #FF7A0029}

function haversineKm(lat1,lon1,lat2,lon2){
 const R=6371,toRad=v=>v*Math.PI/180;
 const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
 const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
 return 2*R*Math.asin(Math.sqrt(a))
}
function taskDistanceKm(t){
 if(!state.workerLocation||t?.latitude==null||t?.longitude==null)return null;
 return haversineKm(state.workerLocation.latitude,state.workerLocation.longitude,Number(t.latitude),Number(t.longitude))
}
function distanceLabel(km){
 if(km==null||!Number.isFinite(km))return "";
 if(km<1)return `${Math.max(1,Math.round(km*1000))} m`;
 return `${km.toFixed(km<10?1:0)} km`
}
function sortTasksByDistance(list){
 const arr=[...(list||[])];
 if(!state.workerLocation)return arr;
 return arr.sort((a,b)=>{
   const da=taskDistanceKm(a),db=taskDistanceKm(b);
   if(da==null&&db==null)return 0;
   if(da==null)return 1;
   if(db==null)return -1;
   return da-db
 })
}
async function reverseGeocode(lat,lon){
 try{
   const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=18&addressdetails=1`;
   const res=await fetch(url,{headers:{"Accept-Language":"es-MX,es;q=0.9"}});
   if(!res.ok)throw new Error("geocode");
   const j=await res.json(),a=j.address||{};
   const street=a.road||a.pedestrian||a.residential||a.footway||a.cycleway||"";
   const number=a.house_number||"";
   const locality=a.neighbourhood||a.suburb||a.city_district||a.city||a.town||a.village||"";
   const parts=[];
   if(street)parts.push(`${street}${number?` ${number}`:""}`);
   if(locality&&(!street||!street.toLowerCase().includes(locality.toLowerCase())))parts.push(locality);
   const short=parts.slice(0,2).join(", ");
   return short||String(j.display_name||"").split(",").slice(0,2).join(",").trim()||"Ubicación actual";
 }catch(e){return "Ubicación actual"}
}

   el.querySelector("span").textContent=state.workerLocation?(state.workerAddress||"Ubicación activa"):"Activar ubicación para ver trabajos cercanos";
 }

function stopWorkerLocation(){
 if(workerGeoWatchId!=null&&navigator.geolocation){navigator.geolocation.clearWatch(workerGeoWatchId)}
 workerGeoWatchId=null;state.workerLocation=null;state.workerLocationError="";state.workerAddress="";workerAddressUpdatedAt=0;updateWorkerLocationUI()
}
function toggleWorkerLocation(){
 if(workerGeoWatchId!=null){stopWorkerLocation();return}
 if(!navigator.geolocation){state.workerLocationError="Tu navegador no permite acceder a la ubicación.";return updateWorkerLocationUI()}
 state.workerLocationError="";
 workerGeoWatchId=navigator.geolocation.watchPosition(pos=>{
   state.workerLocation={latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy,updatedAt:Date.now()};
   const now=Date.now();
   if(!state.workerAddress||now-workerAddressUpdatedAt>30000){
     workerAddressUpdatedAt=now;
     if(!state.workerAddress)state.workerAddress="Buscando dirección…";
     reverseGeocode(pos.coords.latitude,pos.coords.longitude).then(address=>{
       if(workerGeoWatchId!=null&&state.workerLocation){state.workerAddress=address;updateWorkerLocationUI()}
     });
   }
   updateWorkerLocationUI()
 },err=>{
   workerGeoWatchId=null;
   state.workerLocationError=err.code===1?"Permiso de ubicación rechazado. Puedes activarlo desde Safari.":"No pudimos obtener tu ubicación. Intenta de nuevo.";
   updateWorkerLocationUI()
 },{enableHighAccuracy:true,maximumAge:5000,timeout:12000})
}
function useTaskCurrentLocation(btn){
 if(!navigator.geolocation){alert("Tu navegador no permite acceder a la ubicación.");return}
 const old=btn?.innerHTML;if(btn){btn.disabled=true;btn.textContent="Buscando ubicación…"}
 navigator.geolocation.getCurrentPosition(async pos=>{
   const lat=document.getElementById("taskLatitude"),lon=document.getElementById("taskLongitude"),input=document.querySelector('input[name="location"]');
   if(lat)lat.value=pos.coords.latitude;if(lon)lon.value=pos.coords.longitude;
   const address=await reverseGeocode(pos.coords.latitude,pos.coords.longitude);
   if(input)input.value=address;
   if(btn){btn.disabled=false;btn.classList.add("ok");btn.innerHTML=`${iconSvg("location")} ${escapeHtml(address)}`}
 },err=>{
   if(btn){btn.disabled=false;btn.innerHTML=old||"Usar mi ubicación actual"}
   alert(err.code===1?"Necesitamos permiso de ubicación para usar esta función.":"No pudimos obtener tu ubicación. Intenta otra vez.")
 },{enableHighAccuracy:true,maximumAge:0,timeout:12000})
}

 const saveBtn=document.querySelector('#cameraReviewActions .orange');if(saveBtn){saveBtn.disabled=true;saveBtn.textContent="Guardando…"}
 const path=`${state.user.id}/profile.jpg`;
 const {error:uploadError}=await sb.storage.from("avatars").upload(path,pendingAvatarBlob,{contentType:"image/jpeg",upsert:true,cacheControl:"3600"});
 if(uploadError){if(saveBtn){saveBtn.disabled=false;saveBtn.textContent="Usar esta foto"}state.error="No se pudo guardar la foto: "+uploadError.message;closeProfileCamera();render();return}
 const {error:updateError}=await sb.from("profiles").update({avatar_url:path}).eq("id",state.user.id);
 if(updateError){state.error="La foto se subió, pero no pudimos actualizar tu perfil: "+updateError.message;closeProfileCamera();render();return}
 await loadProfile();closeProfileCamera();state.notice="Foto de perfil actualizada.";render()
}
async function markDeliveredForTasks(ids){
if(!state.user||!ids?.length)return;
await sb.from("messages").update({delivered_at:new Date().toISOString()}).in("task_id",ids).neq("sender_id",state.user.id).is("delivered_at",null)
}
async function markAllIncomingDelivered(){
if(!state.user)return;
const {data}=await sb.from("tasks").select("id").or(`client_id.eq.${state.user.id},worker_id.eq.${state.user.id}`).not("worker_id","is",null);
if(data?.length)await markDeliveredForTasks(data.map(x=>x.id))
}
function startDeliveryPoll(){
if(deliveryPoller)clearInterval(deliveryPoller);
if(!state.user)return;
deliveryPoller=setInterval(()=>{if(state.user)markAllIncomingDelivered()},5000)
}
async function loadConversations(){
const {data:tasks,error}=await sb.from("tasks").select("id,title,category,status,client_id,worker_id,updated_at").or(`client_id.eq.${state.user.id},worker_id.eq.${state.user.id}`).not("worker_id","is",null).order("updated_at",{ascending:false});
if(error){state.error=error.message;state.conversations=[];return}
await markDeliveredForTasks(tasks.map(t=>t.id));
state.conversations=await Promise.all(tasks.map(async t=>{
  const {data:msgs}=await sb.from("messages").select("id,sender_id,body,created_at,delivered_at,read_at").eq("task_id",t.id).order("created_at",{ascending:false}).limit(50);
  const arr=msgs||[];
  return {...t,last_message:arr[0]||null,unread:arr.filter(m=>m.sender_id!==state.user.id&&!m.read_at).length}
}));
state.conversations.sort((a,b)=>new Date(b.last_message?.created_at||b.updated_at)-new Date(a.last_message?.created_at||a.updated_at))
}
async function openMessagesHome(){
clearPoll();await loadConversations();state.route="messagesHome";render();
poller=setInterval(async()=>{if(state.route!=="messagesHome")return;await loadConversations();const el=document.getElementById("conversationList");if(el)el.innerHTML=conversationListHtml()},4000)
}
function conversationListHtml(){
if(!state.conversations.length)return `<div class="empty">Aún no tienes conversaciones.</div>`;
return state.conversations.map(t=>`<button class="card chat-item" onclick="openChat('${t.id}','messagesHome')">
<div class="thumb">${taskIcon(t)}</div>
<div><div class="chat-title">${escapeHtml(t.title)}</div><div class="chat-preview">${t.last_message?`${t.last_message.sender_id===state.user.id?"Tú: ":""}${escapeHtml(t.last_message.body)}`:"Todavía no hay mensajes"}</div></div>
<div>${t.unread?`<span class="unread">${t.unread}</span>`:`<span class="small">${statusText(t.status)}</span>`}</div>
</button>`).join("")
}
function messagesHomeScreen(){
return shell(`<section class="screen"><div class="top"><button class="icon" onclick="go('${state.mode==="client"?"clientHome":"workerHome"}')">←</button><div><b>Mensajes</b><div class="small">Chats organizados por tarea</div></div><span></span></div>
<div class="kicker">Bandeja</div><h1 style="margin-top:8px">Tus conversaciones</h1><p class="sub">Cada chat está vinculado a una tarea.</p><div id="conversationList" class="chat-list" style="margin-top:18px">${conversationListHtml()}</div></section>`,true)
}
async function openChat(id,backRoute="taskDetail"){
clearPoll();const {data:t,error}=await sb.from("tasks").select("*").eq("id",id).single();if(error)return setMsg("error",error.message);
state.selectedTask=t;state.chatBack=backRoute;state.route="chat";state.chatDraft="";await loadMessages(id);await markChatRead(id);await loadMessages(id);render();scrollChatToBottom();
subscribeToChat(id);poller=setInterval(refreshChatMessages,1500)
}
async function markChatRead(taskId){
const now=new Date().toISOString();
await sb.from("messages").update({delivered_at:now}).eq("task_id",taskId).neq("sender_id",state.user.id).is("delivered_at",null);
await sb.from("messages").update({read_at:now}).eq("task_id",taskId).neq("sender_id",state.user.id).is("read_at",null)
}
function receiptMarkup(m){
if(m.read_at)return `<span class="receipt read">✓✓</span>`;
if(m.delivered_at)return `<span class="receipt">✓✓</span>`;
return `<span class="receipt">✓</span>`
}
function timeText(v){try{return new Date(v).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})}catch{return ""}}
function messageSignature(){return state.messages.map(m=>`${m.id}:${m.delivered_at||""}:${m.read_at||""}`).join("|")}
function messagesHtml(){
return state.messages.length?state.messages.map(m=>{
const mine=m.sender_id===state.user.id;
return `<div class="bubble ${mine?"me":"other"}"><div>${escapeHtml(m.body)}</div><div class="bubble-meta"><span>${timeText(m.created_at)}</span>${mine?receiptMarkup(m):""}</div></div>`
}).join(""):`<div class="empty">Escribe el primer mensaje.</div>`
}
function chatScreen(){
const t=state.selectedTask;
return shell(`<section class="screen"><div class="top"><button class="icon" onclick="backFromChat()">←</button><div><b>Chat de la tarea</b><div class="small">${escapeHtml(t.title)}</div></div><span></span></div>
<div class="kicker" style="margin-bottom:12px">Conversación de la tarea</div><div id="chatMessages" class="chat">${messagesHtml()}</div><div style="height:104px"></div>
<div class="chatbar"><input id="chatInput" autocomplete="off" value="${escapeAttr(state.chatDraft||"")}" oninput="state.chatDraft=this.value" placeholder="Escribe un mensaje…"><button onclick="sendMessage()">➤</button></div></section>`,true)
}
function backFromChat(){if(state.chatBack==="messagesHome")openMessagesHome();else go("taskDetail")}
function scrollChatToBottom(){if(state.route==="chat")window.scrollTo(0,document.body.scrollHeight)}
function refreshChatDom(shouldScroll=false){
const el=document.getElementById("chatMessages");if(!el)return;
el.innerHTML=messagesHtml();if(shouldScroll)scrollChatToBottom()
}
function upsertRealtimeMessage(msg){
const i=state.messages.findIndex(m=>m.id===msg.id);
if(i>=0)state.messages[i]={...state.messages[i],...msg};else state.messages.push(msg);
state.messages.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))
}
function subscribeToChat(taskId){
if(chatChannel){sb.removeChannel(chatChannel);chatChannel=null}
chatChannel=sb.channel(`dohoy-chat-${taskId}`)
.on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`task_id=eq.${taskId}`},async payload=>{
  const incoming=payload.new;const isNew=!state.messages.some(m=>m.id===incoming.id);upsertRealtimeMessage(incoming);
  if(incoming.sender_id!==state.user.id){await markChatRead(taskId);await loadMessages(taskId)}
  refreshChatDom(isNew)
})
.on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:`task_id=eq.${taskId}`},payload=>{
  upsertRealtimeMessage(payload.new);refreshChatDom(false)
})
.subscribe()
}
async function refreshChatMessages(){
if(state.route!=="chat"||!state.selectedTask)return;
const draft=document.getElementById("chatInput")?.value??state.chatDraft;
await loadMessages(state.selectedTask.id);await markChatRead(state.selectedTask.id);await loadMessages(state.selectedTask.id);
state.chatDraft=draft;refreshChatDom(false)
}
function render(){
if(state.route==="loading"){root.innerHTML=shell(`<section class="screen spinner">Cargando DOHOY…</section>`);return}
if(!state.session&&!["welcome","signup","login"].includes(state.route)){state.route="welcome"}
if(state.route==="clientHome"){clientHome();return}
if(state.route==="workerHome"){workerHome();return}
if(state.route==="workerCategory"){workerCategory();return}
if(state.route==="createTask"){createTask();bindForms();return}
if(state.route==="taskDetail"){taskDetail().then(bindForms);return}
if(state.route==="profile"){profile().then(bindForms);return}
if(state.route==="editProfile"){editProfile().then(bindForms);return}
if(state.route==="addresses"){root.innerHTML=addressesScreen();return}
if(state.route==="payments"){root.innerHTML=paymentsScreen();return}
if(state.route==="billing"){root.innerHTML=billingScreen();return}
if(state.route==="verification"){root.innerHTML=verificationScreen();return}
if(state.route==="language"){root.innerHTML=languageScreen();return}
if(state.route==="notifications"){root.innerHTML=notificationsScreen();return}
if(state.route==="help"){root.innerHTML=helpScreen();return}
if(state.route==="terms"){root.innerHTML=termsScreen();return}
if(state.route==="privacy"){root.innerHTML=privacyScreen();return}
const sync={welcome,signup,login,mode:chooseMode,chat:chatScreen,messagesHome:messagesHomeScreen};
const fn=sync[state.route]||welcome;root.innerHTML=fn();bindForms()
}
function bindForms(){
const s=document.getElementById("signupForm");if(s)s.onsubmit=signUp;
const l=document.getElementById("loginForm");if(l)l.onsubmit=signIn;
const t=document.getElementById("taskForm");if(t)t.onsubmit=publishTask;
const o=document.getElementById("offerForm");if(o)o.onsubmit=sendOffer;
const p=document.getElementById("profileForm");if(p)p.onsubmit=saveProfile;
}
async function signUp(e){
e.preventDefault();const f=new FormData(e.target);
const {data,error}=await sb.auth.signUp({email:f.get("email"),password:f.get("password"),options:{data:{full_name:f.get("name")},emailRedirectTo:REDIRECT_URL}});
if(error)return setMsg("error",error.message);
if(data.session){state.session=data.session;state.user=data.user;await loadProfile();go("mode")}
else{state.notice="Cuenta creada. Revisa tu correo y confirma tu cuenta; después vuelve a DOHOY e inicia sesión.";state.error="";render()}
}
async function signIn(e){
e.preventDefault();const f=new FormData(e.target);const {data,error}=await sb.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});
if(error)return setMsg("error",error.message);state.session=data.session;state.user=data.user;await loadProfile();await markAllIncomingDelivered();startDeliveryPoll();go("mode")
}
async function signOut(){return signOutCurrent()}
async function loadProfile(){
if(!state.user)return;const {data,error}=await sb.from("profiles").select("id,full_name,avatar_url,bio,rating,completed_tasks,identity_verified,phone_verified,driver_license_verified,created_at").eq("id",state.user.id).single();
if(!error)state.profile=await resolveAvatar(data)
}
async function saveProfile(e){
e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from("profiles").update({full_name:f.get("name"),bio:f.get("bio")}).eq("id",state.user.id);
if(error)return setMsg("error",error.message);await loadProfile();state.notice="Perfil guardado.";render()
}
async function publishTask(e){
e.preventDefault();const f=new FormData(e.target);const base=f.get("category");const category=encodeCategory(base,f.get("vehicle_variant"),f.get("vehicle_color"));const d=f.get("task_date"),tm=f.get("task_time");const scheduled_for=d?new Date(`${d}T${tm||"12:00"}:00`).toISOString():null;const lat=f.get("latitude"),lon=f.get("longitude");const payload={client_id:state.user.id,title:f.get("title"),description:f.get("description"),category,location_label:f.get("location"),latitude:lat?Number(lat):null,longitude:lon?Number(lon):null,offered_price:Number(f.get("price")),scheduled_for,requires_driver_license:f.get("license")==="on"};
const {data,error}=await sb.from("tasks").insert(payload).select().single();if(error)return setMsg("error",error.message);state.selectedTask=data;go("taskDetail")
}
async function loadMyTasks(){const {data,error}=await sb.from("tasks").select("*").eq("client_id",state.user.id).order("created_at",{ascending:false});state.tasks=error?[]:data}
async function loadOpenTasks(){const {data,error}=await sb.from("tasks").select("*").eq("status","open").neq("client_id",state.user.id).order("created_at",{ascending:false});state.tasks=error?[]:data}
async function openTask(id){
const {data,error}=await sb.from("tasks").select("*").eq("id",id).single();if(error)return setMsg("error",error.message);state.selectedTask=data;go("taskDetail")
}
async function loadOffers(taskId){
const {data,error}=await sb.from("task_offers").select("id,task_id,worker_id,amount,message,status,created_at,profiles!task_offers_worker_id_fkey(full_name,avatar_url,rating,completed_tasks,identity_verified,driver_license_verified)").eq("task_id",taskId).order("created_at",{ascending:true});
if(error){state.offers=[];return}
state.offers=await Promise.all((data||[]).map(async o=>({...o,profiles:await resolveAvatar(o.profiles)})))
}
async function loadMyOffer(taskId){
const {data,error}=await sb.from("task_offers").select("*").eq("task_id",taskId).eq("worker_id",state.user.id).limit(1);state.offers=error?[]:data
}
async function sendOffer(e){
e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from("task_offers").insert({task_id:state.selectedTask.id,worker_id:state.user.id,amount:Number(f.get("amount")),message:f.get("message")});
if(error)return setMsg("error",error.message);await loadMyOffer(state.selectedTask.id);state.notice="Oferta enviada.";render()
}
async function acceptOffer(offerId,workerId){
const tid=state.selectedTask.id;
let r=await sb.from("task_offers").update({status:"accepted"}).eq("id",offerId);if(r.error)return setMsg("error",r.error.message);
await sb.from("task_offers").update({status:"rejected"}).eq("task_id",tid).neq("id",offerId);
r=await sb.from("tasks").update({worker_id:workerId,status:"assigned"}).eq("id",tid).eq("client_id",state.user.id).select().single();
if(r.error)return setMsg("error",r.error.message);state.selectedTask=r.data;state.notice="Trabajador seleccionado.";await loadOffers(tid);render()
}
async function setTaskStatus(id,status){
const {data,error}=await sb.from("tasks").update({status}).eq("id",id).select().single();if(error)return setMsg("error",error.message);state.selectedTask=data;render()
}
async function loadMessages(taskId){
const {data,error}=await sb.from("messages").select("*").eq("task_id",taskId).order("created_at",{ascending:true});if(!error)state.messages=data
}
async function sendMessage(){
const inp=document.getElementById("chatInput");const body=(inp?.value??state.chatDraft).trim();if(!body)return;
const taskId=state.selectedTask.id;const {data,error}=await sb.from("messages").insert({task_id:taskId,sender_id:state.user.id,body}).select().single();
if(error)return setMsg("error",error.message);
state.chatDraft="";if(inp)inp.value="";if(data)upsertRealtimeMessage(data);refreshChatDom(true);if(inp)inp.focus()
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]))}
function escapeAttr(v){return escapeHtml(v).replace(/`/g,"&#96;")}
async function init(){
const {data}=await sb.auth.getSession();state.session=data.session;state.user=data.session?.user||null;if(state.user){await loadProfile();await markAllIncomingDelivered();startDeliveryPoll()}
state.route=state.session?"mode":"welcome";render();
sb.auth.onAuthStateChange(async(_event,session)=>{state.session=session;state.user=session?.user||null;if(state.user)await loadProfile();if(!session&&!["welcome","signup","login"].includes(state.route))go("welcome")})
}
window.state=state;window.go=go;window.mode=mode;window.signOut=signOut;window.openTask=openTask;window.acceptOffer=acceptOffer;window.setTaskStatus=setTaskStatus;window.openChat=openChat;window.openMessagesHome=openMessagesHome;window.sendMessage=sendMessage;window.backFromChat=backFromChat;window.toggleVehicleOptions=toggleVehicleOptions;window.updateVehiclePreview=updateVehiclePreview;window.updateCategoryPreview=updateCategoryPreview;
init();
</script></body></html>
