<style>

.hero h1{font-size:42px;line-height:.98;letter-spacing:-1.9px;margin:20px 0 13px;max-width:390px}.hero p{font-size:16px;color:#eee5f3;margin:0;max-width:350px}

.logo{font-size:44px;font-weight:1000;letter-spacing:-2.5px;line-height:1}.logo b{color:var(--o)}.logo.sm{font-size:28px;letter-spacing:-1.4px}.tag{margin-top:9px;color:#dfd5e5;font-weight:620;font-size:13px}
h1{font-size:32px;line-height:1.04;letter-spacing:-1.1px;margin:14px 0 9px}h2{margin:21px 0 10px;font-size:21px;letter-spacing:-.45px}h3{letter-spacing:-.25px}p{line-height:1.48}.sub{color:var(--mut);margin-top:6px}.kicker{color:var(--o);font-size:11px;font-weight:950;letter-spacing:1.15px;text-transform:uppercase}
.btn{border:0;border-radius:17px;padding:15px 18px;width:100%;font-weight:900;margin-top:10px;min-height:52px;transition:transform .12s ease,box-shadow .15s ease}.btn:active{transform:scale(.985)}.primary{background:linear-gradient(135deg,var(--p),#5e187e);color:#fff;box-shadow:0 10px 24px #3d0d5d2a}.orange{background:linear-gradient(135deg,var(--o),#ff8140);color:#fff;box-shadow:0 10px 22px #ff68182b}.light{background:#fff;color:var(--p3);box-shadow:0 10px 30px #12051a2b}.ghost{background:#f0e9f4;color:var(--p)}.outline{background:#ffffff0b;border:1px solid #ffffff4a;color:#fff}.hero .btn{min-height:54px}.hero .outline{margin-top:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.top>div:first-child{min-width:0}.icon{border:1px solid #e8deed;background:#fff;color:var(--p);width:44px;height:44px;border-radius:15px;font-size:19px;display:grid;place-items:center;box-shadow:var(--soft)}.icon:active{transform:scale(.96)}.pill{display:inline-flex;align-items:center;background:#efe6f4;color:var(--p);border:1px solid #e3d4eb;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900}
.card{background:#fff;border:1px solid #eee7f1;border-radius:22px;padding:17px;box-shadow:var(--soft)}.cards{display:grid;gap:12px}.card:active{transform:scale(.994)}
.mode{min-height:168px;text-align:left;position:relative;overflow:hidden;padding:19px}.mode:after{content:"→";position:absolute;right:18px;bottom:18px;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:#f1e9f5;color:var(--p);font-weight:950}.mode .emoji{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:linear-gradient(145deg,#f5edf8,#fff);box-shadow:inset 0 0 0 1px #eadff0}.mode h3{font-size:22px;margin:14px 0 5px}.mode p{margin:0;color:var(--mut);max-width:260px;font-size:14px}.mode:first-child{background:linear-gradient(145deg,#fff 0%,#fff8f2 100%)}.mode:last-child{background:linear-gradient(145deg,#fff 0%,#f7f0fb 100%)}
.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;font-weight:900;color:#4b3d52}.input,textarea,select{width:100%;border:1.5px solid #e7dfea;border-radius:16px;padding:14px 14px;background:#fff;color:var(--ink);outline:none;transition:border .15s ease,box-shadow .15s ease}input:focus,textarea:focus,select:focus{border-color:#9b6db6;box-shadow:0 0 0 4px #6f32a010}textarea{min-height:104px;resize:vertical}.form-card{background:#fff;border:1px solid #eee7f1;border-radius:24px;padding:4px 16px 17px;box-shadow:var(--soft)}
.error{background:#fff0ef;color:var(--red);border:1px solid #f4c7c3;border-radius:14px;padding:11px 12px;margin:10px 0;font-size:13px}.ok{background:#eaf8f1;color:#12643f;border:1px solid #c6ead8;border-radius:14px;padding:12px 13px;margin:10px 0;font-size:13px}

.home-hero{background:linear-gradient(145deg,#2a1037 0%,#4b1464 70%,#64207f 100%);color:#fff;border-radius:27px;padding:21px 20px;position:relative;overflow:hidden;box-shadow:0 18px 34px #3d0d5d25;margin:5px 0 18px}.home-hero:after{content:"";position:absolute;width:130px;height:130px;right:-45px;top:-55px;border-radius:50%;background:#ff7a2d35}.home-hero>*{position:relative;z-index:1}.home-hero .small{color:#d9cce0}.home-hero h1{font-size:29px;margin:8px 0 6px}.home-hero p{margin:0;color:#e9deed;font-size:13px}.home-hero .btn{margin-top:17px;background:#fff;color:var(--p);box-shadow:none}.hero-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.switch-chip{border:1px solid #ffffff26;background:#ffffff13;color:#fff;border-radius:13px;padding:9px 11px;font-size:12px;font-weight:900}
.task{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;min-height:86px}.thumb{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,#f0e6f5,#fbf9fc);display:grid;place-items:center;font-size:26px;border:1px solid #e9ddee}.task h3{font-size:15px;margin:0 0 5px;line-height:1.25}.meta{font-size:11px;color:var(--mut);line-height:1.3}.task-price{text-align:right}.price{font-size:20px;font-weight:950;color:var(--green);letter-spacing:-.4px}.status-mini{display:inline-flex;margin-top:4px;padding:4px 7px;border-radius:999px;background:#f0ebf3;color:#746a79;font-size:9px;font-weight:900}.task-arrow{color:#b5aab9;font-size:17px;margin-left:4px}
.row{display:flex;gap:10px}.row>*{flex:1}.section{display:flex;justify-content:space-between;align-items:end;margin:24px 0 12px}.section h2{margin:0}.empty{text-align:center;color:var(--mut);padding:38px 16px;background:#fff;border:1px dashed #ded4e3;border-radius:22px}.empty:before{content:"✦";display:block;font-size:26px;color:#c7b4d1;margin-bottom:8px}
.avatar{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,#f7dbc9,#ddc9ed);display:grid;place-items:center;font-size:25px;border:1px solid #eadfea}.offer{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center}.stars{color:#ef8c00;font-weight:900;font-size:12px}
.detail-hero{background:linear-gradient(145deg,#fff 0%,#faf6fc 100%);border:1px solid #ebe2ef;border-radius:28px;padding:20px;box-shadow:var(--soft);margin-bottom:18px}.detail-icon{width:88px;height:88px;border-radius:28px;margin:0 auto 15px;display:grid;place-items:center;font-size:48px;background:linear-gradient(145deg,#f1e7f6,#fff);border:1px solid #eadfee;box-shadow:inset 0 0 20px #6f32a007}.detail-hero h1{margin:8px 0}.detail-price{font-size:26px;font-weight:1000;color:var(--green);letter-spacing:-.6px}.location-chip{display:inline-flex;align-items:center;gap:6px;color:var(--mut);background:#f5f1f7;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:750}
.status{display:grid;gap:9px}.status div{padding:13px;border-radius:15px;background:#f3edf7}.status .active{background:#eaf7f0;color:#12693f;font-weight:900;border:1px solid #d2eddf}
.profile-hero{text-align:center;background:linear-gradient(145deg,#2c1039,#5c1778);color:#fff;border-radius:28px;padding:27px 18px 22px;box-shadow:0 18px 36px #3d0d5d28;margin-bottom:18px}.profile-hero .avatar{margin:auto;width:82px;height:82px;border-radius:26px;font-size:38px;background:#fff}.profile-hero h1{margin-bottom:5px}.profile-hero .sub{color:#ddcfe4}.profile-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.profile-stat{padding:11px;border-radius:15px;background:#ffffff12;border:1px solid #ffffff16}.profile-stat b{display:block;font-size:17px}.profile-stat span{font-size:10px;color:#d9cce0}
.chat{display:grid;gap:8px;padding-bottom:4px}.bubble{max-width:82%;padding:11px 13px 8px;border-radius:19px;font-size:14px;line-height:1.42;box-shadow:0 5px 15px #3d0d5d0a}.bubble.me{margin-left:auto;background:linear-gradient(145deg,#43105f,#591579);color:#fff;border-bottom-right-radius:7px}.bubble.other{background:#fff;border:1px solid #e8dfea;border-bottom-left-radius:7px}.bubble-meta{display:flex;justify-content:flex-end;gap:6px;align-items:center;margin-top:4px;font-size:10px;opacity:.82}.receipt{font-weight:1000;letter-spacing:-2px;color:#d8d3dd;opacity:1}.receipt.read{color:var(--o);opacity:1}.chatbar{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);width:min(424px,calc(100% - 30px));display:flex;gap:8px;z-index:31;background:#ffffffdf;padding:7px;border:1px solid #e8e0ec;border-radius:20px;backdrop-filter:blur(20px);box-shadow:0 12px 35px #26102f1d}.chatbar input{flex:1;border:0;border-radius:14px;padding:13px 10px;background:transparent;outline:none;min-width:0}.chatbar button{width:48px;height:48px;border:0;border-radius:15px;background:linear-gradient(145deg,var(--p),#631b83);color:#fff;font-size:18px;box-shadow:0 8px 18px #3d0d5d2b}.chat-list{display:grid;gap:10px}.chat-item{width:100%;display:grid;grid-template-columns:50px 1fr auto;gap:11px;align-items:center;text-align:left;min-height:80px}.chat-item .thumb{width:50px;height:50px;border-radius:17px}.chat-title{font-weight:950;margin-bottom:4px;font-size:14px}.chat-preview{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}.unread{min-width:23px;height:23px;padding:0 7px;border-radius:999px;background:linear-gradient(145deg,var(--o),#ff8a43);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:950;box-shadow:0 5px 12px #ff68182b}
.small{font-size:11px;color:var(--mut)}.center{text-align:center}.spinner{padding:55px 0;text-align:center;color:var(--mut)}
.beta-note{font-size:10px;color:#a297a7;text-align:center;margin:13px 0}.auth-card{background:#fff;border:1px solid #ede5f0;border-radius:27px;padding:18px;box-shadow:var(--shadow);margin-top:18px}
@media(min-width:700px){body{padding:24px 0}.app{border-radius:34px;min-height:900px}.screen,.hero{min-height:900px}.nav{bottom:34px}.chatbar{bottom:109px}}
</style>

<body><div id="root"></div>
<script>
const SUPABASE_URL="https://qakhqnuigpjbeeahuyct.supabase.co";
const SUPABASE_KEY="sb_publishable_g6FMgju9Lv2mtJCn2heXCw_YhRjweyL";
const REDIRECT_URL="https://alexisreza000-cell.github.io/dohoy-demo/";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const root=document.getElementById("root");

let state={
  route:"loading", mode:localStorage.getItem("dohoy_mode")||"client",
  session:null,user:null,profile:null,tasks:[],selectedTask:null,offers:[],messages:[],conversations:[],chatBack:"taskDetail",chatDraft:"",notice:"",error:""
};
let poller=null;
let deliveryPoller=null;
let chatChannel=null;
const icons={Vehículo:"🚗",Mandados:"🛒",Paquetería:"📦",Hogar:"🏠",Mascotas:"🐾",Trámites:"📄",Otro:"✨"};
const money=n=>new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:0}).format(Number(n||0));
function logo(sm=false){return `<div class="logo ${sm?"sm":""}">DO<b>HOY</b></div>`}
function shell(content,nav=false){return `<main class="app">${content}${nav?navBar():""}</main>`}
function navBar(){const home=state.mode==="client"?"clientHome":"workerHome";const second=state.mode==="client"?"createTask":"workerHome";return `<nav class="nav">
<button class="${state.route===home?"active":""}" onclick="go('${home}')"><b>⌂</b><br>Inicio</button>
<button class="${state.route===second?"active":""}" onclick="go('${second}')"><b>${state.mode==="client"?"＋":"☷"}</b><br>${state.mode==="client"?"Publicar":"Tareas"}</button>
<button class="${["messagesHome","chat"].includes(state.route)?"active":""}" onclick="openMessagesHome()"><b>💬</b><br>Mensajes</button>
<button class="${state.route==="profile"?"active":""}" onclick="go('profile')"><b>●</b><br>Perfil</button>
</nav>`}
function clearPoll(){
if(poller){clearInterval(poller);poller=null}
if(chatChannel){sb.removeChannel(chatChannel);chatChannel=null}
}
function setMsg(type,msg){state.error=type==="error"?msg:"";state.notice=type==="ok"?msg:"";render()}
function go(r){clearPoll();state.route=r;state.error="";state.notice="";render();window.scrollTo(0,0)}
function mode(m){state.mode=m;localStorage.setItem("dohoy_mode",m);go(m==="client"?"clientHome":"workerHome")}
function authMsg(){return `${state.error?`<div class="error">${state.error}</div>`:""}${state.notice?`<div class="ok">${state.notice}</div>`:""}`}

function welcome(){
return shell(`<section class="hero">
<div>${logo()}<div class="tag">Lo necesitas. Alguien lo hace.</div></div>
<div class="hero-copy"><span class="hero-badge">BETA PRIVADA · DOHOY 0.4</span><h1>Resuelve lo de hoy, hoy.</h1><p>Publica una tarea, recibe ofertas y coordina todo desde un solo lugar.</p>
<div class="hero-proof"><div class="proof"><b>⚡</b><span>Publica rápido</span></div><div class="proof"><b>💬</b><span>Chat por tarea</span></div><div class="proof"><b>✓✓</b><span>Estados de lectura</span></div></div></div>
<div><button class="btn light" onclick="go('signup')">Crear cuenta</button><button class="btn outline" onclick="go('login')">Ya tengo cuenta</button></div>
</section>`)
}
function signup(){
return shell(`<section class="screen">
<div class="top"><button class="icon" onclick="go('welcome')">←</button>${logo(true)}<span></span></div>
<div class="kicker">Crear cuenta</div><h1>Empieza en minutos.</h1><p class="sub">Crea tu perfil y elige si hoy necesitas ayuda o quieres trabajar.</p>${authMsg()}
<div class="auth-card"><form id="signupForm">
<div class="field"><label>Nombre</label><input class="input" name="name" required autocomplete="name"></div>
<div class="field"><label>Correo</label><input class="input" name="email" type="email" required autocomplete="email"></div>
<div class="field"><label>Contraseña</label><input class="input" name="password" type="password" minlength="8" required autocomplete="new-password"></div>
<button class="btn primary">Crear mi cuenta</button></form></div>
<p class="beta-note">Durante la beta te enviaremos un correo para confirmar tu cuenta.</p>
</section>`)
}
function login(){
return shell(`<section class="screen">
<div class="top"><button class="icon" onclick="go('welcome')">←</button>${logo(true)}<span></span></div>
<div class="kicker">Iniciar sesión</div><h1>Qué bueno verte.</h1><p class="sub">Continúa donde te quedaste.</p>${authMsg()}
<div class="auth-card"><form id="loginForm">
<div class="field"><label>Correo</label><input class="input" name="email" type="email" required autocomplete="email"></div>
<div class="field"><label>Contraseña</label><input class="input" name="password" type="password" required autocomplete="current-password"></div>
<button class="btn primary">Entrar</button></form></div>
</section>`)
}
function chooseMode(){
return shell(`<section class="screen"><div class="top">${logo(true)}<button class="icon" onclick="signOut()">↪</button></div>
<div class="kicker">Tu DOHOY</div><h1>¿Cómo quieres usar DOHOY?</h1><p class="sub">Puedes cambiar de modo cuando quieras con la misma cuenta.</p>
<div class="cards">
<button class="card mode" onclick="mode('client')"><div class="emoji">🙋🏻</div><h3>Necesito ayuda</h3><p>Publica lo que necesitas y elige quién lo hace.</p></button>
<button class="card mode" onclick="mode('worker')"><div class="emoji">💼</div><h3>Quiero trabajar</h3><p>Encuentra tareas cercanas y envía tu propuesta.</p></button>
</div></section>`)
}
function taskCard(t,client=false){
return `<button class="card task" onclick="openTask('${t.id}')">
<div class="thumb">${icons[t.category]||"✨"}</div><div><h3>${escapeHtml(t.title)}</h3><div class="meta">📍 ${escapeHtml(t.location_label||"Sin ubicación")}</div><span class="status-mini">${statusText(t.status)}</span></div><div class="task-price"><div class="price">${money(t.offered_price)}</div><span class="task-arrow">›</span></div>
</button>`
}
function statusText(s){return ({open:"Abierta",assigned:"Asignada",in_progress:"En curso",completed:"Terminada",cancelled:"Cancelada"})[s]||s}
async function clientHome(){
await loadMyTasks();
root.innerHTML=shell(`<section class="screen"><div class="top"><div>${logo(true)}<div class="small">Hola, ${escapeHtml((state.profile?.full_name||"Usuario").split(" ")[0])}</div></div><button class="icon" onclick="go('mode')">⇄</button></div>
<div class="home-hero"><div class="hero-row"><div><div class="kicker">Modo cliente</div><h1>¿Qué necesitas resolver hoy?</h1></div><span class="switch-chip">Cambiar modo</span></div><p>Describe la tarea, define cuánto pagas y recibe propuestas.</p><button class="btn" onclick="go('createTask')">＋ Publicar una tarea</button></div>
<div class="section"><h2>Mis tareas</h2><button class="pill" onclick="loadMyTasks().then(render)">Actualizar</button></div>
<div class="cards">${state.tasks.length?state.tasks.map(t=>taskCard(t,true)).join(""):`<div class="empty">Todavía no has publicado ninguna tarea.</div>`}</div>
</section>`,true)
}
async function workerHome(){
await loadOpenTasks();
root.innerHTML=shell(`<section class="screen"><div class="top"><div>${logo(true)}<div class="small">Oportunidades disponibles</div></div><button class="icon" onclick="go('mode')">⇄</button></div>
<div class="home-hero"><div class="hero-row"><div><div class="kicker">Modo trabajador</div><h1>Encuentra una tarea para hoy.</h1></div><span class="switch-chip">Cambiar modo</span></div><p>Revisa trabajos abiertos y envía una propuesta cuando te convenga.</p></div><div class="section"><h2>Tareas abiertas</h2><span class="pill">${state.tasks.length} disponibles</span></div>
<div class="cards">${state.tasks.length?state.tasks.map(t=>taskCard(t)).join(""):`<div class="empty">No hay tareas abiertas por ahora.</div>`}</div>
</section>`,true)
}
function createTask(){
root.innerHTML=shell(`<section class="screen"><div class="top"><button class="icon" onclick="go('clientHome')">←</button><b>Nueva tarea</b><span></span></div>
<div class="kicker">Nueva tarea</div><h1>Cuéntanos qué necesitas.</h1><p class="sub">Entre más claro seas, mejores ofertas recibirás.</p>${authMsg()}
<div class="form-card"><form id="taskForm">
<div class="field"><label>Título</label><input class="input" name="title" required placeholder="Ej. Llevar mi carro al autolavado"></div>
<div class="field"><label>Descripción</label><textarea name="description" required placeholder="Explica exactamente qué debe hacer la persona"></textarea></div>
<div class="field"><label>Categoría</label><select name="category">${Object.keys(icons).map(x=>`<option>${x}</option>`).join("")}</select></div>
<div class="field"><label>Ubicación general</label><input class="input" name="location" required placeholder="Ej. Torreón, Coahuila"></div>
<div class="field"><label>Pago ofrecido</label><input class="input" name="price" type="number" min="1" step="1" required></div>
<label class="card" style="display:flex;gap:10px;align-items:center"><input name="license" type="checkbox"> Requiere licencia de conducir</label>
<button class="btn primary">Publicar tarea</button></form></div>
</section>`,true)
}
async function taskDetail(){
const t=state.selectedTask;if(!t)return go(state.mode==="client"?"clientHome":"workerHome");
const isOwner=t.client_id===state.user.id;
if(isOwner) await loadOffers(t.id);
else await loadMyOffer(t.id);
let body="";
if(isOwner){
body=`<h2>Ofertas recibidas</h2><div class="cards">${state.offers.length?state.offers.map(o=>{
const p=o.profiles||{};return `<div class="card"><div class="offer"><div class="avatar">👤</div><div><b>${escapeHtml(p.full_name||"Trabajador")}</b><div class="stars">★ ${p.rating??5}</div><div class="small">${escapeHtml(o.message||"Sin mensaje")}</div></div><div class="price">${money(o.amount)}</div></div>
${t.status==="open"?`<button class="btn primary" onclick="acceptOffer('${o.id}','${o.worker_id}')">Elegir trabajador</button>`:`<div class="pill">${o.status}</div>`}</div>`}).join(""):`<div class="empty">Aún no hay ofertas.</div>`}</div>`;
}else{
const my=state.offers[0];
body=t.status==="open"?`<h2>Haz una oferta</h2>${my?`<div class="ok">Ya ofreciste ${money(my.amount)}. Estado: ${my.status}.</div>`:`<form id="offerForm"><div class="field"><label>Tu precio</label><input class="input" name="amount" type="number" min="1" value="${Number(t.offered_price)}" required></div><div class="field"><label>Mensaje</label><textarea name="message" placeholder="Ej. Puedo hacerlo hoy por la tarde"></textarea></div><button class="btn primary">Enviar oferta</button></form>`}`:
t.worker_id===state.user.id?`<div class="ok">Esta tarea está asignada a ti.</div>${taskProgressButtons(t)}`:`<div class="sub">Esta tarea ya no está disponible.</div>`;
}
root.innerHTML=shell(`<section class="screen"><div class="top"><button class="icon" onclick="go('${isOwner?"clientHome":"workerHome"}')">←</button><span class="pill">${escapeHtml(t.category)}</span><span></span></div>
<div class="detail-hero"><div class="detail-icon">${icons[t.category]||"✨"}</div><div class="detail-price">${money(t.offered_price)}</div><h1>${escapeHtml(t.title)}</h1><p>${escapeHtml(t.description)}</p><span class="location-chip">📍 ${escapeHtml(t.location_label||"")}</span></div>
<div class="status"><div class="active">● ${statusText(t.status)}</div></div>
${(t.client_id===state.user.id||t.worker_id===state.user.id)&&t.worker_id?`<button class="btn ghost" onclick="openChat('${t.id}')">💬 Abrir chat</button>`:""}
${body}</section>`,true)
}
function taskProgressButtons(t){
if(t.status==="assigned")return `<button class="btn orange" onclick="setTaskStatus('${t.id}','in_progress')">Comenzar tarea</button>`;
if(t.status==="in_progress")return `<button class="btn orange" onclick="setTaskStatus('${t.id}','completed')">Marcar como completada</button>`;
return `<div class="ok">Trabajo ${statusText(t.status).toLowerCase()}.</div>`
}
async function profile(){
await loadProfile();
root.innerHTML=shell(`<section class="screen"><div class="top">${logo(true)}<button class="icon" onclick="signOut()">↪</button></div>
<div class="profile-hero"><div class="avatar">🧑🏻</div><h1>${escapeHtml(state.profile?.full_name||"Usuario DOHOY")}</h1><p class="sub">${escapeHtml(state.user.email||"")}</p><div class="profile-stats"><div class="profile-stat"><b>⭐ ${state.profile?.rating??5}</b><span>Calificación</span></div><div class="profile-stat"><b>${state.profile?.completed_tasks??0}</b><span>Tareas completadas</span></div></div></div>${authMsg()}
<div class="form-card"><form id="profileForm"><div class="field"><label>Nombre</label><input class="input" name="name" value="${escapeAttr(state.profile?.full_name||"")}"></div><div class="field"><label>Bio</label><textarea name="bio">${escapeHtml(state.profile?.bio||"")}</textarea></div><button class="btn primary">Guardar perfil</button></form></div>
<div class="card" style="margin-top:15px"><b>Verificaciones</b><br><br>${state.profile?.identity_verified?"✅":"○"} Identidad verificada<br><br>${state.profile?.driver_license_verified?"✅":"○"} Licencia verificada</div>
<button class="btn ghost" onclick="go('mode')">Cambiar modo</button></section>`,true)
}
async function markDeliveredForTasks(ids){
if(!state.user||!ids?.length)return;
await sb.from("messages").update({delivered_at:new Date().toISOString()}).in("task_id",ids).neq("sender_id",state.user.id).is("delivered_at",null)
}
async function markAllIncomingDelivered(){
if(!state.user)return;
const {data}=await sb.from("tasks").select("id").or(`client_id.eq.${state.user.id},worker_id.eq.${state.user.id}`).not("worker_id","is",null);
if(data?.length)await markDeliveredForTasks(data.map(x=>x.id))
}
function startDeliveryPoll(){
if(deliveryPoller)clearInterval(deliveryPoller);
if(!state.user)return;
deliveryPoller=setInterval(()=>{if(state.user)markAllIncomingDelivered()},5000)
}
async function loadConversations(){
const {data:tasks,error}=await sb.from("tasks").select("id,title,category,status,client_id,worker_id,updated_at").or(`client_id.eq.${state.user.id},worker_id.eq.${state.user.id}`).not("worker_id","is",null).order("updated_at",{ascending:false});
if(error){state.error=error.message;state.conversations=[];return}
await markDeliveredForTasks(tasks.map(t=>t.id));
state.conversations=await Promise.all(tasks.map(async t=>{
  const {data:msgs}=await sb.from("messages").select("id,sender_id,body,created_at,delivered_at,read_at").eq("task_id",t.id).order("created_at",{ascending:false}).limit(50);
  const arr=msgs||[];
  return {...t,last_message:arr[0]||null,unread:arr.filter(m=>m.sender_id!==state.user.id&&!m.read_at).length}
}));
state.conversations.sort((a,b)=>new Date(b.last_message?.created_at||b.updated_at)-new Date(a.last_message?.created_at||a.updated_at))
}
async function openMessagesHome(){
clearPoll();await loadConversations();state.route="messagesHome";render();
poller=setInterval(async()=>{if(state.route!=="messagesHome")return;await loadConversations();const el=document.getElementById("conversationList");if(el)el.innerHTML=conversationListHtml()},4000)
}
function conversationListHtml(){
if(!state.conversations.length)return `<div class="empty">Aún no tienes conversaciones.</div>`;
return state.conversations.map(t=>`<button class="card chat-item" onclick="openChat('${t.id}','messagesHome')">
<div class="thumb">${icons[t.category]||"💬"}</div>
<div><div class="chat-title">${escapeHtml(t.title)}</div><div class="chat-preview">${t.last_message?`${t.last_message.sender_id===state.user.id?"Tú: ":""}${escapeHtml(t.last_message.body)}`:"Todavía no hay mensajes"}</div></div>
<div>${t.unread?`<span class="unread">${t.unread}</span>`:`<span class="small">${statusText(t.status)}</span>`}</div>
</button>`).join("")
}
function messagesHomeScreen(){
return shell(`<section class="screen"><div class="top"><button class="icon" onclick="go('${state.mode==="client"?"clientHome":"workerHome"}')">←</button><div><b>Mensajes</b><div class="small">Chats organizados por tarea</div></div><span></span></div>
<div class="kicker">Bandeja</div><h1 style="margin-top:8px">Tus conversaciones</h1><p class="sub">Cada chat está vinculado a una tarea.</p><div id="conversationList" class="chat-list" style="margin-top:18px">${conversationListHtml()}</div></section>`,true)
}
async function openChat(id,backRoute="taskDetail"){
clearPoll();const {data:t,error}=await sb.from("tasks").select("*").eq("id",id).single();if(error)return setMsg("error",error.message);
state.selectedTask=t;state.chatBack=backRoute;state.route="chat";state.chatDraft="";await loadMessages(id);await markChatRead(id);await loadMessages(id);render();scrollChatToBottom();
subscribeToChat(id);poller=setInterval(refreshChatMessages,1500)
}
async function markChatRead(taskId){
const now=new Date().toISOString();
await sb.from("messages").update({delivered_at:now}).eq("task_id",taskId).neq("sender_id",state.user.id).is("delivered_at",null);
await sb.from("messages").update({read_at:now}).eq("task_id",taskId).neq("sender_id",state.user.id).is("read_at",null)
}
function receiptMarkup(m){
if(m.read_at)return `<span class="receipt read">✓✓</span>`;
if(m.delivered_at)return `<span class="receipt">✓✓</span>`;
return `<span class="receipt">✓</span>`
}
function timeText(v){try{return new Date(v).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})}catch{return ""}}
function messageSignature(){return state.messages.map(m=>`${m.id}:${m.delivered_at||""}:${m.read_at||""}`).join("|")}
function messagesHtml(){
return state.messages.length?state.messages.map(m=>{
const mine=m.sender_id===state.user.id;
return `<div class="bubble ${mine?"me":"other"}"><div>${escapeHtml(m.body)}</div><div class="bubble-meta"><span>${timeText(m.created_at)}</span>${mine?receiptMarkup(m):""}</div></div>`
}).join(""):`<div class="empty">Escribe el primer mensaje.</div>`
}
function chatScreen(){
const t=state.selectedTask;
return shell(`<section class="screen"><div class="top"><button class="icon" onclick="backFromChat()">←</button><div><b>Chat de la tarea</b><div class="small">${escapeHtml(t.title)}</div></div><span></span></div>
<div class="kicker" style="margin-bottom:12px">Conversación de la tarea</div><div id="chatMessages" class="chat">${messagesHtml()}</div><div style="height:104px"></div>
<div class="chatbar"><input id="chatInput" autocomplete="off" value="${escapeAttr(state.chatDraft||"")}" oninput="state.chatDraft=this.value" placeholder="Escribe un mensaje…"><button onclick="sendMessage()">➤</button></div></section>`,true)
}
function backFromChat(){if(state.chatBack==="messagesHome")openMessagesHome();else go("taskDetail")}
function scrollChatToBottom(){if(state.route==="chat")window.scrollTo(0,document.body.scrollHeight)}
function refreshChatDom(shouldScroll=false){
const el=document.getElementById("chatMessages");if(!el)return;
el.innerHTML=messagesHtml();if(shouldScroll)scrollChatToBottom()
}
function upsertRealtimeMessage(msg){
const i=state.messages.findIndex(m=>m.id===msg.id);
if(i>=0)state.messages[i]={...state.messages[i],...msg};else state.messages.push(msg);
state.messages.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))
}
function subscribeToChat(taskId){
if(chatChannel){sb.removeChannel(chatChannel);chatChannel=null}
chatChannel=sb.channel(`dohoy-chat-${taskId}`)
.on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`task_id=eq.${taskId}`},async payload=>{
  const incoming=payload.new;const isNew=!state.messages.some(m=>m.id===incoming.id);upsertRealtimeMessage(incoming);
  if(incoming.sender_id!==state.user.id){await markChatRead(taskId);await loadMessages(taskId)}
  refreshChatDom(isNew)
})
.on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:`task_id=eq.${taskId}`},payload=>{
  upsertRealtimeMessage(payload.new);refreshChatDom(false)
})
.subscribe()
}
async function refreshChatMessages(){
if(state.route!=="chat"||!state.selectedTask)return;
const draft=document.getElementById("chatInput")?.value??state.chatDraft;
await loadMessages(state.selectedTask.id);await markChatRead(state.selectedTask.id);await loadMessages(state.selectedTask.id);
state.chatDraft=draft;refreshChatDom(false)
}
function render(){
if(state.route==="loading"){root.innerHTML=shell(`<section class="screen spinner">Cargando DOHOY…</section>`);return}
if(!state.session&&!["welcome","signup","login"].includes(state.route)){state.route="welcome"}
if(state.route==="clientHome"){clientHome();return}
if(state.route==="workerHome"){workerHome();return}
if(state.route==="createTask"){createTask();bindForms();return}
if(state.route==="taskDetail"){taskDetail().then(bindForms);return}
if(state.route==="profile"){profile().then(bindForms);return}
const sync={welcome,signup,login,mode:chooseMode,chat:chatScreen,messagesHome:messagesHomeScreen};
const fn=sync[state.route]||welcome;root.innerHTML=fn();bindForms()
}
function bindForms(){
const s=document.getElementById("signupForm");if(s)s.onsubmit=signUp;
const l=document.getElementById("loginForm");if(l)l.onsubmit=signIn;
const t=document.getElementById("taskForm");if(t)t.onsubmit=publishTask;
const o=document.getElementById("offerForm");if(o)o.onsubmit=sendOffer;
const p=document.getElementById("profileForm");if(p)p.onsubmit=saveProfile;
}
async function signUp(e){
e.preventDefault();const f=new FormData(e.target);
const {data,error}=await sb.auth.signUp({email:f.get("email"),password:f.get("password"),options:{data:{full_name:f.get("name")},emailRedirectTo:REDIRECT_URL}});
if(error)return setMsg("error",error.message);
if(data.session){state.session=data.session;state.user=data.user;await loadProfile();go("mode")}
else{state.notice="Cuenta creada. Revisa tu correo y confirma tu cuenta; después vuelve a DOHOY e inicia sesión.";state.error="";render()}
}
async function signIn(e){
e.preventDefault();const f=new FormData(e.target);const {data,error}=await sb.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});
if(error)return setMsg("error",error.message);state.session=data.session;state.user=data.user;await loadProfile();await markAllIncomingDelivered();startDeliveryPoll();go("mode")
}
async function signOut(){await sb.auth.signOut();if(deliveryPoller){clearInterval(deliveryPoller);deliveryPoller=null}state.session=null;state.user=null;state.profile=null;state.tasks=[];state.conversations=[];go("welcome")}
async function loadProfile(){
if(!state.user)return;const {data,error}=await sb.from("profiles").select("id,full_name,avatar_url,bio,rating,completed_tasks,identity_verified,phone_verified,driver_license_verified,created_at").eq("id",state.user.id).single();
if(!error)state.profile=data
}
async function saveProfile(e){
e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from("profiles").update({full_name:f.get("name"),bio:f.get("bio")}).eq("id",state.user.id);
if(error)return setMsg("error",error.message);await loadProfile();state.notice="Perfil guardado.";render()
}
async function publishTask(e){
e.preventDefault();const f=new FormData(e.target);const payload={client_id:state.user.id,title:f.get("title"),description:f.get("description"),category:f.get("category"),location_label:f.get("location"),offered_price:Number(f.get("price")),requires_driver_license:f.get("license")==="on"};
const {data,error}=await sb.from("tasks").insert(payload).select().single();if(error)return setMsg("error",error.message);state.selectedTask=data;go("taskDetail")
}
async function loadMyTasks(){const {data,error}=await sb.from("tasks").select("*").eq("client_id",state.user.id).order("created_at",{ascending:false});state.tasks=error?[]:data}
async function loadOpenTasks(){const {data,error}=await sb.from("tasks").select("*").eq("status","open").neq("client_id",state.user.id).order("created_at",{ascending:false});state.tasks=error?[]:data}
async function openTask(id){
const {data,error}=await sb.from("tasks").select("*").eq("id",id).single();if(error)return setMsg("error",error.message);state.selectedTask=data;go("taskDetail")
}
async function loadOffers(taskId){
const {data,error}=await sb.from("task_offers").select("id,task_id,worker_id,amount,message,status,created_at,profiles!task_offers_worker_id_fkey(full_name,rating,completed_tasks,identity_verified,driver_license_verified)").eq("task_id",taskId).order("created_at",{ascending:true});
state.offers=error?[]:data
}
async function loadMyOffer(taskId){
const {data,error}=await sb.from("task_offers").select("*").eq("task_id",taskId).eq("worker_id",state.user.id).limit(1);state.offers=error?[]:data
}
async function sendOffer(e){
e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from("task_offers").insert({task_id:state.selectedTask.id,worker_id:state.user.id,amount:Number(f.get("amount")),message:f.get("message")});
if(error)return setMsg("error",error.message);await loadMyOffer(state.selectedTask.id);state.notice="Oferta enviada.";render()
}
async function acceptOffer(offerId,workerId){
const tid=state.selectedTask.id;
let r=await sb.from("task_offers").update({status:"accepted"}).eq("id",offerId);if(r.error)return setMsg("error",r.error.message);
await sb.from("task_offers").update({status:"rejected"}).eq("task_id",tid).neq("id",offerId);
r=await sb.from("tasks").update({worker_id:workerId,status:"assigned"}).eq("id",tid).eq("client_id",state.user.id).select().single();
if(r.error)return setMsg("error",r.error.message);state.selectedTask=r.data;state.notice="Trabajador seleccionado.";await loadOffers(tid);render()
}
async function setTaskStatus(id,status){
const {data,error}=await sb.from("tasks").update({status}).eq("id",id).select().single();if(error)return setMsg("error",error.message);state.selectedTask=data;render()
}
async function loadMessages(taskId){
const {data,error}=await sb.from("messages").select("*").eq("task_id",taskId).order("created_at",{ascending:true});if(!error)state.messages=data
}
async function sendMessage(){
const inp=document.getElementById("chatInput");const body=(inp?.value??state.chatDraft).trim();if(!body)return;
const taskId=state.selectedTask.id;const {data,error}=await sb.from("messages").insert({task_id:taskId,sender_id:state.user.id,body}).select().single();
if(error)return setMsg("error",error.message);
state.chatDraft="";if(inp)inp.value="";if(data)upsertRealtimeMessage(data);refreshChatDom(true);if(inp)inp.focus()
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]))}
function escapeAttr(v){return escapeHtml(v).replace(/`/g,"&#96;")}
async function init(){
const {data}=await sb.auth.getSession();state.session=data.session;state.user=data.session?.user||null;if(state.user){await loadProfile();await markAllIncomingDelivered();startDeliveryPoll()}
state.route=state.session?"mode":"welcome";render();
sb.auth.onAuthStateChange(async(_event,session)=>{state.session=session;state.user=session?.user||null;if(state.user)await loadProfile();if(!session&&!["welcome","signup","login"].includes(state.route))go("welcome")})
}
window.state=state;window.go=go;window.mode=mode;window.signOut=signOut;window.openTask=openTask;window.acceptOffer=acceptOffer;window.setTaskStatus=setTaskStatus;window.openChat=openChat;window.openMessagesHome=openMessagesHome;window.sendMessage=sendMessage;window.backFromChat=backFromChat;
init();
</script></body></html>
