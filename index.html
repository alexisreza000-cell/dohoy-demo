:root{

/* DOHOY 1.9.0 · UI REFRESH */
:root{
 --blue:#165DFF;--blue-2:#0F3D91;--blue-soft:#EAF2FF;--blue-pale:#F4F8FF;
 --orange:#FF7A00;--orange-2:#FFA94D;--orange-soft:#FFF1E5;
 --ink:#0F172A;--muted:#64748B;--surface:#FFFFFF;--surface-2:#F8FBFF;
 --line:#D9E5F5;--success:#16A34A;--danger:#DC2626;
 --shadow:0 14px 34px rgba(15,61,145,.10);--shadow-strong:0 18px 42px rgba(15,61,145,.16)
}
html,body{background:
 radial-gradient(circle at 90% 0%,#DDEBFF 0,transparent 30%),
 radial-gradient(circle at 0% 18%,#FFF0E1 0,transparent 24%),
 linear-gradient(180deg,#EEF5FF 0%,#F7FAFF 42%,#F4F7FB 100%)!important;color:var(--ink)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(22,93,255,.025),rgba(255,122,0,.025));z-index:-1}
.screen,.settings-page{background:transparent!important}
.screen>h1,.settings-page h1{color:var(--ink);letter-spacing:-.7px}
.screen>p,.settings-page p,.sub,.small,.meta,.row-sub{color:var(--muted)}

/* Headers / hero */
.home-hero,.hero,.profile-hero,.mode-hero,.account-hero,.safety-hero{background:linear-gradient(135deg,#0B3D91 0%,#165DFF 62%,#FF7A00 145%)!important;box-shadow:var(--shadow-strong)!important;border:1px solid rgba(255,255,255,.2)!important}
.home-hero:after,.hero:after,.profile-hero:after,.mode-hero:after,.account-hero:after{content:"";position:absolute;right:-42px;top:-48px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.topbar,.account-top{background:rgba(255,255,255,.76);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(213,225,242,.9);box-shadow:0 8px 26px rgba(15,61,145,.07)}

/* Cards */
.card,.task,.detail-card,.offer-person-card,.selected-worker-card,.rating-card,.completion-card,.completion-proof,.important-card,.recent-review,.settings-section,.client-profile-card,.client-rating-box,.timeline,.filter-card,.worker-search-card,.map-card,.empty,.chat-card,.notification-card,.admin-card{
 background:linear-gradient(145deg,#FFFFFF 0%,#FBFDFF 68%,#FFF9F3 115%)!important;
 border:1px solid var(--line)!important;border-radius:24px!important;box-shadow:var(--shadow)!important
}
.card:hover,.task:hover,.offer-person-card:hover{box-shadow:0 18px 42px rgba(15,61,145,.14)!important;border-color:#C6D9F5!important}
.task{position:relative;overflow:hidden}
.task:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--blue),var(--orange))}
.task .thumb,.detail-icon-box,.row-ico{background:linear-gradient(145deg,#E7F0FF,#FFF0E2)!important;color:var(--blue-2)!important;border:1px solid #D7E5F7!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.task .price,.detail-money,.worker-price{color:var(--orange)!important;font-weight:1000!important}
.task h3,.detail-card h2,.offer-person-card h3{color:var(--ink)!important}

/* Category + status chips */
.detail-category-pill,.chip,.badge,.profile-chip,.category-pill,.status-pill,.location-pill,.task .tag{background:var(--blue-soft)!important;color:var(--blue-2)!important;border:1px solid #D5E4FA!important;box-shadow:none!important}
.status-open,.badge-open,.available{background:#ECFDF3!important;color:#15803D!important;border-color:#CDEED8!important}
.status-assigned,.badge-assigned,.status-pending{background:#FFF4E8!important;color:#C65A00!important;border-color:#FFD7B5!important}
.status-paid,.badge-paid,.status-completed{background:#ECFDF3!important;color:#15803D!important;border-color:#CDEED8!important}

/* Buttons */
.btn,.primary,.chat-cta-btn,.publish-submit,.login-btn,.signup-btn,.save-btn{border:0!important;border-radius:18px!important;font-weight:950!important;letter-spacing:.1px!important;background:linear-gradient(135deg,var(--blue-2) 0%,var(--blue) 78%)!important;color:#fff!important;box-shadow:0 12px 26px rgba(22,93,255,.24)!important;transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}
.btn:active,.primary:active,.chat-cta-btn:active,.publish-submit:active,.login-btn:active,.signup-btn:active,.save-btn:active,.payment-cta:active{transform:translateY(1px) scale(.992)!important}
.btn:hover,.primary:hover,.chat-cta-btn:hover,.publish-submit:hover,.login-btn:hover,.signup-btn:hover,.save-btn:hover{filter:brightness(1.03);box-shadow:0 16px 30px rgba(22,93,255,.29)!important}
.secondary,.secondary-soft,.edit-task-btn{background:#EDF4FF!important;color:var(--blue-2)!important;border:1px solid #D5E4FA!important;box-shadow:none!important}
.accent,.accent-soft,.orange-btn{background:linear-gradient(135deg,var(--orange),var(--orange-2))!important;color:#fff!important;border:0!important;box-shadow:0 12px 25px rgba(255,122,0,.23)!important}

/* Inputs */
input,textarea,select{background:#FBFDFF!important;border:1.5px solid #CFDCEC!important;border-radius:17px!important;color:var(--ink)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)!important;transition:border-color .15s ease,box-shadow .15s ease,background .15s ease}
input:focus,textarea:focus,select:focus{outline:none!important;border-color:var(--blue)!important;background:#fff!important;box-shadow:0 0 0 4px rgba(22,93,255,.10)!important}
label{color:#263A59!important;font-weight:850!important}

/* Auth */
.auth-page,.welcome,.signup,.login{background:transparent!important}
.auth-card,.welcome-card,.signup-card,.login-card{background:rgba(255,255,255,.93)!important;border:1px solid rgba(212,225,244,.95)!important;box-shadow:0 24px 58px rgba(15,61,145,.13)!important;border-radius:30px!important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.auth-kicker,.eyebrow,.onboarding-badge{color:var(--orange)!important;letter-spacing:2px!important;font-weight:1000!important}
.error,.alert-error{background:#FFF1F1!important;border-color:#F6C9C9!important;color:#B42318!important;border-radius:17px!important}
.notice,.alert-success{background:#ECFDF3!important;border-color:#CDEED8!important;color:#187A45!important;border-radius:17px!important}

/* Navigation */
.nav{background:rgba(255,255,255,.94)!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #D7E3F2!important;box-shadow:0 10px 32px rgba(15,61,145,.16)!important;border-radius:22px!important}
.nav button{border-radius:15px!important;color:#718096!important;transition:.16s ease}
.nav button.active{background:linear-gradient(145deg,#EAF2FF,#F2F7FF)!important;color:var(--blue-2)!important;box-shadow:inset 0 0 0 1px #D6E5FB!important}
.nav button.active .svg-icon,.nav button.active svg{color:var(--blue)!important}
.nav button.active b{background:linear-gradient(135deg,var(--blue),var(--blue-2))!important;color:#fff!important}

/* Settings */
.settings-section{overflow:hidden;padding:0!important}
.settings-section h2{padding:16px 16px 8px;margin:0;color:var(--blue-2)!important;font-size:13px;text-transform:uppercase;letter-spacing:1.1px}
.settings-row{background:#fff!important;border-top:1px solid #EDF2F8!important}
.settings-row:hover{background:#F7FAFF!important}
.chev{color:var(--orange)!important}

/* Offer / progress */
.counter-card{background:linear-gradient(145deg,#FFF7EC,#FFFDF9)!important;border-color:#FFD9B9!important;box-shadow:0 10px 26px rgba(255,122,0,.08)!important}
.timeline{overflow:hidden}
.timeline-step.done:before{background:var(--blue)!important}.timeline-step.current:before{background:var(--orange)!important;box-shadow:0 0 0 5px rgba(255,122,0,.14)!important}.timeline-step.done:not(:last-child):after{background:linear-gradient(90deg,var(--blue),#6EA6FF)!important}

/* Empty states */
.empty{padding:24px!important;text-align:center!important;background:linear-gradient(145deg,#F9FBFF,#FFF9F3)!important}
.empty .svg-icon{color:var(--blue)!important;background:var(--blue-soft);padding:12px;border-radius:18px}

/* Map / location */
.map-card{overflow:hidden!important}.map-title,.section-title{color:var(--blue-2)!important}.location-chip,.location-pill{background:#EEF4FF!important;color:#536A8A!important}

/* Mobile polish */
@media(max-width:520px){

/* DOHOY 2.0.0 — Pastel UI system */
:root{
 --pastel-blue:#eaf3ff;--pastel-blue-2:#dbeaff;
 --pastel-orange:#fff0e4;--pastel-orange-2:#ffe4cf;
 --pastel-lilac:#f2edff;--pastel-lilac-2:#e7ddff;
 --pastel-mint:#e8f8f3;--pastel-mint-2:#d8f2e9;
 --pastel-pink:#fff0f3;--pastel-yellow:#fff8df;
 --ui-blue:#1467e8;--ui-orange:#ff7417;--ui-purple:#6b4be3;--ui-mint:#10a783;
}
body{background:#edf3fb}
.app{background:linear-gradient(180deg,#fbfdff 0%,#f6f9fe 48%,#fffaf6 100%)}
.screen{background:radial-gradient(circle at 100% 4%,rgba(219,234,255,.75),transparent 24%),radial-gradient(circle at 0 48%,rgba(242,237,255,.72),transparent 26%),linear-gradient(180deg,#fbfdff 0%,#f7faff 58%,#fffaf7 100%)}
.card,.auth-card,.detail-hero,.worker-task,.market-search,.publish-card,.chat-item,.empty{border-color:#e4edf8!important;box-shadow:0 10px 28px rgba(53,84,135,.07)!important}
.market-search,input,textarea,select{background:#fbfdff!important}
.worker-task:nth-child(4n+1) .task-visual{background:linear-gradient(145deg,var(--pastel-blue),#f7fbff)!important;color:var(--ui-blue)}
.worker-task:nth-child(4n+2) .task-visual{background:linear-gradient(145deg,var(--pastel-orange),#fffaf6)!important;color:var(--ui-orange)}
.worker-task:nth-child(4n+3) .task-visual{background:linear-gradient(145deg,var(--pastel-lilac),#faf8ff)!important;color:var(--ui-purple)}
.worker-task:nth-child(4n) .task-visual{background:linear-gradient(145deg,var(--pastel-mint),#f7fffc)!important;color:var(--ui-mint)}
.cat-tile{border-color:#e6edf6;background:rgba(255,255,255,.9);box-shadow:0 8px 22px rgba(46,77,126,.055)}

function haversineKm(lat1,lon1,lat2,lon2){
 const R=6371,toRad=v=>v*Math.PI/180;
 const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
 const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
 return 2*R*Math.asin(Math.sqrt(a))
}
function taskDistanceKm(t){

 return haversineKm(state.workerLocation.latitude,state.workerLocation.longitude,Number(t.latitude),Number(t.longitude))
}

}

function sortTasksByDistance(list){
 const arr=[...(list||[])];
 if(!state.workerLocation)return arr;
 return arr.sort((a,b)=>{
   const da=taskDistanceKm(a),db=taskDistanceKm(b);
   if(da==null&&db==null)return 0;
   if(da==null)return 1;
   if(db==null)return -1;
   return da-db
 })
}
async function reverseGeocode(lat,lon){
 try{
   const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=18&addressdetails=1`;
   const res=await fetch(url,{headers:{"Accept-Language":"es-MX,es;q=0.9"}});
   if(!res.ok)throw new Error("geocode");
   const j=await res.json(),a=j.address||{};
   const street=a.road||a.pedestrian||a.residential||a.footway||a.cycleway||"";
   const number=a.house_number||"";
   const locality=a.neighbourhood||a.suburb||a.city_district||a.city||a.town||a.village||"";
   const parts=[];
   if(street)parts.push(`${street}${number?` ${number}`:""}`);
   if(locality&&(!street||!street.toLowerCase().includes(locality.toLowerCase())))parts.push(locality);
   const short=parts.slice(0,2).join(", ");
   return short||String(j.display_name||"").split(",").slice(0,2).join(",").trim()||"Ubicación actual";
 }catch(e){return "Ubicación actual"}
}

function stopWorkerLocation(){
 if(workerGeoWatchId!=null&&navigator.geolocation){navigator.geolocation.clearWatch(workerGeoWatchId)}
 workerGeoWatchId=null;state.workerLocation=null;state.workerLocationError="";state.workerAddress="";workerAddressUpdatedAt=0;updateWorkerLocationUI()
}
function toggleWorkerLocation(){
 if(workerGeoWatchId!=null){stopWorkerLocation();return}
 if(!navigator.geolocation){state.workerLocationError="Tu navegador no permite acceder a la ubicación.";return updateWorkerLocationUI()}
 state.workerLocationError="";
 workerGeoWatchId=navigator.geolocation.watchPosition(pos=>{
   state.workerLocation={latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy,updatedAt:Date.now()};
   const now=Date.now();
   if(!state.workerAddress||now-workerAddressUpdatedAt>30000){
     workerAddressUpdatedAt=now;
     if(!state.workerAddress)state.workerAddress="Buscando dirección…";
     reverseGeocode(pos.coords.latitude,pos.coords.longitude).then(address=>{
       if(workerGeoWatchId!=null&&state.workerLocation){state.workerAddress=address;updateWorkerLocationUI()}
     });
   }
   updateWorkerLocationUI()
 },err=>{
   workerGeoWatchId=null;
   state.workerLocationError=err.code===1?"Permiso de ubicación rechazado. Puedes activarlo desde Safari.":"No pudimos obtener tu ubicación. Intenta de nuevo.";
   updateWorkerLocationUI()
 },{enableHighAccuracy:true,maximumAge:5000,timeout:12000})
}
function useTaskCurrentLocation(btn){
 if(!navigator.geolocation){alert("Tu navegador no permite acceder a la ubicación.");return}
 const old=btn?.innerHTML;if(btn){btn.disabled=true;btn.textContent="Buscando ubicación…"}
 navigator.geolocation.getCurrentPosition(async pos=>{
   const lat=document.getElementById("taskLatitude"),lon=document.getElementById("taskLongitude"),input=document.querySelector('input[name="location"]');
   if(lat)lat.value=pos.coords.latitude;if(lon)lon.value=pos.coords.longitude;
   const address=await reverseGeocode(pos.coords.latitude,pos.coords.longitude);
   if(input)input.value=address;
   if(btn){btn.disabled=false;btn.classList.add("ok");btn.innerHTML=`${iconSvg("location")} ${escapeHtml(address)}`}
 },err=>{
   if(btn){btn.disabled=false;btn.innerHTML=old||"Usar mi ubicación actual"}
   alert(err.code===1?"Necesitamos permiso de ubicación para usar esta función.":"No pudimos obtener tu ubicación. Intenta otra vez.")
 },{enableHighAccuracy:true,maximumAge:0,timeout:12000})
}

 const key=x=>`${x.getFullYear()}-${x.getMonth()}-${x.getDate()}`;
 if(key(d)===key(today))return "Hoy";if(key(d)===key(y))return "Ayer";
 return d.toLocaleDateString("es-MX",{day:"numeric",month:"long"})
}
function compactNotifications(items){
 const groups=[],map=new Map();
 for(const n of items){
   const kind=notificationGroup(n);
   const key=n.task_id?`${kind}:${n.task_id}`:`single:${n.id}`;
   let g=map.get(key);
   if(!g){g={key,kind,task_id:n.task_id||"",latest:n,items:[],unread:0};map.set(key,g);groups.push(g)}
   g.items.push(n);if(!n.read_at)g.unread++;
   if(new Date(n.created_at)>new Date(g.latest.created_at))g.latest=n;
 }
 return groups.sort((a,b)=>new Date(b.latest.created_at)-new Date(a.latest.created_at))
}

async function loadClientTaskStats(){
 state.clientOfferCounts={};
 const ids=(state.tasks||[]).filter(t=>t.status==="open").map(t=>t.id);
 if(!ids.length)return;
 const {data,error}=await sb.from("task_offers").select("task_id,status").in("task_id",ids);
 if(error)return;
 for(const o of data||[])if(["pending","accepted"].includes(o.status))state.clientOfferCounts[o.task_id]=(state.clientOfferCounts[o.task_id]||0)+1
}
function startClientCategory(cat){

}

function taskUrgency(t){
 if(!t?.scheduled_for)return false;
 const ms=new Date(t.scheduled_for).getTime()-Date.now();
 return ms>=-3600000&&ms<=86400000
}
function smartMatchScore(t){
 let score=62;const d=taskDistanceKm(t),f=workerFilterState();
 if(d!=null)score+=d<=3?22:d<=8?15:d<=15?8:0;
 if(t?.is_urgent||taskUrgency(t))score+=7;
 if(Number(t.offered_price||0)>=500)score+=5;
 if(f.category&&baseCategory(t.category)===f.category)score+=8;
 return Math.max(55,Math.min(99,Math.round(score)))
}
function opportunityTags(t){
 const d=taskDistanceKm(t),tags=[];
 if(t?.is_urgent||taskUrgency(t))tags.push(`<span class="op-tag urgent">${iconSvg("fire")} URGENTE</span>`);
 if(d!=null&&d<=5)tags.push(`<span class="op-tag near">Cerca de ti</span>`);
 if(Number(t.offered_price||0)>=500)tags.push(`<span class="op-tag pay">Buen pago</span>`);
 return tags.join("")
}
function workerTaskCard(t){
 const d=taskDistanceKm(t),score=smartMatchScore(t);
 return `<button class="worker-task smart-task-card" onclick="openTask('${t.id}')">
   <div class="task-visual">${taskIcon(t)}</div>
   <div class="smart-task-main">
     <div class="smart-task-tags">${opportunityTags(t)}</div>
     <h3>${escapeHtml(t.title)}</h3>
     <div class="smart-task-price-row"><div class="price">${money(t.offered_price)}</div><span class="match-score">${score}% compatible</span></div>
     <div class="worker-meta">${iconSvg("location")}${d!=null?`<span class="distance-badge">${distanceLabel(d)}</span><span>·</span>`:""}<span>Ubicación aproximada</span><span>·</span><span>${t.scheduled_for?timeText(t.scheduled_for):"Flexible"}</span></div>
   </div><span class="worker-arrow">›</span>
 </button>`
}

function publishWizardProgress(){const steps=publishStepMeta();return `<div class="publish-wizard-progress"><div class="publish-progress-track"><i style="width:${state.publishStep/steps.length*100}%"></i></div><div class="publish-progress-copy"><span>Paso ${state.publishStep} de ${steps.length}</span><b>${steps[state.publishStep-1][0]}</b></div></div>`}
function publishStepValid(step){
 const f=document.getElementById("taskForm");if(!f)return false;
 const required=step===1?["title","description"]:step===2?["location"]:step===4?["price"]:[];
 for(const n of required){const el=f.elements[n];if(!String(el?.value||"").trim()){el?.focus();el?.reportValidity?.();return false}}
 return true
}
function publishWizardNext(delta=1){

 state.publishStep=Math.max(1,Math.min(5,state.publishStep+delta));renderPublishWizardStep();haptic()
}
function renderPublishWizardStep(){
 document.querySelectorAll(".publish-wizard-step").forEach(x=>x.classList.toggle("active",Number(x.dataset.step)===state.publishStep));
 const p=document.getElementById("publishWizardProgress");if(p)p.innerHTML=publishWizardProgress();
 const prev=document.getElementById("publishPrev"),next=document.getElementById("publishNext"),submit=document.getElementById("publishTaskButton");
 if(prev)prev.style.visibility=state.publishStep===1?"hidden":"visible";
 if(next)next.style.display=state.publishStep===5?"none":"inline-flex";

nchange="updateVehiclePreview()"><span class="color-dot" style="background:${v}"></span></label>`).join("")}</div></div></div></section>

async function loadPriceSuggestion(cat){const host=document.getElementById("priceSuggestion");if(host)host.textContent="Calculando precio sugerido…";const {data,error}=await sb.rpc("price_suggestion",{p_category:cat});state.priceSuggestion=error?null:data;if(!host)return;if(!data||Number(data.count||0)<3){host.innerHTML=`${iconSvg("info")} Aún no hay suficientes trabajos similares para sugerir un precio.`;return}host.innerHTML=`${iconSvg("trend")} Trabajos similares: <b>${money(data.low)}–${money(data.high)}</b> · típico ${money(data.median)} <button type="button" onclick="document.getElementById('taskPriceInput').value=${Number(data.median||0)}">Usar</button>`}
function toggleVehicleOptions(category){const el=document.getElementById("vehicleOptions");if(el)el.style.display=category==="Vehículo"?"block":"none"}
function updateCategoryPreview(category){const el=document.getElementById("categoryPreview");if(!el)return;el.innerHTML=`${iconSvg(category)}<span>${escapeHtml(category)}</span>`}
function updateVehiclePreview(){const variant=document.querySelector('input[name="vehicle_variant"]:checked')?.value||"sedan";const colorKey=document.querySelector('input[name="vehicle_color"]:checked')?.value||"graphite";const el=document.getElementById("vehiclePreview");if(el)el.innerHTML=vehicleSvg(variant,vehicleColors[colorKey]||vehicleColors.graphite);const cp=document.getElementById("categoryPreview");if(cp)cp.innerHTML=`${vehicleSvg(variant,vehicleColors[colorKey]||vehicleColors.graphite)}<span>Vehículo · ${variant==="suv"?"SUV":"Auto"}</span>`}

function renderTaskPhotoPreview(){
 const host=document.getElementById("taskPhotoPreview");if(!host)return;
 const limit=state.pendingTaskPhotoLimit??5;
 host.innerHTML=state.pendingTaskFiles.map((f,i)=>`<span class="media-preview-chip">${escapeHtml(f.name)} <button type="button" aria-label="Quitar foto ${i+1}" onclick="removePendingTaskPhoto(${i})">×</button></span>`).join("")+`<span class="sub" role="status">${state.pendingTaskFiles.length}/${limit} fotos nuevas${state.taskPhotoSelectionNote?` · ${escapeHtml(state.taskPhotoSelectionNote)}`:""}</span>`;
}
function removePendingTaskPhoto(index){state.pendingTaskFiles.splice(index,1);state.taskPhotoSelectionNote="";renderTaskPhotoPreview()}
function selectTaskPhotos(event){
 const input=event?.target,files=Array.from(input?.files||[]),limit=state.pendingTaskPhotoLimit??5;
 let skipped=0,overflow=0;
 for(const file of files){
  if(file.type&&!file.type.startsWith("image/")){skipped++;continue}
  if(state.pendingTaskFiles.some(f=>f.name===file.name&&f.size===file.size&&f.lastModified===file.lastModified))continue;
  if(state.pendingTaskFiles.length>=limit){overflow++;continue}
  state.pendingTaskFiles.push(file);
 }
 state.taskPhotoSelectionNote=overflow?"Máximo 5 fotos por tarea. Quita una para agregar otra.":skipped?"Solo se permiten imágenes.":"";
 renderTaskPhotoPreview();if(input)input.value="";
}
function selectCompletionEvidence(event){
 const input=event?.target,files=Array.from(input?.files||[]),limit=Math.max(0,3-(state.taskMedia||[]).filter(m=>m.kind==="completion").length);
 state.pendingCompletionFiles=state.pendingCompletionFiles||[];let skipped=0;
 for(const file of files){if(!file.type?.startsWith("image/")||file.size>20*1024*1024){skipped++;continue}if(state.pendingCompletionFiles.some(f=>f.name===file.name&&f.size===file.size&&f.lastModified===file.lastModified))continue;if(state.pendingCompletionFiles.length>=limit){skipped++;continue}state.pendingCompletionFiles.push(file)}
 state.completionSelectionNote=skipped?"Máximo 3 fotos por tarea; elige imágenes de menos de 20 MB.":"";renderCompletionEvidencePreview();if(input)input.value="";
}
function renderCompletionEvidencePreview(){const host=document.getElementById("completionEvidencePreview");if(host)host.innerHTML=(state.pendingCompletionFiles||[]).map((f,i)=>`<span class="media-preview-chip">${escapeHtml(f.name)} <button type="button" onclick="removeCompletionEvidence(${i})" aria-label="Quitar foto">×</button></span>`).join("")+(state.completionSelectionNote?`<p class="small">${escapeHtml(state.completionSelectionNote)}</p>`:"")}
function removeCompletionEvidence(index){if(state.completionBusy)return;state.pendingCompletionFiles.splice(index,1);renderCompletionEvidencePreview()}
async function imageFileToJpeg(file,max=1400){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{let w=img.naturalWidth,h=img.naturalHeight,scale=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);c.toBlob(blob=>{URL.revokeObjectURL(url);blob?resolve(blob):reject(new Error("No pudimos preparar la foto."))},"image/jpeg",.84)}catch(err){URL.revokeObjectURL(url);reject(err)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("No pudimos abrir la foto."))};img.src=url})}
async function uploadTaskMedia(taskId,files,kind="request"){for(const file of files||[]){const blob=await imageFileToJpeg(file),path=`${taskId}/${state.user.id}/${kind}/${crypto.randomUUID()}.jpg`;const {error:up}=await sb.storage.from("task-media").upload(path,blob,{contentType:"image/jpeg",cacheControl:"3600"});if(up)throw up;const {error:row}=await sb.from("task_media").insert({task_id:taskId,uploader_id:state.user.id,kind,storage_path:path});if(row){await sb.storage.from("task-media").remove([path]);throw row}}}
async function loadTaskMedia(taskId){state.taskMedia=[];const {data,error}=await sb.from("task_media").select("id,storage_path,kind,created_at,uploader_id").eq("task_id",taskId).order("created_at",{ascending:true});if(error)return;state.taskMedia=await Promise.all((data||[]).map(async m=>{const {data:u}=await sb.storage.from("task-media").createSignedUrl(m.storage_path,3600);return {...m,url:u?.signedUrl||""}}))}
function openMediaPhoto(url,title="Foto"){document.getElementById("mediaPhotoModal")?.remove();const modal=document.createElement("div");modal.id="mediaPhotoModal";modal.className="media-modal";modal.onclick=e=>{if(e.target===modal)modal.remove()};modal.innerHTML=`<div class="media-modal-card"><div class="media-modal-head"><b>${escapeHtml(title)}</b><button onclick="document.getElementById('mediaPhotoModal')?.remove()">×</button></div><img src="${escapeAttr(url)}" alt="${escapeAttr(title)}"><div class="media-modal-note">Toca fuera de la imagen para cerrar.</div></div>`;document.body.appendChild(modal)}
function taskMediaGallery(kind="request",title="Fotos de la tarea"){const list=(state.taskMedia||[]).filter(m=>m.kind===kind&&m.url);if(!list.length)return "";return `<div class="media-picker"><h3>${escapeHtml(title)}</h3><div class="task-gallery">${list.map(m=>`<button type="button" onclick="openMediaPhoto('${escapeAttr(m.url)}','${escapeAttr(title)}')"><img src="${escapeAttr(m.url)}" alt="${escapeAttr(title)}"></button>`).join("")}</div></div>`}
function timelineHtml(t){if(t.status==="cancelled")return "";let idx=0;if(t.status==="open")idx=0;else if(t.status==="assigned")idx=t.arrived_at?3:(t.en_route_at?2:1);else if(t.status==="in_progress")idx=t.completion_requested_at?5:4;else if(t.status==="completed")idx=6;const labels=["Publicada","Asignada","En camino","Llegó","En curso","Confirmación","Finalizada"];return `<div class="timeline"><div class="timeline-row">${labels.map((x,i)=>`<div class="timeline-step ${i<idx?"done":i===idx?"current":""}">${x}</div>`).join("")}</div></div>`}
function localDateValue(v){if(!v)return "";const d=new Date(v),off=d.getTimezoneOffset()*60000;return new Date(d.getTime()-off).toISOString().slice(0,10)}
function localTimeValue(v){if(!v)return "";const d=new Date(v);return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}


function taskChatClosed(task){return ["completed","cancelled"].includes(task?.status)}
function taskStatusLabel(task){if(task?.status==='assigned'&&task?.arrived_at)return 'El trabajador llegó';if(task?.status==='assigned'&&task?.en_route_at)return 'En camino';if(task?.status==='in_progress'&&task?.completion_requested_at)return 'Esperando confirmación';return statusText(task?.status)}
async function deleteConversation(taskId,fromTask=false){
 if(!confirm("¿Quieres borrar esta conversación definitivamente? Se eliminarán todos los mensajes para ambas personas. La tarea seguirá guardada, pero el chat no se puede recuperar."))return;
 const {error}=await sb.rpc('delete_task_conversation',{p_task_id:taskId});
 if(error){state.error='No pudimos borrar la conversación: '+error.message;render();return}
 if(state.swipeConversationId===taskId)state.swipeConversationId=null;
 if(state.selectedTask?.id===taskId)state.messages=[];
 state.notice="Conversación eliminada definitivamente.";state.error="";
 if(state.selectedTask?.id===taskId&&fromTask){go(state.mode==="worker"?"workerJobs":"clientHome");return}
 if(state.route==="messagesHome"){await openMessagesHome();return}
 render()
}
function starDisplay(value,size=''){const rounded=Math.round(Number(value||0));return `<span class="star-display ${size}">${Array.from({length:5},(_,i)=>`<span class="${i<rounded?'filled':''}">★</span>`).join('')}</span>`}
function ratingButtons(taskId,value){return `<div class="interactive-stars">${Array.from({length:5},(_,i)=>{const n=i+1;return `<button type="button" class="star-btn ${n<=value?'active':''}" onclick="selectTaskRating('${taskId}',${n})" aria-label="Calificar con ${n} estrellas">★</button>`}).join('')}</div>`}
function effectiveWorkerRating(profile){const rating=Number(profile?.rating||0);return Number.isFinite(rating)?Math.max(0,Math.min(5,rating)):0}
async function loadTaskRating(taskId){
 state.currentTaskRating=0;if(!taskId||!state.user)return 0;
 const [{data,error},{data:review}]=await Promise.all([sb.from('task_ratings').select('score').eq('task_id',taskId).maybeSingle(),sb.from('task_reviews').select('comment').eq('task_id',taskId).maybeSingle()]);

 return state.currentTaskRating

async function refreshWorkerProfile(userId){
 if(!userId)return;
 const {data,error}=await sb.from('profiles').select('id,full_name,last_name,avatar_url,bio,phone,rating,completed_tasks,identity_verified,phone_verified,driver_license_verified,created_at').eq('id',userId).maybeSingle();

async function selectTaskRating(taskId,value){
 const score=Math.max(0,Math.min(5,Number(value)||0));
 const {error}=await sb.rpc('rate_task',{p_task_id:taskId,p_score:score});
 if(error){state.error='No pudimos guardar la calificación: '+error.message;render();return}
 state.currentTaskRating=score;
 const wid=state.selectedTask?.worker_id;if(wid)await refreshWorkerProfile(wid);
 if(state.offers?.length&&wid){const o=state.offers.find(x=>x.worker_id===wid||x.status==='accepted');if(o?.profiles&&state.workerProfile)o.profiles=state.workerProfile}
 state.notice=`Calificación guardada: ${score} estrella${score===1?'':'s'}.`;state.error='';render()
}

async function openWorkerProfile(userId,backRoute='taskDetail'){
 if(!userId)return;
 const [{data,error},{data:doneTasks},{data:availability},{data:reputation}]=await Promise.all([
  sb.from('profiles').select('id,full_name,last_name,avatar_url,bio,phone,rating,completed_tasks,identity_verified,phone_verified,driver_license_verified,created_at').eq('id',userId).maybeSingle(),
  sb.rpc('worker_public_stats',{p_worker:userId}),
  sb.from('worker_availability').select('available_until').eq('worker_id',userId).maybeSingle(),
  sb.rpc('worker_reputation_summary',{p_worker:userId})
 ]);state.workerReputation=reputation||null;
 state.viewedWorkerAvailability=availability&&new Date(availability.available_until)>new Date()?availability:null;
 if(error||!data){setMsg('error',error?.message||'No pudimos abrir el perfil del trabajador.');return}
 state.workerProfile=await resolveAvatar(data);
 state.workerCategories=[...new Set((doneTasks||[]).map(t=>baseCategory(t.category)).filter(Boolean))].slice(0,6);

 go('workerProfile')

-center-btn" onclick="shareCurrentTask()"><span class="ico">${iconSvg("tasks")}</span><span><b>Compartir datos de una tarea</b><small>Útil cuando quieras informar a alguien de confianza</small></span><span>›</span></button></div><h2>Consejos de seguridad</h2><div class="safety-tip"><b>Mantén la conversación en DOHOY</b><p>No compartas contraseñas, códigos de acceso ni información bancaria por chat.</p></div><div class="safety-tip"><b>Revisa el perfil</b><p>Comprueba calificaciones y verificaciones antes de elegir o aceptar una tarea.</p></div><div class="safety-tip"><b>Si algo no se siente bien, no continúes</b><p>Cancela la tarea, reporta a la persona o contacta a emergencias si existe un riesgo inmediato.</p></div></section>`,true)}

function workCenterStage(t){

 if(t.status==="completed")return {n:6,title:"Trabajo terminado",copy:"La tarea quedó cerrada. Ya pueden calificarse.",icon:"verify",tone:"done"};

function taskMoreDetailsHtml(t,isOwner){
 const closed=taskChatClosed(t);
 return `<details class="task-more-details"><summary><span>${iconSvg("info")}<b>Detalles de la tarea</b></span><span class="task-more-chevron">⌄</span></summary><div class="task-more-body"><div class="status-banner ${t.status==="open"?"pending":(t.status==="in_progress"&&t.completion_requested_at?"awaiting":"")}"><span class="dot"></span><span>${taskStatusLabel(t)}</span></div>${taskJourneyCard(t,isOwner)}${timelineHtml(t)}${taskQuestionsHtml(t,isOwner)}${t.status==="cancelled"&&t.cancellation_reason?`<div class="policy-note"><b>Motivo de cancelación:</b> ${escapeHtml(t.cancellation_reason)}</div>`:""}${t.worker_id&&otherParticipantId(t)?`<div class="compact-safety-actions"><button onclick="openUserReportSheet('${t.id}')">${iconSvg("flag")} Reportar</button><button onclick="blockOtherUser('${t.id}')">${iconSvg("shield")} Bloquear</button></div>`:""}${closed?`<div class="chat-closed-banner"><span class="left">${iconSvg("chat")}<span>El chat se cerró al finalizar la tarea.</span></span></div>`:""}</div></details>`

async function taskDetail(){
const t=state.selectedTask;if(!t)return go(state.mode==="client"?"clientHome":"workerHome");
const isOwner=t.client_id===state.user.id;
await loadPrivateTaskLocation(t);
await loadTaskMedia(t.id);
await loadTaskQuestions(t.id);
if(isOwner)await loadOffers(t.id);else{await loadMyOffer(t.id);await loadClientProfileData(t.client_id)}
if(t.worker_id&&(t.client_id===state.user.id||t.worker_id===state.user.id))await loadTaskPayment(t.id);else state.currentPayment=null;
if(isOwner&&t.status==="completed")await loadTaskRating(t.id);else state.currentTaskRating=0;
if(!isOwner&&t.worker_id===state.user.id&&t.status==="completed"&&state.clientRatingTaskId!==t.id)await loadClientRating(t.id);else if(t.status!=="completed"){state.clientRatingTaskId=null;state.currentClientRating=0;state.currentClientReview=""}
const assignedOffer=currentWorkerFromOffers(t),selectedProfile=assignedOffer?.profiles||null,closed=taskChatClosed(t);
let body="";
if(!isOwner&&t.status==="open"){const d=taskDistanceKm(t),score=smartMatchScore(t);body+=`<section class="opportunity-intel"><div><span class="match-score big">${score}% compatible contigo</span>${opportunityTags(t)}</div><div class="opportunity-intel-grid"><span><small>Pago</small><b>${money(t.offered_price)}</b></span><span><small>Distancia</small><b>${d!=null?distanceLabel(d):"Por calcular"}</b></span><span><small>Cuándo</small><b>${t.scheduled_for?timeText(t.scheduled_for):"Flexible"}</b></span></div></section>`}
if(!isOwner&&state.clientProfile){
 const cp=state.clientProfile;
 body+=`<div class="task-section-title"><div><h2>Cliente</h2><div class="sub">Información básica y reputación real.</div></div></div><div class="client-profile-card">${workerPhotoTrigger(cp)}<div><h3>${escapeHtml(profileDisplayName(cp))}</h3><p>${prettyRating(cp.client_rating)} ★ · ${Number(cp.client_completed_tasks||0)} tareas completadas</p></div><button onclick="openClientProfile('${cp.id}','taskDetail')">Ver perfil</button></div>`;
}
if(isOwner&&t.worker_id&&selectedProfile){
 const savedRating=state.currentTaskRating||0;
 body+=paymentActionHtml(t,assignedOffer);
 body+=`<div class="task-section-title"><div><h2>Trabajador seleccionado</h2><div class="sub">Foto, experiencia y calificación real.</div></div></div><div class="selected-worker-card"><div class="selected-worker-head">${avatarMarkup(selectedProfile)}${workerSummaryHtml(selectedProfile)}<div class="worker-price">${money(assignedOffer?.amount||t.offered_price)}</div></div><div class="worker-card-actions"><button class="secondary-soft" onclick="openWorkerProfile('${selectedProfile.id||t.worker_id}','taskDetail')">Ver perfil</button>${t.status==="completed"?`<button class="accent-soft" onclick="openWorkerProfile('${selectedProfile.id||t.worker_id}','taskDetail')">Calificar</button>`:`<button class="accent-soft" onclick="openChat('${t.id}')">Chat</button>`}</div></div>`;

 if(t.status==="in_progress"&&!t.completion_requested_at)body+=`<div class="completion-card"><h3>Tarea en curso</h3><p>Cuando el trabajador indique que terminó, podrás revisar su evidencia antes de confirmar.</p></div>`;
 if(t.status==="in_progress"&&t.completion_requested_at)body+=`<div class="completion-card"><h3>El trabajador indicó que terminó</h3><p>Revisa la evidencia antes de confirmar.</p>${taskMediaGallery("completion","Evidencia de finalización")}<div class="completion-actions"><button class="btn orange" onclick="confirmTaskCompletion('${t.id}')">Confirmar</button><button class="danger-outline" onclick="openCompletionProblemSheet('${t.id}')">Reportar problema</button></div></div>`;
 if(t.status==="completed")body+=`${taskMediaGallery("completion","Evidencia de finalización")}${ratingEditorHtml(t.id,savedRating)}`;
}
if(isOwner&&t.status==="open"){
 body+=`<div class="task-section-title"><div><h2>Ofertas recibidas</h2><div class="sub">Acepta una propuesta o negocia un monto distinto.</div></div></div>`;
 body+=state.offers.length?`<div class="cards">${state.offers.map(o=>{const p=o.profiles||{};return `<div class="offer-person-card"><div class="offer-person-head">${avatarMarkup(p)}${workerSummaryHtml(p,{offer:true})}<div class="worker-price">${money(o.amount)}</div></div>${o.message?`<div class="offer-message">${escapeHtml(o.message)}</div>`:""}${o.counter_status==="pending"?`<div class="counter-card"><b>Contraoferta enviada: ${money(o.counter_amount)}</b><p>${escapeHtml(o.counter_message||"Esperando respuesta del trabajador.")}</p></div>`:""}<div class="offer-action-row"><button class="secondary-soft" onclick="openWorkerProfile('${o.worker_id}','taskDetail')">Ver perfil</button><button class="secondary-soft" onclick="openCounterOfferSheet('${o.id}',${Number(o.amount)})">Contraoferta</button><button class="accent-soft" onclick="acceptOffer('${o.id}','${o.worker_id}')">Elegir</button></div></div>`}).join("")}</div>`:`<div class="simple-empty">Aún no hay ofertas.</div>`;
}else if(!isOwner){
 const my=state.offers[0];
 if(t.status==="open"){
   if(my)body+=`<div class="ok">Ya ofreciste ${money(my.amount)}. Estado: ${escapeHtml(my.status)}.</div>${my.counter_status==="pending"?`<div class="counter-card"><b>El cliente propone ${money(my.counter_amount)}</b><p>${escapeHtml(my.counter_message||"Puedes aceptar o rechazar esta contraoferta.")}</p><div class="counter-actions"><button class="btn orange" onclick="respondCounterOffer('${my.id}',true)">Aceptar</button><button class="danger-outline" onclick="respondCounterOffer('${my.id}',false)">Rechazar</button></div></div>`:""}`;
   else body+=`<div class="rating-card"><h3>Haz una oferta</h3><p>Preséntate y envía tu propuesta.</p><form id="offerForm"><div class="field"><label>Tu precio</label><input class="input" name="amount" type="number" min="1" value="${Number(t.offered_price)}" required></div><div class="field"><label>Mensaje</label><textarea name="message" placeholder="Ej. Puedo hacerlo hoy por la tarde"></textarea></div><button class="btn primary">Enviar oferta</button></form></div>`;
 }else if(t.worker_id===state.user.id){
   body+=taskProgressButtons(t);
   if(t.status==="completed")body+=taskMediaGallery("completion","Evidencia de finalización")+clientRatingEditorHtml(t.id);
 }else body+=`<div class="simple-empty">Esta tarea ya no está disponible.</div>`;
}
if((t.client_id===state.user.id||t.worker_id===state.user.id)&&t.worker_id&&closed)body+=`<div class="task-mini-actions"><button class="task-inline-delete" onclick="deleteConversation('${t.id}',true)">${iconSvg("trash")} Borrar conversación</button></div>`;
const statusCls=t.status==="open"?"pending":(t.status==="in_progress"&&t.completion_requested_at?"awaiting":"");
const assignedCompact=!!t.worker_id&&!["open","cancelled"].includes(t.status);
root.innerHTML=shell(`<section class="screen"><div class="detail-shell"><div class="detail-topline"><button class="icon" onclick="go('${state.taskBackRoute||(isOwner?"clientHome":"workerHome")}')">←</button><span class="detail-category-pill">${taskIcon(t)} ${escapeHtml(baseCategory(t.category))}</span><span></span></div>${authMsg()}<div class="detail-card detail-card-compact"><div class="detail-icon-box">${taskIcon(t)}</div><div class="detail-money">${money(t.offered_price)}</div><h1 class="detail-title">${escapeHtml(t.title)}</h1><p class="detail-copy">${escapeHtml(t.description)}</p><span class="detail-location">${iconSvg("location")}<span>${(!isOwner&&t.status==="open")?"Ubicación aproximada":escapeHtml(t.location_label||"Sin ubicación")}${!isOwner&&taskDistanceKm(t)!=null?` · ${distanceLabel(taskDistanceKm(t))} de ti`:""}</span></span>${taskMediaGallery("request","Fotos de la tarea")}</div>${taskLocationCard(t)}${workCenterHtml(t,isOwner)}${assignedCompact?"":`<div class="status-banner ${statusCls}"><span class="dot"></span><span>${taskStatusLabel(t)}</span></div>${taskJourneyCard(t,isOwner)}${timelineHtml(t)}${taskQuestionsHtml(t,isOwner)}`}${isOwner&&t.status==="open"&&!t.worker_id?`<button class="edit-task-btn" onclick="go('editTask')">Editar tarea</button>`:""}${!assignedCompact&&t.status==="cancelled"&&t.cancellation_reason?`<div class="policy-note"><b>Motivo de cancelación:</b> ${escapeHtml(t.cancellation_reason)}</div>`:""}${!assignedCompact&&(t.client_id===state.user.id||t.worker_id===state.user.id)&&t.worker_id&&!closed?`<button class="chat-cta-btn" onclick="openChat('${t.id}')"><span class="left">${iconSvg("chat")}<span>Abrir chat</span></span><span>›</span></button>`:""}${body}${assignedCompact?taskMoreDetailsHtml(t,isOwner):""}${participantCanCancel(t)?`<button class="cancel-task-btn compact-cancel" onclick="openCancelTaskSheet('${t.id}')">Cancelar tarea</button>`:""}${!assignedCompact&&t.worker_id&&otherParticipantId(t)?`<div class="safety-card"><h3>Seguridad</h3><p>Reporta conductas inapropiadas o bloquea a la otra persona si es necesario.</p><div class="safety-actions"><button class="safety-btn" onclick="openUserReportSheet('${t.id}')">${iconSvg("flag")} Reportar</button><button class="safety-btn danger" onclick="blockOtherUser('${t.id}')">${iconSvg("shield")} Bloquear</button></div></div>`:""}</div></section>`,true);renderCompletionEvidencePreview()
}


function taskJourneyCard(t,isOwner){
 if(!t.worker_id||t.status==="open"||t.status==="cancelled")return "";
 const paid=state.currentPayment?.payment_status==="paid";
 let step=1,label="Acuerdo confirmado",copy=isOwner?"Realiza el pago para asegurar el trabajo.":"El cliente debe completar el pago.";
 if(paid){step=2;label="Pago confirmado";copy=isOwner?"El trabajador ya puede coordinar su llegada.":"Coordina tu llegada con el cliente."}
 if(t.en_route_at){step=3;label="En camino";copy="El trabajador se dirige a la ubicación acordada."}
 if(t.arrived_at){step=4;label=t.status==="in_progress"?"Trabajo en curso":"Trabajador en la ubicación";copy=t.status==="in_progress"?"La tarea ya comenzó.":"Ya pueden comenzar cuando estén listos."}
 if(t.completion_requested_at){step=5;label="Esperando confirmación";copy=isOwner?"Revisa la evidencia y confirma si quedó terminado.":"El cliente está revisando la finalización."}
 if(t.status==="completed"){step=6;label="Trabajo finalizado";copy="La tarea quedó cerrada. Ya pueden calificarse."}
 const pct=Math.max(8,Math.min(100,((step-1)/5)*100));
 return `<section class="journey-card"><div class="journey-head"><span>${iconSvg("route")}</span><div><small>PASO ${step} DE 6</small><h3>${escapeHtml(label)}</h3><p>${escapeHtml(copy)}</p></div></div><div class="journey-track"><i style="width:${pct}%"></i></div><div class="journey-labels"><span>Acuerdo</span><span>Pago</span><span>Llegada</span><span>Trabajo</span><span>Confirmar</span><span>Listo</span></div></section>`
}

function agreedTaskAmount(t,offer){
 if(!offer)return Number(t?.offered_price||0);
 if(offer.counter_status==="accepted"&&offer.counter_amount!=null)return Number(offer.counter_amount);
 return Number(offer.amount||t?.offered_price||0)
}
async function loadTaskPayment(taskId){
 const {data,error}=await sb.from("task_payments").select("id,task_id,amount_total,commission_amount,worker_net_amount,payment_status,stripe_checkout_session_id,paid_at").eq("task_id",taskId).order("created_at",{ascending:false}).limit(1);
 state.currentPayment=error?null:(data?.[0]||null)
}
function paymentActionHtml(t,offer){
 if(t.client_id!==state.user?.id||!t.worker_id||!["assigned","in_progress"].includes(t.status))return "";
 const pay=state.currentPayment,amount=agreedTaskAmount(t,offer);
 const total=Number(pay?.amount_total||amount||0),commission=Number(pay?.commission_amount??(total*.15)),workerNet=Number(pay?.worker_net_amount??(total-commission));
 if(pay?.payment_status==="paid")return `<div class="payment-paid-v2"><div class="payment-paid-head"><span>${iconSvg("verify")}</span><div><small>PAGO CONFIRMADO</small><b>${money(total)} asociados a esta tarea</b><p>El trabajador ya puede comenzar.</p></div></div><div class="payment-split-preview"><span><small>Cálculo trabajador · 85%</small><b>${money(workerNet)}</b></span><span><small>Comisión DOHOY · 15%</small><b>${money(commission)}</b></span></div></div>`;
 return `<div class="payment-card payment-required-card"><div class="payment-required-head"><span>${iconSvg("shield")}</span><div><small>PAGO REQUERIDO</small><h3>Confirma el trabajo con el pago</h3><p>El trabajador no podrá ir en camino ni comenzar hasta que Stripe confirme el pago.</p></div></div><div class="payment-summary"><div><span>Total acordado</span><b>${money(total)}</b></div><div><span>Cálculo trabajador · 85%</span><b>${money(workerNet)}</b></div><div><span>Comisión DOHOY · 15%</span><b>${money(commission)}</b></div></div><button id="payTaskButton" class="payment-cta" onclick="startTaskCheckout('${t.id}')">${pay?.payment_status==="processing"?"CONTINUAR PAGO":"PAGAR Y CONFIRMAR"}</button><div id="checkoutInlineError" class="checkout-inline-error" hidden></div><div class="payment-secure">${iconSvg("shield")} Pago procesado por Stripe · el trabajo se habilita al confirmarse</div></div>`
}
async function startTaskCheckout(taskId){
 if(state.checkoutBusy)return;
 state.checkoutBusy=true;state.error="";
 const btn=document.getElementById("payTaskButton");
 if(btn){btn.disabled=true;btn.textContent="ABRIENDO STRIPE…";btn.classList.add("is-loading")}
 trackEvent('checkout_started',{},taskId).catch(()=>{});
 try{
   const back=new URL(REDIRECT_URL);back.searchParams.set("task",taskId);
   const {data,error}=await sb.functions.invoke("dohoy-create-checkout",{body:{task_id:taskId,return_url:back.toString()}});
   if(error){
     let detail=error.message||"No se pudo iniciar el pago.";
     try{const payload=await error.context?.json?.();if(payload?.error)detail=payload.error;if(payload?.detail)detail+=" · "+payload.detail}catch{}
     throw Error(detail)
   }
   if(!data?.checkout_url)throw Error(data?.error||"Stripe no devolvió una liga de pago.");
   window.location.href=data.checkout_url;
 }catch(err){
   state.checkoutBusy=false;
   state.error="No pudimos abrir Stripe: "+String(err?.message||err).replaceAll("_"," ");
   const live=document.getElementById("checkoutInlineError");
   if(live){live.textContent=state.error;live.hidden=false}
   if(btn){btn.disabled=false;btn.textContent="REINTENTAR PAGO";btn.classList.remove("is-loading")}
 }
}
function taskProgressButtons(t){
 const paid=state.currentPayment?.payment_status==="paid";
 if(t.status==="assigned"&&!paid)return `<div class="completion-card payment-lock-card"><span>${iconSvg("payment")}</span><div><h3>Esperando pago</h3><p>El cliente ya te eligió. En cuanto Stripe confirme el pago se habilitarán “Voy en camino”, “Llegué” y “Comenzar tarea”.</p></div></div>`;
 if(t.status==="assigned"){
   if(!t.en_route_at)return `<div class="completion-card"><h3>Pago confirmado · listo para salir</h3><p>Avisa al cliente cuando vayas en camino.</p><button class="btn primary" onclick="markTaskEnRoute('${t.id}')">Voy en camino</button></div>`;
   if(!t.arrived_at)return `<div class="completion-card"><h3>Vas en camino</h3><p>Cuando llegues, avisa al cliente desde aquí.</p><button class="btn orange" onclick="markTaskArrived('${t.id}')">Llegué</button></div>`;
   return `<div class="completion-card"><h3>Ya llegaste</h3><p>El pago está confirmado. Ya puedes comenzar la tarea.</p><button class="btn orange" onclick="startTask('${t.id}')">Comenzar tarea</button></div>`;
 }
 if(t.status==="in_progress"&&!t.completion_requested_at)return `<div class="completion-proof"><h3>Evidencia de finalización</h3><p>Puedes subir hasta 3 fotos antes de avisar que terminaste.</p><input id="completionEvidenceInput" class="media-input" type="file" accept="image/*" multiple onchange="selectCompletionEvidence(event)"><button class="media-add-btn" type="button" onclick="document.getElementById('completionEvidenceInput').click()">${iconSvg("camera")} Agregar fotos</button><div id="completionEvidencePreview" class="media-preview-list"></div>${taskMediaGallery("completion","Evidencia cargada")}<button id="completionSubmit" class="btn orange" onclick="requestTaskCompletion('${t.id}')">Terminé la tarea</button></div>`;
 if(t.status==="in_progress"&&t.completion_requested_at)return `<div class="completion-card"><h3>Esperando confirmación</h3><p>Ya avisaste que terminaste. El cliente puede revisar la evidencia y confirmar.</p>${taskMediaGallery("completion","Evidencia enviada")}</div>`;
 return `<div class="ok">Trabajo ${statusText(t.status).toLowerCase()}.</div>`
}
function openCounterOfferSheet(offerId,amount){openProfileSheet("Enviar contraoferta","Propón un monto diferente al trabajador.",`<form class="profile-inline-form" onsubmit="submitCounterOffer(event,'${offerId}')"><label>Nuevo monto</label><input name="amount" type="number" min="1" value="${Number(amount||0)}" required><label>Mensaje</label><textarea name="message" maxlength="300" placeholder="Ej. ¿Podrías hacerlo por este monto?"></textarea><button class="btn primary">Enviar contraoferta</button></form>`)}
async function submitCounterOffer(e,offerId){e.preventDefault();const f=new FormData(e.target),{error}=await sb.rpc("counter_task_offer",{p_offer_id:offerId,p_amount:Number(f.get("amount")),p_message:f.get("message")||null});closeProfileSheet();if(error)return setMsg("error",error.message);await loadOffers(state.selectedTask.id);state.notice="Contraoferta enviada.";render()}
async function respondCounterOffer(offerId,accept){const {data,error}=await sb.rpc("respond_counter_offer",{p_offer_id:offerId,p_accept:!!accept});if(error)return setMsg("error",error.message);state.selectedTask=Array.isArray(data)?data[0]:data;await loadMyOffer(state.selectedTask.id);if(accept)state.workerTaskTab="active";state.notice=accept?"Contraoferta aceptada. La tarea quedó en Mis tareas > Activos.":"Contraoferta rechazada.";render()}
async function markTaskEnRoute(id){return runOnce("route:"+id,async()=>{const {data,error}=await sb.rpc("mark_task_en_route",{p_task_id:id});if(error)return setMsg("error",error.message);state.selectedTask=Array.isArray(data)?data[0]:data;state.notice="Avisamos al cliente que vas en camino.";render();setTimeout(()=>showSuccessMoment('¡Vas en camino!','El cliente ya recibió el cambio de estado.'),100)})}
async function markTaskArrived(id){return runOnce("arrived:"+id,async()=>{const {data,error}=await sb.rpc("mark_task_arrived",{p_task_id:id});if(error)return setMsg("error",error.message);state.selectedTask=Array.isArray(data)?data[0]:data;state.notice="Avisamos al cliente que llegaste.";render();setTimeout(()=>showSuccessMoment('Llegada registrada','Ya pueden comenzar cuando estén listos.','orange'),100)})}

id-template-columns:42px 1fr"><div class="pc-icon">$</div><div><label>Presupuesto</label><input name="price" type="number" min="1" value="${Number(t.offered_price)}" required></div></div></div><div class="publish-two"><div class="publish-card" style="grid-template-columns:42px 1fr"><div class="pc-icon">${iconSvg("calendar")}</div><div><label>Fecha</label><input name="task_date" type="date" value="${localDateValue(t.scheduled_for)}"></div></div><div class="publish-card" style="grid-template-columns:42px 1fr"><div class="pc-icon">${iconSvg("clock")}</div><div><label>Hora</label><input name="task_time" type="time" value="${localTimeValue(t.scheduled_for)}"></div></div></div><label class="card" style="display:flex;gap:10px;align-items:center;margin:10px 0"><input name="license" type="checkbox" ${t.requires_driver_license?"checked":""}> Requiere licencia de conducir</label><div class="media-picker"><h3>Agregar más fotos</h3><p>${state.pendingTaskPhotoLimit?`Puedes agregar hasta ${state.pendingTaskPhotoLimit} fotos nuevas (máximo 5 por tarea).`:"Esta tarea ya tiene las 5 fotos permitidas."}</p><input id="taskPhotosInput" class="media-input" type="file" accept="image/*" multiple onchange="selectTaskPhotos(event)"><button type="button" class="media-add-btn" onclick="document.getElementById('taskPhotosInput').click()">${iconSvg("camera")} Agregar fotos</button><div id="taskPhotoPreview" class="media-preview-list"></div></div><button class="publish-submit">Guardar cambios</button></form></section>`,true);bindForms()}

async function openEarnings(){
 if(state.mode!=="worker"){state.notice="Cambia a modo Trabajador para consultar tus ganancias.";go("profile");return}
 state.route="earnings";state.earningsLoading=true;render();
 const {data,error}=await sb.from("task_payments").select("id,task_id,amount_total,commission_amount,worker_net_amount,payment_status,paid_at,created_at").eq("worker_id",state.user.id).order("created_at",{ascending:false}).limit(100);
 state.earningsPayments=error?[]:(data||[]);
 state.earningsTasks={};
 const ids=[...new Set(state.earningsPayments.map(p=>p.task_id).filter(Boolean))];
 if(ids.length){const {data:tasks}=await sb.from("tasks").select("id,title,category,status,completed_at").in("id",ids);for(const t of tasks||[])state.earningsTasks[t.id]=t}
 state.earningsLoading=false;render()
}

function profileDisplayName(p){
 const first=String(p?.full_name||"").trim(),last=String(p?.last_name||"").trim();
 if(!first&&!last)return "Usuario DOHOY";
 if(!last)return first;
 if(first.toLocaleLowerCase("es-MX").endsWith(last.toLocaleLowerCase("es-MX")))return first;
 return `${first} ${last}`.trim()
}

async function ensurePrivateProfile(values={}){
 const payload={user_id:state.user.id,...values,updated_at:new Date().toISOString()};
 const {data,error}=await sb.from('profile_private').upsert(payload,{onConflict:'user_id'}).select('user_id,document_type,identification_number,birth_date,social_networks,updated_at').single();
 if(error)throw error;state.privateProfile=data||{};return data
}
async function saveProfileField(event,type){
 event.preventDefault();const form=event.target;const btn=form.querySelector('button[type=submit],button');const original=btn?.textContent;const v=(new FormData(form).get('value')||'').trim();
 if(btn){btn.disabled=true;btn.textContent='Guardando…'}
 try{
  if(type==='name'||type==='last_name'||type==='phone'){
    const field=type==='name'?'full_name':type;
    const {error}=await sb.from('profiles').update({[field]:v||null}).eq('id',state.user.id);
    if(error)throw error;
    if(type==='name'){
      const {data:authData,error:authError}=await sb.auth.updateUser({data:{full_name:v}});
      if(authError)throw authError;if(authData?.user)state.user=authData.user
    }
    await loadProfile();
    const saved=String(state.profile?.[field]||'').trim();
    if(saved!==v)throw new Error('El servidor no confirmó el dato guardado. Intenta nuevamente.')
  } else if(type==='document_type'||type==='identification_number'||type==='birth_date'){
    await ensurePrivateProfile({[type]:v||null})
  } else if(type==='password'){
    const {error}=await sb.auth.updateUser({password:v});if(error)throw error
  } else if(type==='email'){
    const {data,error}=await sb.auth.updateUser({email:v});if(error)throw error;if(data?.user)state.user=data.user;state.notice='Revisa tu correo para confirmar el cambio si DOHOY te lo solicita.'
  }
  closeProfileSheet();state.error='';state.notice='Información guardada correctamente.';render()
 }catch(err){if(btn){btn.disabled=false;btn.textContent=original||'Guardar'}closeProfileSheet();state.error='No pudimos guardar el cambio: '+(err.message||err);render()}
}
async function saveSocialNetworks(event){event.preventDefault();const f=new FormData(event.target);const social_networks={instagram:(f.get('instagram')||'').trim(),facebook:(f.get('facebook')||'').trim(),tiktok:(f.get('tiktok')||'').trim()};try{await ensurePrivateProfile({social_networks});closeProfileSheet();state.error='';state.notice='Redes sociales actualizadas.';render()}catch(err){closeProfileSheet();state.error='No pudimos guardar tus redes: '+(err.message||err);render()}}

async function saveCurrentAddress(btn){
 if(!navigator.geolocation){return alert("Tu navegador no permite acceder a la ubicación.")}
 const old=btn.innerHTML;btn.disabled=true;btn.textContent="Buscando ubicación…";
 navigator.geolocation.getCurrentPosition(async pos=>{
   const address=await reverseGeocode(pos.coords.latitude,pos.coords.longitude);
   localStorage.setItem("dohoy_saved_address",address);
   localStorage.setItem("dohoy_saved_lat",String(pos.coords.latitude));
   localStorage.setItem("dohoy_saved_lon",String(pos.coords.longitude));
   btn.disabled=false;go("addresses")
 },err=>{btn.disabled=false;btn.innerHTML=old;alert(err.code===1?"Necesitamos permiso de ubicación para guardar tu dirección.":"No pudimos obtener tu ubicación.")},{enableHighAccuracy:true,maximumAge:0,timeout:12000})
}
async function loadSavedCards(){
 if(!state.session?.access_token)return;
 state.paymentMethodsBusy=true;
 try{
  const res=await fetch(SUPABASE_URL+"/functions/v1/dohoy-payment-methods",{method:"GET",headers:{Authorization:"Bearer "+state.session.access_token,apikey:SUPABASE_KEY}});
  const data=await res.json();
  if(!res.ok)throw new Error(data?.error||"No pudimos cargar tus tarjetas.");
  state.savedCards=data.cards||[];
 }catch(e){state.error=e.message||"No pudimos cargar tus métodos de pago.";state.savedCards=[]}
 state.paymentMethodsBusy=false;if(state.route==='payments')render()
}
async function addPaymentMethod(){
 if(state.paymentMethodsBusy||!state.session?.access_token)return;
 state.paymentMethodsBusy=true;state.error='';render();
 try{
  const res=await fetch(SUPABASE_URL+"/functions/v1/dohoy-payment-methods",{method:"POST",headers:{Authorization:"Bearer "+state.session.access_token,apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({return_url:REDIRECT_URL})});
  const data=await res.json();
  if(!res.ok||!data.checkout_url)throw new Error(data?.error||"No pudimos abrir Stripe.");
  window.location.href=data.checkout_url;
 }catch(e){state.paymentMethodsBusy=false;state.error=e.message||"No pudimos abrir Stripe.";render()}
}

function bindConversationSwipes(){

  let startX=0,startY=0,lastX=0,dragging=false,base=0;
  row.addEventListener('touchstart',e=>{if(!e.touches?.length)return;const t=e.touches[0];startX=lastX=t.clientX;startY=t.clientY;dragging=false;base=row.classList.contains('is-open')?-92:0;closeAllConversationSwipes(row.dataset.taskId)}, {passive:true});
  row.addEventListener('touchmove',e=>{if(!e.touches?.length)return;const t=e.touches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(!dragging&&Math.abs(dx)<8&&Math.abs(dy)<8)return;if(!dragging&&Math.abs(dy)>Math.abs(dx))return;dragging=true;row.classList.add('is-dragging');e.preventDefault();lastX=t.clientX;const x=Math.max(-92,Math.min(0,base+dx));content.style.transform=`translateX(${x}px)`}, {passive:false});

  row.addEventListener('touchcancel',()=>{row.classList.remove('is-dragging');content.style.transform='';content.style.transition=''});
 });
}

function taskIsToday(t){const now=new Date(),d=new Date(t.scheduled_for||t.created_at||Date.now());return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d.getDate()===now.getDate()}

function filteredWorkerTasks(tasks=state.tasks,filters=workerFilterState()){

 return sortTasksByDistance((tasks||[]).filter(t=>{
  if(q&&!fold(`${t.title||''} ${t.description||''} ${baseCategory(t.category)}`).includes(q))return false;
  if(filters.category&&baseCategory(t.category)!==filters.category)return false;
  if(Number(t.offered_price)<Number(filters.minPrice||0))return false;
  if(filters.todayOnly&&!taskIsToday(t))return false;
  if(filters.vehicleOnly&&!(baseCategory(t.category)==='Vehículo'||t.requires_driver_license))return false;
  const distance=distanceForFilter(t);if(filters.maxDistance!=null&&(distance==null||distance>Number(filters.maxDistance)))return false;
  return true;
 }))
}

function urlBase64Bytes(value){const s=atob(value.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-value.length%4)%4));return Uint8Array.from(s,c=>c.charCodeAt(0))}
async function saveDevicePushSubscription(subscription){const j=subscription.toJSON();j.preferences={messages:notificationPref('messages'),offers:notificationPref('offers'),tasks:notificationPref('tasks'),matching:notificationPref('matching')};const {error}=await sb.from('push_subscriptions').upsert({user_id:state.user.id,endpoint:j.endpoint,subscription:j,updated_at:new Date().toISOString()},{onConflict:'endpoint'});if(error)throw error}
async function enablePushNotifications(){
 if(!state.user)return;if(!state.pushBackendReady)return setMsg('error','La activación de notificaciones en el servidor está pendiente.');
 if(isIOS()&&!installedOnHomeScreen())return setMsg('error','En iPhone, agrega DOHOY a tu pantalla de inicio y ábrelo desde ese icono antes de activar notificaciones.');
 if(!pushSupported())return setMsg('error','Este navegador no admite notificaciones push. Usa una app web instalada en un navegador compatible.');
 try{const permission=await Notification.requestPermission();if(permission!=='granted')throw Error('No concediste permiso. Puedes cambiarlo en los ajustes del teléfono.');const reg=await ensurePushWorker();let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64Bytes(state.pushServerKey||DOHOY_VAPID_PUBLIC)});try{await saveDevicePushSubscription(sub)}catch(err){await sub.unsubscribe();throw err}state.pushEnabled=true;state.notice=state.pushDeliveryReady?'Notificaciones activadas en este dispositivo.':'Dispositivo registrado. El envío push del servidor está pendiente de activación.';state.error='';render()}catch(err){setMsg('error','No pudimos activar las notificaciones: '+err.message)}
}
async function disablePushNotifications(silent=false){try{const reg=pushRegistration||await navigator.serviceWorker?.getRegistration('./');const sub=await reg?.pushManager.getSubscription();if(sub){const {error}=await sb.from('push_subscriptions').delete().eq('user_id',state.user.id).eq('endpoint',sub.endpoint);await sub.unsubscribe();if(error&&!silent)throw error}state.pushEnabled=false;if(!silent){state.notice='Notificaciones desactivadas en este dispositivo.';render()}}catch(err){if(!silent)setMsg('error',err.message)}}
async function syncPushPreferences(){if(!state.pushBackendReady||!pushSupported())return;try{const reg=await navigator.serviceWorker.getRegistration('./'),sub=await reg?.pushManager.getSubscription();if(sub)await saveDevicePushSubscription(sub)}catch(err){setMsg('error','No pudimos actualizar los avisos del teléfono: '+err.message)}}
async function refreshPushStatus(){state.pushEnabled=false;if(pushSupported()){const reg=await navigator.serviceWorker.getRegistration('./');const sub=await reg?.pushManager.getSubscription();if(sub&&state.pushBackendReady){try{await saveDevicePushSubscription(sub);state.pushEnabled=true}catch{state.pushEnabled=false}}}}

function normalizeSupportTicket(t){return {...t,subject:t.reason,description:t.details,reporter_id:t.user_id,staff_response:t.response}}

function draftDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('dohoy-support-drafts',1);req.onupgradeneeded=()=>req.result.createObjectStore('drafts',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}

async function openSupportCenter(){state.supportBackRoute=null;if(!state.user)return;await loadFeatureStatus();state.supportCases=[];state.supportDrafts=[];const {data:tasks,error}=await sb.from('tasks').select('id,title,status,client_id,worker_id').or(`client_id.eq.${state.user.id},worker_id.eq.${state.user.id}`).order('updated_at',{ascending:false}).limit(100);state.supportTasks=tasks||[];if(error)return setMsg('error','No pudimos cargar tus tareas: '+error.message);if(state.supportBackendReady){const {data,error:casesError}=await sb.from('support_tickets').select('*').order('updated_at',{ascending:false}).limit(50);if(casesError)return setMsg('error',casesError.message);state.supportCases=(data||[]).map(normalizeSupportTicket)}try{state.supportDrafts=(await supportDraftAction('getAll')).filter(d=>d.user_id===state.user.id)}catch{}go('supportCenter')}
function supportCenterScreen(){return shell(`<section class="settings-page">${settingsHeader('Soporte y disputas')}${authMsg()}<div class="safety-hero"><h1>Cuéntanos qué pasó.</h1><p>Selecciona una tarea, explica el problema y adjunta hasta 5 fotos.</p></div>${!state.supportBackendReady?`<div class="policy-note">No pudimos conectar con soporte. Puedes guardar un borrador con sus fotos en este dispositivo e intentarlo después.</div>`:''}<button class="btn orange" style="margin:16px 0" onclick="newSupportCase()">${state.supportBackendReady?'Abrir caso':'Preparar un caso'}</button><h2>Mis casos</h2>${(state.supportCases||[]).length?state.supportCases.map(c=>`<button class="support-case-row" onclick="openSupportCase('${c.id}')"><b>${escapeHtml(c.subject)}</b><span>${supportStatusLabel(c.status)}</span><small>${new Date(c.created_at).toLocaleDateString('es-MX')}</small></button>`).join(''):`<p class="small">Todavía no hay casos enviados.</p>`}${(state.supportDrafts||[]).length?`<h2>Borradores de este dispositivo</h2>${state.supportDrafts.map(d=>`<button class="support-case-row" onclick="editSupportDraft('${d.id}')"><b>${escapeHtml(d.subject)}</b><span>Borrador sin enviar</span><small>${(d.files||[]).length} fotos</small></button>`).join('')}`:''}</section>`,true)}

function selectSupportFiles(event){state.pendingSupportFiles=state.pendingSupportFiles||[];for(const file of Array.from(event.target.files||[])){if(state.pendingSupportFiles.length>=5)break;if(!file.type.startsWith('image/')||file.size>20*1024*1024)continue;if(!state.pendingSupportFiles.some(f=>f.name===file.name&&f.size===file.size))state.pendingSupportFiles.push(file)}event.target.value='';renderSupportPreview()}

function newSupportCaseScreen(){const f=state.supportForm||{};return shell(`<section class="settings-page">${settingsHeader('Nuevo caso')}${authMsg()}<form id="supportCaseForm" class="support-form" onsubmit="submitSupportCase(event)"><label>Tarea<select name="task_id" required><option value="">Selecciona una tarea</option>${(state.supportTasks||[]).map(t=>`<option value="${t.id}" ${t.id===f.task_id?'selected':''}>${escapeHtml(t.title)} · ${statusText(t.status)}</option>`).join('')}</select></label><label>Motivo<input name="subject" minlength="3" maxlength="100" required value="${escapeAttr(f.subject||'')}" placeholder="Ej. El trabajo no quedó terminado"></label><label>Describe lo ocurrido<textarea name="description" minlength="10" maxlength="2000" required placeholder="Explica qué acordaron y qué pasó">${escapeHtml(f.description||'')}</textarea></label><div class="media-picker"><h3>Evidencia</h3><p>Hasta 5 imágenes, de menos de 20 MB cada una.</p><input id="supportFilesInput" class="media-input" type="file" accept="image/*" multiple onchange="selectSupportFiles(event)"><button class="media-add-btn" type="button" onclick="document.getElementById('supportFilesInput').click()">${iconSvg('camera')} Agregar fotos</button><div id="supportPhotoPreview" class="media-preview-list"></div></div><button class="btn orange" id="supportSubmit">${state.supportBackendReady?'Enviar a soporte':'Guardar borrador en este dispositivo'}</button><p class="small">${state.supportBackendReady?'Puedes consultar el estado y las respuestas en Mis casos.':'Un borrador no se envía al equipo de soporte.'}</p></form></section>`,true)}

async function submitSupportCase(event){event.preventDefault();if(state.supportSending)return;const f=new FormData(event.target),form={task_id:f.get('task_id'),subject:String(f.get('subject')).trim(),description:String(f.get('description')).trim()};state.supportForm=form;state.supportSending=true;const btn=document.getElementById('supportSubmit');if(btn){btn.disabled=true;btn.textContent='Guardando…'}
 try{if(!state.supportBackendReady){await supportDraftAction('put',{...form,id:state.supportDraftId||crypto.randomUUID(),user_id:state.user.id,status:'draft',files:state.pendingSupportFiles||[],created_at:new Date().toISOString()});await openSupportCenter();state.notice='Borrador guardado en este dispositivo. Todavía no se envió a soporte.';render();return}
  let c=state.supportPendingCase;if(!c||(c.task_id||'')!==form.task_id||c.subject!==form.subject||c.description!==form.description){const {data,error}=await sb.from('support_tickets').insert({user_id:state.user.id,task_id:form.task_id||null,reason:form.subject,details:form.description}).select('*').single();if(error)throw error;c=normalizeSupportTicket(Array.isArray(data)?data[0]:data);state.supportPendingCase=c}
  while(state.pendingSupportFiles?.length){const blob=await imageFileToJpeg(state.pendingSupportFiles[0]),path=`${state.user.id}/${c.id}/${crypto.randomUUID()}.jpg`;const {error:upload}=await sb.storage.from('support-evidence').upload(path,blob,{contentType:'image/jpeg',upsert:false});if(upload)throw upload;const {error:add}=await sb.from('support_evidence').insert({ticket_id:c.id,user_id:state.user.id,storage_path:path});if(add){await sb.storage.from('support-evidence').remove([path]);throw add}state.pendingSupportFiles.shift()}

 }catch(err){state.error=(state.supportPendingCase?'El caso fue creado, pero falta subir alguna foto. Reintenta para completar la evidencia: ':'No pudimos guardar el caso: ')+err.message;render();renderSupportPreview()}finally{state.supportSending=false;if(btn)btn.disabled=false}
}

function supportCaseScreen(){const c=state.selectedSupportCase;if(!c)return '';const staff=state.profile?.is_admin===true;return shell(`<section class="settings-page">${state.supportBackRoute==='admin'?`<div class="account-top"><button class="icon" aria-label="Volver al panel" onclick="openAdmin('disputes')">←</button><h1>Detalle del caso</h1><span></span></div>`:settingsHeader('Detalle del caso')}${authMsg()}<div class="support-detail"><span class="profile-chip">${supportStatusLabel(c.status)}</span><h1>${escapeHtml(c.subject)}</h1><p>${escapeHtml(c.description)}</p><small>Folio ${escapeHtml(c.id.slice(0,8).toUpperCase())}</small>${state.supportEvidence?.length?`<h3>Evidencia</h3><div class="task-gallery">${state.supportEvidence.filter(e=>e.url).map(e=>`<button onclick="openMediaPhoto('${escapeAttr(e.url)}','Evidencia del caso')"><img src="${escapeAttr(e.url)}" alt="Evidencia"></button>`).join('')}</div>`:''}</div><h2>Seguimiento</h2>${(state.supportMessages||[]).map(m=>`<div class="support-message"><b>${m.is_staff?'Soporte':'Mensaje del usuario'}</b><p>${escapeHtml(m.body)}</p><small>${new Date(m.created_at).toLocaleString('es-MX')}</small></div>`).join('')||'<p class="small">Todavía no hay respuestas.</p>'}${staff?`<form class="support-form" onsubmit="replySupportCase(event,'${c.id}')"><label>Agregar información<textarea name="body" maxlength="2000" required></textarea></label>${staff?`<label>Estado<select name="status">${['pending','reviewing','resolved'].map(s=>`<option value="${s}" ${s===c.status?'selected':''}>${supportStatusLabel(s)}</option>`).join('')}</select></label>`:''}<button class="btn orange">Enviar respuesta</button></form>`:''}</section>`,true)}
async function replySupportCase(event,id){event.preventDefault();if(state.profile?.is_admin!==true)return setMsg('error','Solo soporte puede responder a los casos.');const f=new FormData(event.target),{error}=await sb.from('support_tickets').update({response:f.get('body'),status:f.get('status'),updated_at:new Date().toISOString()}).eq('id',id).select('id').single();if(error)return setMsg('error',error.message);await openSupportCase(id)}
