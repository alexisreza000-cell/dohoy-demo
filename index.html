<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f0a4b">
<title>DOHOY 0.2 Beta</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#3d0d5d;--p2:#5a1b82;--o:#ff6818;--bg:#fffaf3;--ink:#21172b;--mut:#756d7d;--line:#e9e1ed;--card:#fff;--green:#159957;--red:#b42318}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eee7f2;color:var(--ink)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:460px;min-height:100vh;margin:auto;background:var(--bg);position:relative;box-shadow:0 10px 40px #2f0a4b18}
.screen{min-height:100vh;padding:22px 18px 92px}.hero{min-height:100vh;padding:50px 26px 38px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:radial-gradient(circle at 85% 15%,#ff68184d,transparent 30%),radial-gradient(circle at 12% 65%,#74429a66,transparent 38%),linear-gradient(160deg,#2f0a4b,#171022 72%)}
.logo{font-size:43px;font-weight:950;letter-spacing:-2px;line-height:1}.logo b{color:var(--o)}.logo.sm{font-size:27px}.tag{margin-top:9px;color:#ffffffd9}
h1{font-size:31px;line-height:1.06;letter-spacing:-.8px;margin:14px 0 9px}h2{margin:20px 0 10px;font-size:20px}p{line-height:1.45}.sub{color:var(--mut)}.kicker{color:var(--o);font-size:12px;font-weight:900;letter-spacing:1.1px;text-transform:uppercase}
.btn{border:0;border-radius:16px;padding:15px 17px;width:100%;font-weight:850;margin-top:9px}.primary{background:var(--p);color:#fff}.orange{background:var(--o);color:#fff}.light{background:#fff;color:var(--ink)}.ghost{background:#f1e9f5;color:var(--p)}.outline{background:transparent;border:1.5px solid currentColor;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.icon{border:0;background:#f1e9f5;color:var(--p);width:42px;height:42px;border-radius:14px;font-size:19px}.pill{display:inline-flex;background:#f1e9f5;color:var(--p);border-radius:99px;padding:7px 10px;font-size:12px;font-weight:800}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 6px 22px #2f0a4b0d}.cards{display:grid;gap:12px}.mode{min-height:150px;text-align:left}.mode .emoji{font-size:42px}.mode h3{font-size:22px;margin:10px 0 5px}.mode p{margin:0;color:var(--mut)}
.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:13px;font-weight:800}.input,textarea,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;color:var(--ink);outline:none}textarea{min-height:90px;resize:vertical}
.error{background:#fff0ef;color:var(--red);border:1px solid #f4c7c3;border-radius:13px;padding:11px 12px;margin:10px 0;font-size:13px}.ok{background:#ecf8f1;color:#146c43;border:1px solid #b9e5cb;border-radius:13px;padding:11px 12px;margin:10px 0;font-size:13px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fffffff2;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:9px 8px max(9px,env(safe-area-inset-bottom));z-index:30}.nav button{border:0;background:transparent;color:#817889;font-size:11px}.nav b{color:var(--p)}
.task{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left}.thumb{width:52px;height:52px;border-radius:15px;background:#f0e8f4;display:grid;place-items:center;font-size:25px}.task h3{font-size:15px;margin:0 0 5px}.meta{font-size:12px;color:var(--mut)}.price{font-size:20px;font-weight:900;color:var(--green)}
.row{display:flex;gap:10px}.row>*{flex:1}.section{display:flex;justify-content:space-between;align-items:end;margin:22px 0 11px}.section h2{margin:0}.empty{text-align:center;color:var(--mut);padding:34px 12px}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#f2d7c9,#d8c1ef);display:grid;place-items:center;font-size:25px}.offer{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center}.stars{color:#ef8c00;font-weight:850;font-size:12px}
.chat{display:grid;gap:10px}.bubble{max-width:80%;padding:11px 13px;border-radius:16px;font-size:14px;line-height:1.4}.bubble.me{margin-left:auto;background:var(--p);color:#fff}.bubble.other{background:#fff;border:1px solid var(--line)}.chatbar{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);width:min(424px,calc(100% - 36px));display:flex;gap:8px}.chatbar input{flex:1;border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:0 8px 25px #2f0a4b14}.chatbar button{width:48px;border:0;border-radius:14px;background:var(--p);color:#fff}
.status{display:grid;gap:9px}.status div{padding:12px;border-radius:13px;background:#f3edf7}.status .active{background:#eaf7f0;color:#12693f;font-weight:800}
.small{font-size:12px;color:var(--mut)}.center{text-align:center}.spinner{padding:55px 0;text-align:center;color:var(--mut)}
@media(min-width:700px){body{padding:26px 0}.app{border-radius:32px;overflow:hidden;min-height:900px}.screen,.hero{min-height:900px}.nav{bottom:26px;border-radius:0 0 32px 32px}.chatbar{bottom:100px}}
</style>
</head>
<body><div id="root"></div>
<script>
const SUPABASE_URL="https://qakhqnuigpjbeeahuyct.supabase.co";
const SUPABASE_KEY="sb_publishable_g6FMgju9Lv2mtJCn2heXCw_YhRjweyL";
const REDIRECT_URL="https://alexisreza000-cell.github.io/dohoy-demo/";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const root=document.getElementById("root");

let state={
  route:"loading", mode:localStorage.getItem("dohoy_mode")||"client",
  session:null,user:null,profile:null,tasks:[],selectedTask:null,offers:[],messages:[],notice:"",error:""
};
let poller=null;
const icons={Vehículo:"🚗",Mandados:"🛒",Paquetería:"📦",Hogar:"🏠",Mascotas:"🐾",Trámites:"📄",Otro:"✨"};
const money=n=>new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:0}).format(Number(n||0));
function logo(sm=false){return `<div class="logo ${sm?"sm":""}">DO<b>HOY</b></div>`}
function shell(content,nav=false){return `<main class="app">${content}${nav?navBar():""}</main>`}
function navBar(){return `<nav class="nav">
<button onclick="go('${state.mode==="client"?"clientHome":"workerHome"}')"><b>⌂</b><br>Inicio</button>
<button onclick="go('${state.mode==="client"?"createTask":"workerHome"}')">${state.mode==="client"?"＋":"☷"}<br>${state.mode==="client"?"Publicar":"Tareas"}</button>
<button onclick="openMessagesHome()">💬<br>Mensajes</button>
<button onclick="go('profile')">●<br>Perfil</button>
</nav>`}
function clearPoll(){if(poller){clearInterval(poller);poller=null}}
function setMsg(type,msg){state.error=type==="error"?msg:"";state.notice=type==="ok"?msg:"";render()}
function go(r){clearPoll();state.route=r;state.error="";state.notice="";render();window.scrollTo(0,0)}
function mode(m){state.mode=m;localStorage.setItem("dohoy_mode",m);go(m==="client"?"clientHome":"workerHome")}
function authMsg(){return `${state.error?`<div class="error">${state.error}</div>`:""}${state.notice?`<div class="ok">${state.notice}</div>`:""}`}

function welcome(){
return shell(`<section class="hero">
<div>${logo()}<div class="tag">Lo necesitas. Alguien lo hace.</div></div>
<div><div class="kicker">DOHOY 0.2 BETA</div><h1>Dos personas ya pueden usar DOHOY de verdad.</h1><p style="color:#ffffffc9">Cuentas reales, tareas reales y ofertas conectadas a nuestra base de datos.</p></div>
<div><button class="btn light" onclick="go('signup')">Crear cuenta</button><button class="btn outline" onclick="go('login')">Iniciar sesión</button></div>
</section>`)
}
function signup(){
return shell(`<section class="screen">
<div class="top"><button class="icon" onclick="go('welcome')">←</button>${logo(true)}<span></span></div>
<div class="kicker">Crear cuenta</div><h1>Bienvenido a DOHOY</h1><p class="sub">Usaremos tu correo para iniciar sesión.</p>${authMsg()}
<form id="signupForm">
<div class="field"><label>Nombre</label><input class="input" name="name" required autocomplete="name"></div>
<div class="field"><label>Correo</label><input class="input" name="email" type="email" required autocomplete="email"></div>
<div class="field"><label>Contraseña</label><input class="input" name="password" type="password" minlength="8" required autocomplete="new-password"></div>
<button class="btn primary">Crear mi cuenta</button></form>
<p class="small center">Al registrarte recibirás un correo de confirmación durante esta beta.</p>
</section>`)
}
function login(){
return shell(`<section class="screen">
<div class="top"><button class="icon" onclick="go('welcome')">←</button>${logo(true)}<span></span></div>
<div class="kicker">Iniciar sesión</div><h1>Qué bueno verte.</h1>${authMsg()}
<form id="loginForm">
<div class="field"><label>Correo</label><input class="input" name="email" type="email" required autocomplete="email"></div>
<div class="field"><label>Contraseña</label><input class="input" name="password" type="password" required autocomplete="current-password"></div>
<button class="btn primary">Entrar</button></form>
</section>`)
}
function chooseMode(){
return shell(`<section class="screen"><div class="top">${logo(true)}<button class="icon" onclick="signOut()">↪</button></div>
<div class="kicker">Elige un modo</div><h1>¿Qué quieres hacer hoy?</h1><p class="sub">La misma cuenta puede contratar y también trabajar.</p>
<div class="cards">
<button class="card mode" onclick="mode('client')"><div class="emoji">🙋🏻</div><h3>Necesito ayuda</h3><p>Publica una tarea y recibe ofertas.</p></button>
<button class="card mode" onclick="mode('worker')"><div class="emoji">💼</div><h3>Quiero trabajar</h3><p>Encuentra tareas abiertas y haz una oferta.</p></button>
</div></section>`)
}
function taskCard(t,client=false){
return `<button class="card task" onclick="openTask('${t.id}')">
<div class="thumb">${icons[t.category]||"✨"}</div><div><h3>${escapeHtml(t.title)}</h3><div class="meta">📍 ${escapeHtml(t.location_label||"Sin ubicación")} · ${statusText(t.status)}</div></div><div class="price">${money(t.offered_price)}</div>
</button>`
}
function statusText(s){return ({open:"Abierta",assigned:"Asignada",in_progress:"En curso",completed:"Terminada",cancelled:"Cancelada"})[s]||s}
async function clientHome(){
await loadMyTasks();
root.innerHTML=shell(`<section class="screen"><div class="top"><div>${logo(true)}<div class="small">${escapeHtml(state.profile?.full_name||state.user?.email||"Usuario")}</div></div><button class="icon" onclick="go('mode')">⇄</button></div>
<div class="kicker">Modo cliente</div><h1>¿Qué necesitas hoy?</h1>
<button class="btn orange" onclick="go('createTask')">＋ Publicar una tarea</button>
<div class="section"><h2>Mis tareas</h2><button class="pill" onclick="loadMyTasks().then(render)">Actualizar</button></div>
<div class="cards">${state.tasks.length?state.tasks.map(t=>taskCard(t,true)).join(""):`<div class="empty">Todavía no has publicado ninguna tarea.</div>`}</div>
</section>`,true)
}
async function workerHome(){
await loadOpenTasks();
root.innerHTML=shell(`<section class="screen"><div class="top"><div>${logo(true)}<div class="small">Trabajos disponibles</div></div><button class="icon" onclick="go('mode')">⇄</button></div>
<div class="kicker">Modo trabajador</div><h1>Tareas abiertas</h1><p class="sub">Estas publicaciones vienen de usuarios reales.</p>
<div class="cards">${state.tasks.length?state.tasks.map(t=>taskCard(t)).join(""):`<div class="empty">No hay tareas abiertas por ahora.</div>`}</div>
</section>`,true)
}
function createTask(){
root.innerHTML=shell(`<section class="screen"><div class="top"><button class="icon" onclick="go('clientHome')">←</button><b>Nueva tarea</b><span></span></div>
<div class="kicker">Publicar</div><h1>Cuéntanos qué necesitas.</h1>${authMsg()}
<form id="taskForm">
<div class="field"><label>Título</label><input class="input" name="title" required placeholder="Ej. Llevar mi carro al autolavado"></div>
<div class="field"><label>Descripción</label><textarea name="description" required placeholder="Explica exactamente qué debe hacer la persona"></textarea></div>
<div class="field"><label>Categoría</label><select name="category">${Object.keys(icons).map(x=>`<option>${x}</option>`).join("")}</select></div>
<div class="field"><label>Ubicación general</label><input class="input" name="location" required placeholder="Ej. Torreón, Coahuila"></div>
<div class="field"><label>Pago ofrecido</label><input class="input" name="price" type="number" min="1" step="1" required></div>
<label class="card" style="display:flex;gap:10px;align-items:center"><input name="license" type="checkbox"> Requiere licencia de conducir</label>
<button class="btn primary">Publicar tarea</button></form>
</section>`,true)
}
async function taskDetail(){
const t=state.selectedTask;if(!t)return go(state.mode==="client"?"clientHome":"workerHome");
const isOwner=t.client_id===state.user.id;
if(isOwner) await loadOffers(t.id);
else await loadMyOffer(t.id);
let body="";
if(isOwner){
body=`<h2>Ofertas recibidas</h2><div class="cards">${state.offers.length?state.offers.map(o=>{
const p=o.profiles||{};return `<div class="card"><div class="offer"><div class="avatar">👤</div><div><b>${escapeHtml(p.full_name||"Trabajador")}</b><div class="stars">★ ${p.rating??5}</div><div class="small">${escapeHtml(o.message||"Sin mensaje")}</div></div><div class="price">${money(o.amount)}</div></div>
${t.status==="open"?`<button class="btn primary" onclick="acceptOffer('${o.id}','${o.worker_id}')">Elegir trabajador</button>`:`<div class="pill">${o.status}</div>`}</div>`}).join(""):`<div class="empty">Aún no hay ofertas.</div>`}</div>`;
}else{
const my=state.offers[0];
body=t.status==="open"?`<h2>Haz una oferta</h2>${my?`<div class="ok">Ya ofreciste ${money(my.amount)}. Estado: ${my.status}.</div>`:`<form id="offerForm"><div class="field"><label>Tu precio</label><input class="input" name="amount" type="number" min="1" value="${Number(t.offered_price)}" required></div><div class="field"><label>Mensaje</label><textarea name="message" placeholder="Ej. Puedo hacerlo hoy por la tarde"></textarea></div><button class="btn primary">Enviar oferta</button></form>`}`:
t.worker_id===state.user.id?`<div class="ok">Esta tarea está asignada a ti.</div>${taskProgressButtons(t)}`:`<div class="sub">Esta tarea ya no está disponible.</div>`;
}
root.innerHTML=shell(`<section class="screen"><div class="top"><button class="icon" onclick="go('${isOwner?"clientHome":"workerHome"}')">←</button><span class="pill">${escapeHtml(t.category)}</span><span></span></div>
<div class="center" style="font-size:70px">${icons[t.category]||"✨"}</div><div class="price">${money(t.offered_price)}</div><h1>${escapeHtml(t.title)}</h1>
<p>${escapeHtml(t.description)}</p><p class="sub">📍 ${escapeHtml(t.location_label||"")}</p>
<div class="status"><div class="active">Estado: ${statusText(t.status)}</div></div>
${(t.client_id===state.user.id||t.worker_id===state.user.id)&&t.worker_id?`<button class="btn ghost" onclick="openChat('${t.id}')">💬 Abrir chat</button>`:""}
${body}</section>`,true)
}
function taskProgressButtons(t){
if(t.status==="assigned")return `<button class="btn orange" onclick="setTaskStatus('${t.id}','in_progress')">Comenzar tarea</button>`;
if(t.status==="in_progress")return `<button class="btn orange" onclick="setTaskStatus('${t.id}','completed')">Marcar como completada</button>`;
return `<div class="ok">Trabajo ${statusText(t.status).toLowerCase()}.</div>`
}
async function profile(){
await loadProfile();
root.innerHTML=shell(`<section class="screen"><div class="top">${logo(true)}<button class="icon" onclick="signOut()">↪</button></div>
<div class="center"><div class="avatar" style="margin:auto;width:82px;height:82px;font-size:36px">🧑🏻</div><h1>${escapeHtml(state.profile?.full_name||"Usuario DOHOY")}</h1><p class="sub">${escapeHtml(state.user.email||"")}</p></div>${authMsg()}
<form id="profileForm"><div class="field"><label>Nombre</label><input class="input" name="name" value="${escapeAttr(state.profile?.full_name||"")}"></div><div class="field"><label>Bio</label><textarea name="bio">${escapeHtml(state.profile?.bio||"")}</textarea></div><button class="btn primary">Guardar perfil</button></form>
<div class="card" style="margin-top:15px">⭐ ${state.profile?.rating??5} · ${state.profile?.completed_tasks??0} tareas completadas<br><br>${state.profile?.identity_verified?"✅":"○"} Identidad verificada<br>${state.profile?.driver_license_verified?"✅":"○"} Licencia verificada</div>
<button class="btn ghost" onclick="go('mode')">Cambiar modo</button></section>`,true)
}
async function openMessagesHome(){
const {data,error}=await sb.from("tasks").select("*").or(`client_id.eq.${state.user.id},worker_id.eq.${state.user.id}`).not("worker_id","is",null).order("updated_at",{ascending:false});
if(error)return setMsg("error",error.message);
if(!data.length){state.notice="Aún no tienes tareas con chat disponible.";return go(state.mode==="client"?"clientHome":"workerHome")}
state.selectedTask=data[0];openChat(data[0].id)
}
async function openChat(id){
clearPoll();const {data:t,error}=await sb.from("tasks").select("*").eq("id",id).single();if(error)return setMsg("error",error.message);
state.selectedTask=t;await loadMessages(id);state.route="chat";render();poller=setInterval(()=>loadMessages(id).then(()=>{if(state.route==="chat")render()}),3000)
}
function chatScreen(){
const t=state.selectedTask;
return shell(`<section class="screen"><div class="top"><button class="icon" onclick="go('taskDetail')">←</button><div><b>Chat de la tarea</b><div class="small">${escapeHtml(t.title)}</div></div><span></span></div>
<div class="chat">${state.messages.length?state.messages.map(m=>`<div class="bubble ${m.sender_id===state.user.id?"me":"other"}">${escapeHtml(m.body)}</div>`).join(""):`<div class="empty">Escribe el primer mensaje.</div>`}</div><div style="height:90px"></div>
<div class="chatbar"><input id="chatInput" placeholder="Escribe un mensaje…"><button onclick="sendMessage()">➤</button></div></section>`,true)
}
function render(){
if(state.route==="loading"){root.innerHTML=shell(`<section class="screen spinner">Cargando DOHOY…</section>`);return}
if(!state.session&&!["welcome","signup","login"].includes(state.route)){state.route="welcome"}
const sync={welcome,signup,login,mode:chooseMode,createTask,taskDetail,chat:chatScreen,profile};
if(state.route==="clientHome"){clientHome();return}
if(state.route==="workerHome"){workerHome();return}
const fn=sync[state.route]||welcome;root.innerHTML=fn()
bindForms()
}
function bindForms(){
const s=document.getElementById("signupForm");if(s)s.onsubmit=signUp;
const l=document.getElementById("loginForm");if(l)l.onsubmit=signIn;
const t=document.getElementById("taskForm");if(t)t.onsubmit=publishTask;
const o=document.getElementById("offerForm");if(o)o.onsubmit=sendOffer;
const p=document.getElementById("profileForm");if(p)p.onsubmit=saveProfile;
}
async function signUp(e){
e.preventDefault();const f=new FormData(e.target);
const {data,error}=await sb.auth.signUp({email:f.get("email"),password:f.get("password"),options:{data:{full_name:f.get("name")},emailRedirectTo:REDIRECT_URL}});
if(error)return setMsg("error",error.message);
if(data.session){state.session=data.session;state.user=data.user;await loadProfile();go("mode")}
else{state.notice="Cuenta creada. Revisa tu correo y confirma tu cuenta; después vuelve a DOHOY e inicia sesión.";state.error="";render()}
}
async function signIn(e){
e.preventDefault();const f=new FormData(e.target);const {data,error}=await sb.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});
if(error)return setMsg("error",error.message);state.session=data.session;state.user=data.user;await loadProfile();go("mode")
}
async function signOut(){await sb.auth.signOut();state.session=null;state.user=null;state.profile=null;state.tasks=[];go("welcome")}
async function loadProfile(){
if(!state.user)return;const {data,error}=await sb.from("profiles").select("id,full_name,avatar_url,bio,rating,completed_tasks,identity_verified,phone_verified,driver_license_verified,created_at").eq("id",state.user.id).single();
if(!error)state.profile=data
}
async function saveProfile(e){
e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from("profiles").update({full_name:f.get("name"),bio:f.get("bio")}).eq("id",state.user.id);
if(error)return setMsg("error",error.message);await loadProfile();state.notice="Perfil guardado.";render()
}
async function publishTask(e){
e.preventDefault();const f=new FormData(e.target);const payload={client_id:state.user.id,title:f.get("title"),description:f.get("description"),category:f.get("category"),location_label:f.get("location"),offered_price:Number(f.get("price")),requires_driver_license:f.get("license")==="on"};
const {data,error}=await sb.from("tasks").insert(payload).select().single();if(error)return setMsg("error",error.message);state.selectedTask=data;go("taskDetail")
}
async function loadMyTasks(){const {data,error}=await sb.from("tasks").select("*").eq("client_id",state.user.id).order("created_at",{ascending:false});state.tasks=error?[]:data}
async function loadOpenTasks(){const {data,error}=await sb.from("tasks").select("*").eq("status","open").neq("client_id",state.user.id).order("created_at",{ascending:false});state.tasks=error?[]:data}
async function openTask(id){
const {data,error}=await sb.from("tasks").select("*").eq("id",id).single();if(error)return setMsg("error",error.message);state.selectedTask=data;go("taskDetail")
}
async function loadOffers(taskId){
const {data,error}=await sb.from("task_offers").select("id,task_id,worker_id,amount,message,status,created_at,profiles!task_offers_worker_id_fkey(full_name,rating,completed_tasks,identity_verified,driver_license_verified)").eq("task_id",taskId).order("created_at",{ascending:true});
state.offers=error?[]:data
}
async function loadMyOffer(taskId){
const {data,error}=await sb.from("task_offers").select("*").eq("task_id",taskId).eq("worker_id",state.user.id).limit(1);state.offers=error?[]:data
}
async function sendOffer(e){
e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from("task_offers").insert({task_id:state.selectedTask.id,worker_id:state.user.id,amount:Number(f.get("amount")),message:f.get("message")});
if(error)return setMsg("error",error.message);await loadMyOffer(state.selectedTask.id);state.notice="Oferta enviada.";render()
}
async function acceptOffer(offerId,workerId){
const tid=state.selectedTask.id;
let r=await sb.from("task_offers").update({status:"accepted"}).eq("id",offerId);if(r.error)return setMsg("error",r.error.message);
await sb.from("task_offers").update({status:"rejected"}).eq("task_id",tid).neq("id",offerId);
r=await sb.from("tasks").update({worker_id:workerId,status:"assigned"}).eq("id",tid).eq("client_id",state.user.id).select().single();
if(r.error)return setMsg("error",r.error.message);state.selectedTask=r.data;state.notice="Trabajador seleccionado.";await loadOffers(tid);render()
}
async function setTaskStatus(id,status){
const {data,error}=await sb.from("tasks").update({status}).eq("id",id).select().single();if(error)return setMsg("error",error.message);state.selectedTask=data;render()
}
async function loadMessages(taskId){
const {data,error}=await sb.from("messages").select("*").eq("task_id",taskId).order("created_at",{ascending:true});if(!error)state.messages=data
}
async function sendMessage(){
const inp=document.getElementById("chatInput");const body=inp?.value.trim();if(!body)return;
const {error}=await sb.from("messages").insert({task_id:state.selectedTask.id,sender_id:state.user.id,body});if(error)return setMsg("error",error.message);inp.value="";await loadMessages(state.selectedTask.id);render()
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]))}
function escapeAttr(v){return escapeHtml(v).replace(/`/g,"&#96;")}
async function init(){
const {data}=await sb.auth.getSession();state.session=data.session;state.user=data.session?.user||null;if(state.user)await loadProfile();
state.route=state.session?"mode":"welcome";render();
sb.auth.onAuthStateChange(async(_event,session)=>{state.session=session;state.user=session?.user||null;if(state.user)await loadProfile();if(!session&&!["welcome","signup","login"].includes(state.route))go("welcome")})
}
window.go=go;window.mode=mode;window.signOut=signOut;window.openTask=openTask;window.acceptOffer=acceptOffer;window.setTaskStatus=setTaskStatus;window.openChat=openChat;window.openMessagesHome=openMessagesHome;window.sendMessage=sendMessage;
init();
</script></body></html>
