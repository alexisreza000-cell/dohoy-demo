/* DOHOY 1.9.0 · UI REFRESH */
:root{
 --blue:#165DFF;--blue-2:#0F3D91;--blue-soft:#EAF2FF;--blue-pale:#F4F8FF;
 --orange:#FF7A00;--orange-2:#FFA94D;--orange-soft:#FFF1E5;
 --ink:#0F172A;--muted:#64748B;--surface:#FFFFFF;--surface-2:#F8FBFF;
 --line:#D9E5F5;--success:#16A34A;--danger:#DC2626;
 --shadow:0 14px 34px rgba(15,61,145,.10);--shadow-strong:0 18px 42px rgba(15,61,145,.16)
}
html,body{background:
 radial-gradient(circle at 90% 0%,#DDEBFF 0,transparent 30%),
 radial-gradient(circle at 0% 18%,#FFF0E1 0,transparent 24%),
 linear-gradient(180deg,#EEF5FF 0%,#F7FAFF 42%,#F4F7FB 100%)!important;color:var(--ink)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(22,93,255,.025),rgba(255,122,0,.025));z-index:-1}
.screen,.settings-page{background:transparent!important}
.screen>h1,.settings-page h1{color:var(--ink);letter-spacing:-.7px}
.screen>p,.settings-page p,.sub,.small,.meta,.row-sub{color:var(--muted)}

/* Headers / hero */
.home-hero,.hero,.profile-hero,.mode-hero,.account-hero,.safety-hero{background:linear-gradient(135deg,#0B3D91 0%,#165DFF 62%,#FF7A00 145%)!important;box-shadow:var(--shadow-strong)!important;border:1px solid rgba(255,255,255,.2)!important}
.home-hero:after,.hero:after,.profile-hero:after,.mode-hero:after,.account-hero:after{content:"";position:absolute;right:-42px;top:-48px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.topbar,.account-top{background:rgba(255,255,255,.76);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(213,225,242,.9);box-shadow:0 8px 26px rgba(15,61,145,.07)}

/* Cards */
.card,.task,.detail-card,.offer-person-card,.selected-worker-card,.rating-card,.completion-card,.completion-proof,.important-card,.recent-review,.settings-section,.client-profile-card,.client-rating-box,.timeline,.filter-card,.worker-search-card,.map-card,.empty,.chat-card,.notification-card,.admin-card{
 background:linear-gradient(145deg,#FFFFFF 0%,#FBFDFF 68%,#FFF9F3 115%)!important;
 border:1px solid var(--line)!important;border-radius:24px!important;box-shadow:var(--shadow)!important
}
.card:hover,.task:hover,.offer-person-card:hover{box-shadow:0 18px 42px rgba(15,61,145,.14)!important;border-color:#C6D9F5!important}
.task{position:relative;overflow:hidden}
.task:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--blue),var(--orange))}
.task .thumb,.detail-icon-box,.row-ico{background:linear-gradient(145deg,#E7F0FF,#FFF0E2)!important;color:var(--blue-2)!important;border:1px solid #D7E5F7!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.task .price,.detail-money,.worker-price{color:var(--orange)!important;font-weight:1000!important}
.task h3,.detail-card h2,.offer-person-card h3{color:var(--ink)!important}

/* Category + status chips */
.detail-category-pill,.chip,.badge,.profile-chip,.category-pill,.status-pill,.location-pill,.task .tag{background:var(--blue-soft)!important;color:var(--blue-2)!important;border:1px solid #D5E4FA!important;box-shadow:none!important}
.status-open,.badge-open,.available{background:#ECFDF3!important;color:#15803D!important;border-color:#CDEED8!important}
.status-assigned,.badge-assigned,.status-pending{background:#FFF4E8!important;color:#C65A00!important;border-color:#FFD7B5!important}
.status-paid,.badge-paid,.status-completed{background:#ECFDF3!important;color:#15803D!important;border-color:#CDEED8!important}

/* Buttons */
.btn,.primary,.chat-cta-btn,.publish-submit,.login-btn,.signup-btn,.save-btn{border:0!important;border-radius:18px!important;font-weight:950!important;letter-spacing:.1px!important;background:linear-gradient(135deg,var(--blue-2) 0%,var(--blue) 78%)!important;color:#fff!important;box-shadow:0 12px 26px rgba(22,93,255,.24)!important;transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}
.btn:active,.primary:active,.chat-cta-btn:active,.publish-submit:active,.login-btn:active,.signup-btn:active,.save-btn:active,.payment-cta:active{transform:translateY(1px) scale(.992)!important}
.btn:hover,.primary:hover,.chat-cta-btn:hover,.publish-submit:hover,.login-btn:hover,.signup-btn:hover,.save-btn:hover{filter:brightness(1.03);box-shadow:0 16px 30px rgba(22,93,255,.29)!important}
.secondary,.secondary-soft,.edit-task-btn{background:#EDF4FF!important;color:var(--blue-2)!important;border:1px solid #D5E4FA!important;box-shadow:none!important}

   if(da==null)return 1;
   if(db==null)return -1;
   return da-db
 })
}
async function reverseGeocode(lat,lon){
 try{
   const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=18&addressdetails=1`;
   const res=await fetch(url,{headers:{"Accept-Language":"es-MX,es;q=0.9"}});
   if(!res.ok)throw new Error("geocode");
   const j=await res.json(),a=j.address||{};
   const street=a.road||a.pedestrian||a.residential||a.footway||a.cycleway||"";
   const number=a.house_number||"";
   const locality=a.neighbourhood||a.suburb||a.city_district||a.city||a.town||a.village||"";
   const parts=[];
   if(street)parts.push(`${street}${number?` ${number}`:""}`);
   if(locality&&(!street||!street.toLowerCase().includes(locality.toLowerCase())))parts.push(locality);
   const short=parts.slice(0,2).join(", ");
   return short||String(j.display_name||"").split(",").slice(0,2).join(",").trim()||"Ubicación actual";
 }catch(e){return "Ubicación actual"}
}
function updateWorkerLocationUI(){
 const el=document.getElementById("workerLocationButton");
 if(el){
   el.classList.toggle("active",!!state.workerLocation);
   el.querySelector("span").textContent=state.workerLocation?(state.workerAddress||"Ubicación activa"):"Activar ubicación para ver trabajos cercanos";
 }

function stopWorkerLocation(){
 if(workerGeoWatchId!=null&&navigator.geolocation){navigator.geolocation.clearWatch(workerGeoWatchId)}
 workerGeoWatchId=null;state.workerLocation=null;state.workerLocationError="";state.workerAddress="";workerAddressUpdatedAt=0;updateWorkerLocationUI()
}
function toggleWorkerLocation(){
 if(workerGeoWatchId!=null){stopWorkerLocation();return}
 if(!navigator.geolocation){state.workerLocationError="Tu navegador no permite acceder a la ubicación.";return updateWorkerLocationUI()}
 state.workerLocationError="";
 workerGeoWatchId=navigator.geolocation.watchPosition(pos=>{
   state.workerLocation={latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy,updatedAt:Date.now()};
   const now=Date.now();
   if(!state.workerAddress||now-workerAddressUpdatedAt>30000){
     workerAddressUpdatedAt=now;
     if(!state.workerAddress)state.workerAddress="Buscando dirección…";
     reverseGeocode(pos.coords.latitude,pos.coords.longitude).then(address=>{
       if(workerGeoWatchId!=null&&state.workerLocation){state.workerAddress=address;updateWorkerLocationUI()}
     });
   }
   updateWorkerLocationUI()
 },err=>{
   workerGeoWatchId=null;
   state.workerLocationError=err.code===1?"Permiso de ubicación rechazado. Puedes activarlo desde Safari.":"No pudimos obtener tu ubicación. Intenta de nuevo.";
   updateWorkerLocationUI()
 },{enableHighAccuracy:true,maximumAge:5000,timeout:12000})
}
function useTaskCurrentLocation(btn){
 if(!navigator.geolocation){alert("Tu navegador no permite acceder a la ubicación.");return}
 const old=btn?.innerHTML;if(btn){btn.disabled=true;btn.textContent="Buscando ubicación…"}
 navigator.geolocation.getCurrentPosition(async pos=>{
   const lat=document.getElementById("taskLatitude"),lon=document.getElementById("taskLongitude"),input=document.querySelector('input[name="location"]');
   if(lat)lat.value=pos.coords.latitude;if(lon)lon.value=pos.coords.longitude;
   const address=await reverseGeocode(pos.coords.latitude,pos.coords.longitude);
   if(input)input.value=address;
   if(btn){btn.disabled=false;btn.classList.add("ok");btn.innerHTML=`${iconSvg("location")} ${escapeHtml(address)}`}
 },err=>{
   if(btn){btn.disabled=false;btn.innerHTML=old||"Usar mi ubicación actual"}
   alert(err.code===1?"Necesitamos permiso de ubicación para usar esta función.":"No pudimos obtener tu ubicación. Intenta otra vez.")
 },{enableHighAccuracy:true,maximumAge:0,timeout:12000})
}

async function imageFileToJpeg(file,max=1400){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{let w=img.naturalWidth,h=img.naturalHeight,scale=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);c.toBlob(blob=>{URL.revokeObjectURL(url);blob?resolve(blob):reject(new Error("No pudimos preparar la foto."))},"image/jpeg",.84)}catch(err){URL.revokeObjectURL(url);reject(err)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("No pudimos abrir la foto."))};img.src=url})}

function agreedTaskAmount(t,offer){
 if(!offer)return Number(t?.offered_price||0);
 if(offer.counter_status==="accepted"&&offer.counter_amount!=null)return Number(offer.counter_amount);
 return Number(offer.amount||t?.offered_price||0)
}
async function loadTaskPayment(taskId){
 const {data,error}=await sb.from("task_payments").select("id,task_id,amount_total,commission_amount,worker_net_amount,payment_status,stripe_checkout_session_id,paid_at").eq("task_id",taskId).order("created_at",{ascending:false}).limit(1);

}
function paymentActionHtml(t,offer){
 if(t.client_id!==state.user?.id||!t.worker_id||!["assigned","in_progress"].includes(t.status))return "";

async function startTaskCheckout(taskId){

   const {data,error}=await sb.functions.invoke("dohoy-create-checkout",{body:{task_id:taskId,return_url:REDIRECT_URL}});
   if(error)throw error;
   if(!data?.checkout_url)throw Error(data?.error||"No se recibió la liga de pago.");
   window.location.assign(data.checkout_url)

   state.checkoutBusy=false;
   state.error="No pudimos abrir el pago: "+(err?.message||err);
   render()
 }
}

function profileDisplayName(p){
 const first=String(p?.full_name||"").trim(),last=String(p?.last_name||"").trim();
 if(!first&&!last)return "Usuario DOHOY";
 if(!last)return first;
 if(first.toLocaleLowerCase("es-MX").endsWith(last.toLocaleLowerCase("es-MX")))return first;
 return `${first} ${last}`.trim()
}

 event.preventDefault();const form=event.target;const btn=form.querySelector('button[type=submit],button');const original=btn?.textContent;const v=(new FormData(form).get('value')||'').trim();

      const {data:authData,error:authError}=await sb.auth.updateUser({data:{full_name:v}});
      if(authError)throw authError;if(authData?.user)state.user=authData.user

}

function openConversationFromList(event,taskId,closed){

 if(state.swipeConversationId===taskId){event?.preventDefault?.();setConversationSwipe(taskId,false);return}
 closeAllConversationSwipes();if(closed)openTask(taskId);else openChat(taskId,'messagesHome')
}
function bindConversationSwipes(){
 document.querySelectorAll('.chat-swipe-row').forEach(row=>{
  if(row.dataset.swipeBound==='1')return;row.dataset.swipeBound='1';
  const content=row.querySelector('.chat-swipe-content');if(!content)return;
  let startX=0,startY=0,lastX=0,dragging=false,base=0;
  row.addEventListener('touchstart',e=>{if(!e.touches?.length)return;const t=e.touches[0];startX=lastX=t.clientX;startY=t.clientY;dragging=false;base=row.classList.contains('is-open')?-92:0;closeAllConversationSwipes(row.dataset.taskId)}, {passive:true});
  row.addEventListener('touchmove',e=>{if(!e.touches?.length)return;const t=e.touches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(!dragging&&Math.abs(dx)<8&&Math.abs(dy)<8)return;if(!dragging&&Math.abs(dy)>Math.abs(dx))return;dragging=true;row.classList.add('is-dragging');e.preventDefault();lastX=t.clientX;const x=Math.max(-92,Math.min(0,base+dx));content.style.transform=`translateX(${x}px)`}, {passive:false});
  row.addEventListener('touchend',()=>{if(!dragging)return;row.classList.remove('is-dragging');const dx=lastX-startX;const finalX=Math.max(-92,Math.min(0,base+dx));const open=finalX<-42;swipeSuppressUntil=Date.now()+350;setConversationSwipe(row.dataset.taskId,open)});
  row.addEventListener('touchcancel',()=>{row.classList.remove('is-dragging');content.style.transform='';content.style.transition=''});
 });
}

function upsertRealtimeMessage(msg){
const i=state.messages.findIndex(m=>m.id===msg.id);
if(i>=0)state.messages[i]={...state.messages[i],...msg};else state.messages.push(msg);
state.messages.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))
}
function subscribeToChat(taskId){
if(chatChannel){sb.removeChannel(chatChannel);chatChannel=null}
chatChannel=sb.channel(`dohoy-chat-${taskId}`)
.on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`task_id=eq.${taskId}`},async payload=>{
  const incoming=payload.new;const isNew=!state.messages.some(m=>m.id===incoming.id);upsertRealtimeMessage(incoming);
  if(incoming.sender_id!==state.user.id){await markChatRead(taskId);await loadMessages(taskId)}
  refreshChatDom(isNew)
})
.on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:`task_id=eq.${taskId}`},payload=>{
  upsertRealtimeMessage(payload.new);refreshChatDom(false)
})
.subscribe()
}

async function signUp(e){

if(btn){btn.disabled=true;btn.setAttribute('aria-busy','true')}

const f=new FormData(form);
const email=String(f.get("email")||"").trim().toLowerCase();
const name=String(f.get("name")||"").trim();
const password=String(f.get("password")||"");
try{
 const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:REDIRECT_URL}});
 if(error){
   const msg=String(error.message||"");
   if(/Database error saving new user|unexpected_failure|duplicate key|already registered|already exists/i.test(msg)){
     state.error="";
     state.notice="Si acabas de crear esta cuenta, el registro ya fue enviado. Revisa tu correo de confirmación. Si ya tenías cuenta, usa “Ya tengo cuenta”.";

   if(state.initialMode){const m=state.initialMode;state.initialMode=null;mode(m)}
   else go(onboardingDone()?'mode':'onboarding')

   state.notice="Cuenta creada. Revisa tu correo y confirma tu cuenta; después vuelve a DOHOY e inicia sesión.";
   state.error="";
   render()
 }
}finally{
 state.signupBusy=false;

function taskIsToday(t){const now=new Date(),d=new Date(t.scheduled_for||t.created_at||Date.now());return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d.getDate()===now.getDate()}
function distanceForFilter(t){const origin=state.workerLocation||state.savedSearchOrigin;if(!origin||t.latitude==null||t.longitude==null)return null;return haversineKm(origin.latitude,origin.longitude,Number(t.latitude),Number(t.longitude))}
function filteredWorkerTasks(tasks=state.tasks,filters=workerFilterState()){
 const fold=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('es-MX');const q=fold(filters.query.trim());
 return sortTasksByDistance((tasks||[]).filter(t=>{
  if(q&&!fold(`${t.title||''} ${t.description||''} ${baseCategory(t.category)}`).includes(q))return false;
  if(filters.category&&baseCategory(t.category)!==filters.category)return false;
  if(Number(t.offered_price)<Number(filters.minPrice||0))return false;
  if(filters.todayOnly&&!taskIsToday(t))return false;
  if(filters.vehicleOnly&&!(baseCategory(t.category)==='Vehículo'||t.requires_driver_license))return false;
  const distance=distanceForFilter(t);if(filters.maxDistance!=null&&(distance==null||distance>Number(filters.maxDistance)))return false;
  return true;

function adminPerson(p){return escapeHtml(profileDisplayName(p))}
function adminRecord(r){const kind=state.adminSection;
 if(kind==='users')return `<article class="admin-record"><div class="admin-row-head"><h3>${adminPerson(r)}</h3><span class="profile-chip">${r.is_suspended?'Suspendida':r.is_admin?'Administrador':'Activa'}</span></div><p>Registro: ${adminDate(r.created_at)} · ${Number(r.completed_tasks||0)} trabajos · ${prettyRating(r.rating)} ★</p><small>ID: ${escapeHtml(r.id)}</small>${r.id!==state.user.id?`<button class="btn ${r.is_suspended?'ghost':'danger-btn'}" ${state.adminBusy?'disabled':''} onclick="adminSuspendUser('${r.id}',${!r.is_suspended})">${r.is_suspended?'Reactivar cuenta':'Suspender cuenta'}</button>`:'<p class="small">Tu cuenta administradora</p>'}</article>`;
 if(kind==='tasks')return `<article class="admin-record"><div class="admin-row-head"><h3>${escapeHtml(r.title)}</h3><span class="profile-chip">${escapeHtml(statusText(r.status))}</span></div><p>${money(r.offered_price)} · ${adminDate(r.created_at)}</p><small>Cliente ${shortUser(r.client_id)} · Trabajador ${shortUser(r.worker_id)}<br>Tarea ${escapeHtml(r.id)}</small></article>`;
 if(kind==='blocks')return `<article class="admin-record"><h3>${escapeHtml(r.blocker_name||'Usuario')} bloqueó a ${escapeHtml(r.blocked_name||'Usuario')}</h3><p>${adminDate(r.created_at)}</p><small>${shortUser(r.blocker_id)} → ${shortUser(r.blocked_id)}</small></article>`;
 if(kind==='ratings')return `<article class="admin-record"><h3>${Number(r.score)} de 5 ★ · ${r.rated_role==='worker'?'Trabajador':'Cliente'}</h3><p>${escapeHtml(r.comment||'Sin comentario')}</p><small>De ${shortUser(r.author_id)} a ${shortUser(r.rated_id)} · ${adminDate(r.created_at)}<br>Tarea ${escapeHtml(r.task_id)}</small></article>`;
 const support=kind==='disputes'&&r.source==='support',closed=r.status==='closed'||r.status==='resolved';return `<article class="admin-record"><div class="admin-row-head"><h3>${escapeHtml(r.reason)}</h3><span class="profile-chip">${escapeHtml(support?supportStatusLabel(r.status):closed?'Cerrado':'Pendiente')}</span></div><p>${escapeHtml(r.details||'Sin detalles adicionales')}</p><small>Usuario ${shortUser(r.reporter_id)}${r.reported_user_id?' · Reportado '+shortUser(r.reported_user_id):''} · ${adminDate(r.created_at)}${r.task_id?'<br>Tarea '+escapeHtml(r.task_id):''}</small>${support?`<button class="btn ghost" onclick="adminOpenSupport('${r.id}')">Ver evidencia y responder</button>`:`<button class="btn ghost" ${state.adminBusy?'disabled':''} onclick="adminReviewReport('${kind==='reports'?'report':'issue'}','${r.id}',${!closed})">${closed?'Reabrir reporte':'Marcar como revisado'}</button>`}</article>`
}
function adminScreen(){if(!adminAllowed())return shell(`<section class="settings-page">${settingsHeader('Administración')}<p>Acceso reservado a administradores.</p></section>`,true);
 const metrics=state.adminOverview,p=state.adminPage;return shell(`<section class="settings-page admin-page">${settingsHeader('Administración')}${authMsg()}<div class="admin-intro"><div><div class="kicker">Gestión de DOHOY</div><h2>Tu panel</h2></div><button class="icon" aria-label="Actualizar panel" onclick="openAdmin(state.adminSection,state.adminOffset)">↻</button></div>${metrics?`<div class="admin-metrics">${Object.entries(ADMIN_SECTIONS).map(([key,label])=>`<button onclick="openAdmin('${key}')"><b>${Number(metrics[key]||0)}</b><span>${label}${key==='reports'||key==='disputes'?' pendientes':''}</span></button>`).join('')}</div><p class="small">${Number(metrics.suspended||0)} cuentas suspendidas. Los bloqueos son decisiones entre usuarios.</p>`:''}<div class="admin-tabs" role="group" aria-label="Secciones de administración">${Object.entries(ADMIN_SECTIONS).map(([key,label])=>`<button class="${state.adminSection===key?'selected':''}" aria-pressed="${state.adminSection===key}" onclick="openAdmin('${key}')">${label}</button>`).join('')}</div>${state.adminSection==='users'?`<form class="admin-search" onsubmit="searchAdminUsers(event)"><label for="adminUserSearch">Buscar por nombre o ID</label><div><input id="adminUserSearch" name="query" maxlength="120" value="${escapeAttr(state.adminQuery||'')}" placeholder="Nombre o ID de usuario"><button class="btn primary">Buscar</button></div></form>`:''}${state.adminLoading?'<div class="empty" role="status">Cargando datos…</div>':p?`<h2>${ADMIN_SECTIONS[state.adminSection]} <small>(${Number(p.total)})</small></h2><div class="admin-list">${p.items?.length?p.items.map(adminRecord).join(''):'<div class="empty">No hay registros en esta sección.</div>'}</div><div class="admin-pagination"><button class="btn ghost" ${p.offset<=0?'disabled':''} onclick="openAdmin(state.adminSection,${Math.max(0,p.offset-p.limit)})">Anterior</button><span>${p.total?`${p.offset+1}–${Math.min(p.total,p.offset+p.items.length)}`:'0'} de ${Number(p.total)}</span><button class="btn ghost" ${p.offset+p.limit>=p.total?'disabled':''} onclick="openAdmin(state.adminSection,${p.offset+p.limit})">Siguiente</button></div>`:''}</section>`,true)
}
async function searchAdminUsers(e){e.preventDefault();state.adminQuery=String(new FormData(e.target).get('query')||'').trim();await openAdmin('users',0)}
async function adminSuspendUser(id,suspended){if(!adminAllowed()||state.adminBusy||id===state.user.id)return;const p=state.adminPage?.items.find(x=>x.id===id);if(!p)return;if(!confirm(`${suspended?'Suspender':'Reactivar'} la cuenta de ${profileDisplayName(p)}?${suspended?' No podrá publicar tareas, enviar ofertas ni mensajes.':''}`))return;state.adminBusy=true;render();try{const {error}=await sb.rpc('admin_set_user_suspended',{p_user_id:id,p_suspended:suspended});if(error)throw error;await openAdmin('users',state.adminOffset);state.notice=suspended?'Cuenta suspendida.':'Cuenta reactivada.'}catch(err){state.error='No pudimos cambiar la cuenta: '+err.message}finally{state.adminBusy=false;render()}}
async function adminReviewReport(source,id,closed){if(!adminAllowed()||state.adminBusy)return;state.adminBusy=true;render();try{const {error}=await sb.rpc('admin_review_report',{p_source:source,p_id:String(id),p_closed:closed});if(error)throw error;await openAdmin(state.adminSection,state.adminOffset);state.notice=closed?'Reporte marcado como revisado.':'Reporte reabierto.'}catch(err){state.error='No pudimos actualizar el reporte: '+err.message}finally{state.adminBusy=false;render()}}
async function adminOpenSupport(id){state.supportBackRoute='admin';await openSupportCase(id)}
function onboardingDone(){try{return localStorage.getItem('dohoy_onboarding_v1')==='1'}catch{return false}}
function openOnboarding(){state.onboardingStep=0;go('onboarding')}
function onboardingScreen(){const steps=[{title:'Publica',subtitle:'Tu pendiente tiene solución.',copy:'Describe lo que necesitas, agrega fotos y define cuánto ofreces. Tú eliges entre las propuestas recibidas.',icon:'plus',hint:'Para quienes necesitan ayuda'},{title:'Encuentra',subtitle:'Hay tareas cerca de ti.',copy:'Explora trabajos por categoría, precio y distancia. Envía una propuesta cuando encuentres uno que puedas realizar.',icon:'search',hint:'Para quienes quieren trabajar'},{title:'Realiza',subtitle:'Coordinen y terminen con confianza.',copy:'Hablen por el chat de la tarea, compartan evidencia del resultado y confirmen que quedó terminado. Después pueden calificarse.',icon:'verify',hint:'Una tarea, de principio a fin'}],i=Math.min(2,Math.max(0,state.onboardingStep||0)),s=steps[i];return shell(`<section class="onboarding"><div class="onboarding-top">${logo(true)}<button class="onboarding-skip" onclick="finishOnboarding()">Omitir</button></div><div class="onboarding-content"><div class="onboarding-art step-${i}"><span class="onboarding-orbit"></span><div>${iconSvg(s.icon)}</div><span class="onboarding-badge">${escapeHtml(s.hint)}</span></div><p class="kicker">${i+1} de 3</p><h1>${s.title}</h1><h2>${s.subtitle}</h2><p>${s.copy}</p></div><div class="onboarding-bottom"><div class="onboarding-dots" role="group" aria-label="Pasos de bienvenida">${steps.map((x,j)=>`<button class="${i===j?'current':''}" aria-label="Paso ${j+1}: ${x.title}" aria-pressed="${i===j}" onclick="onboardingStep(${j})"><span></span></button>`).join('')}</div><button class="btn primary" onclick="${i===2?'finishOnboarding()':`onboardingStep(${i+1})`}">${i===2?'Elegir cómo usar DOHOY':'Continuar'}</button>${i>0?`<button class="text-action onboarding-back" onclick="onboardingStep(${i-1})">Volver</button>`:''}</div></section>`)}
function onboardingStep(i){state.onboardingStep=Math.min(2,Math.max(0,i));go('onboarding')}
function finishOnboarding(){try{localStorage.setItem('dohoy_onboarding_v1','1')}catch{}go('mode')}
function suspendedScreen(){return shell(`<section class="screen"><div class="top">${logo(true)}</div><div class="setting-empty">${iconSvg('shield')}<h1>Cuenta suspendida</h1><p>Contacta a soporte para revisar tu situación. Puedes consultar tus casos y enviar información.</p></div>${authMsg()}<button class="btn primary" onclick="openSupportCenter()">Soporte y disputas</button><button class="btn ghost" onclick="signOutCurrent()">Cerrar sesión</button></section>`)}

window.removePendingTaskPhoto=removePendingTaskPhoto;window.removeCompletionEvidence=removeCompletionEvidence;window.selectCompletionEvidence=selectCompletionEvidence;window.openMediaPhoto=openMediaPhoto;window.openClientProfile=openClientProfile;window.saveClientRating=saveClientRating;window.openSafetyCenter=openSafetyCenter;window.openBlockedUsers=openBlockedUsers;window.unblockUser=unblockUser;window.openMyReports=openMyReports;window.shareCurrentTask=shareCurrentTask;window.selectTaskPhotos=selectTaskPhotos;window.openCounterOfferSheet=openCounterOfferSheet;window.submitCounterOffer=submitCounterOffer;window.respondCounterOffer=respondCounterOffer;window.markTaskEnRoute=markTaskEnRoute;window.markTaskArrived=markTaskArrived;window.saveEditTask=saveEditTask;window.state=state;window.openProfileField=openProfileField;window.openPhotoChoiceSheet=openPhotoChoiceSheet;window.openGalleryPicker=openGalleryPicker;window.handleGalleryPhoto=handleGalleryPhoto;window.closeProfileSheet=closeProfileSheet;window.saveProfileField=saveProfileField;window.saveSocialNetworks=saveSocialNetworks;window.requestAccountDeletion=requestAccountDeletion;window.go=go;window.mode=mode;window.signOut=signOut;window.openTask=openTask;window.acceptOffer=acceptOffer;window.startTask=startTask;window.requestTaskCompletion=requestTaskCompletion;window.confirmTaskCompletion=confirmTaskCompletion;window.setTaskStatus=setTaskStatus;window.openChat=openChat;window.openMessagesHome=openMessagesHome;window.sendMessage=sendMessage;window.backFromChat=backFromChat;window.toggleVehicleOptions=toggleVehicleOptions;window.updateVehiclePreview=updateVehiclePreview;window.updateCategoryPreview=updateCategoryPreview;window.openWorkerProfile=openWorkerProfile;window.openWorkerPhoto=openWorkerPhoto;window.closeWorkerPhoto=closeWorkerPhoto;window.openConversationFromList=openConversationFromList;window.bindConversationSwipes=bindConversationSwipes;window.selectTaskRating=selectTaskRating;window.clearTaskRating=clearTaskRating;window.deleteConversation=deleteConversation;window.openNotificationsCenter=openNotificationsCenter;window.openNotification=openNotification;window.markAllNotificationsRead=markAllNotificationsRead;window.openCancelTaskSheet=openCancelTaskSheet;window.submitCancelTask=submitCancelTask;window.openCompletionProblemSheet=openCompletionProblemSheet;window.submitCompletionProblem=submitCompletionProblem;window.openUserReportSheet=openUserReportSheet;window.submitUserReport=submitUserReport;window.blockOtherUser=blockOtherUser;window.toggleFavoriteWorker=toggleFavoriteWorker;window.openFavorites=openFavorites;window.saveRatingReview=saveRatingReview;
window.addEventListener('online',()=>{state.online=true;render()});window.addEventListener('offline',()=>{state.online=false;render()});
window.filterWorkerTasks=filterWorkerTasks;window.setWorkerFilter=setWorkerFilter;window.resetWorkerFilters=resetWorkerFilters;window.saveSearchPreferences=saveSearchPreferences;window.openWorkerCategory=openWorkerCategory;window.requestDiscoveryLocation=requestDiscoveryLocation;window.enablePushNotifications=enablePushNotifications;window.disablePushNotifications=disablePushNotifications;window.openSupportCenter=openSupportCenter;window.newSupportCase=newSupportCase;window.selectSupportFiles=selectSupportFiles;window.removeSupportFile=removeSupportFile;window.submitSupportCase=submitSupportCase;window.openSupportCase=openSupportCase;window.editSupportDraft=editSupportDraft;window.replySupportCase=replySupportCase;
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='DOHOY_OPEN_TASK')openTaskFromPush(e.data.taskId);if(e.data?.type==='DOHOY_OPEN_ACTIVITY'){if(state.user)openNotificationsCenter();else sessionStorage.setItem('dohoy_pending_activity','1')}});
init();
</script></body></html>
